<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.5 system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>下課十分鐘</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@500;700;900&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: a toy-shop pegboard wall. A yellow shop sign hangs at the top; game cards hang below it on hooks, one row per category. Picking a card slides a player layer over the whole board. */
:root{
  --board:#e2e5ea;
  --hole:rgba(36,46,74,.2);
  --card:#fcfcfa;
  --ink:#1b2031;
  --muted:#596178;
  --line:#c9ced8;
  --accent:#2c54d1;
  --on-accent:#ffffff;
  --sign:#ffd23f;
  --sign-ink:#1b2031;
  --peg:#8b919f;
  --stage:#12141a;
  --shadow:rgba(24,32,56,.12);
  --display:"Chiron GoRound TC","Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  --body:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  --num:"Fredoka","Chiron GoRound TC",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --board:#1c2029;--hole:rgba(0,0,0,.5);--card:#272c38;--ink:#eceff7;--muted:#a3aabd;--line:#394052;
    --accent:#88a3ff;--on-accent:#111a3a;--sign:#f2c52e;--sign-ink:#1b2031;--peg:#5d6474;--stage:#0d0f14;--shadow:rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --board:#1c2029;--hole:rgba(0,0,0,.5);--card:#272c38;--ink:#eceff7;--muted:#a3aabd;--line:#394052;
  --accent:#88a3ff;--on-accent:#111a3a;--sign:#f2c52e;--sign-ink:#1b2031;--peg:#5d6474;--stage:#0d0f14;--shadow:rgba(0,0,0,.35);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0;color:var(--ink);font-family:var(--body);
  background-color:var(--board);
  background-image:radial-gradient(circle,var(--hole) 2.4px,transparent 3px);
  background-size:26px 26px;background-position:13px 13px;
  -webkit-tap-highlight-color:transparent;
}
body.playing{overflow:hidden}
.wrap{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:22px;
  padding-block:24px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px))}

/* the shop sign, hung from two pegs */
.sign{position:relative;margin-top:8px;padding:22px 22px 18px;border-radius:16px;background:var(--sign);color:var(--sign-ink);box-shadow:0 5px 0 rgba(0,0,0,.14);display:flex;flex-direction:column;gap:6px}
.sign::before,.sign::after{content:"";position:absolute;top:-8px;width:14px;height:14px;border-radius:50%;background:var(--peg);box-shadow:inset 0 -2px 0 rgba(0,0,0,.25)}
.sign::before{left:30px}.sign::after{right:30px}
.sign h1{margin:0;font-family:var(--display);font-weight:900;font-size:clamp(2rem,7vw,3rem);line-height:1.1;letter-spacing:.06em;text-wrap:balance}
.sign p{margin:0;font-size:.95rem;line-height:1.65;max-width:44ch}
.sign .bell{font-family:var(--display);font-weight:700;font-size:.85rem;letter-spacing:.08em}

.tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap;flex:1;min-width:0}
.chip{appearance:none;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 14px;font:700 .9rem var(--body);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip b{font-family:var(--num);font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--card)}
.chip[aria-pressed="true"] b{color:var(--sign)}
.random{appearance:none;border:0;border-radius:999px;background:var(--accent);color:var(--on-accent);padding:9px 18px;font:700 .9rem var(--body);cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.random svg{width:16px;height:16px}

#shelves{display:flex;flex-direction:column;gap:30px}
.shelf{display:flex;flex-direction:column;gap:14px}
.shelf h2{margin:0;display:flex;align-items:baseline;gap:10px;font-family:var(--display);font-weight:900;font-size:1.35rem;letter-spacing:.06em}
.shelf h2 span{font-family:var(--body);font-weight:500;font-size:.85rem;color:var(--muted);letter-spacing:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:26px 14px;padding-top:6px}

/* each game is a hang-tab card with a euro-slot hole at the top */
.card{position:relative;display:flex;flex-direction:column;gap:7px;padding:24px 10px 12px;border-radius:12px;background:var(--card);color:inherit;text-decoration:none;box-shadow:0 2px 0 var(--shadow),0 10px 20px var(--shadow);transition:transform .18s ease}
.card::before{content:"";position:absolute;top:8px;left:50%;width:32px;height:9px;margin-left:-16px;border-radius:5px;background:var(--board);box-shadow:inset 0 2px 2px rgba(0,0,0,.22)}
.card::after{content:"";position:absolute;top:-6px;left:50%;width:6px;height:20px;margin-left:-3px;border-radius:3px;background:var(--peg)}
.card:hover{transform:translateY(-3px) rotate(-.6deg)}
.card:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.thumb{display:block;aspect-ratio:3/4;max-width:100%;border-radius:8px;overflow:hidden;background:var(--line)}
.thumb img{display:block;width:100%;height:100%;object-fit:cover}
.name{font-family:var(--display);font-weight:700;font-size:1.05rem;line-height:1.3}
.desc{font-size:.8rem;line-height:1.5;color:var(--muted);min-height:3em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.best{margin-top:auto;padding-top:7px;border-top:1px dashed var(--line);display:flex;justify-content:space-between;align-items:baseline;gap:6px;font-size:.74rem;color:var(--muted)}
.best b{font-family:var(--num);font-weight:600;font-size:.95rem;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.best b.none{font-family:var(--body);font-weight:500;font-size:.78rem;color:var(--muted)}
.last{position:absolute;top:32px;left:16px;z-index:1;padding:2px 9px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-size:.7rem;font-weight:700;letter-spacing:.06em}
.foot{font-size:.8rem;color:var(--muted);line-height:1.6}

/* player layer */
.player{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;background:var(--stage);padding-bottom:env(safe-area-inset-bottom,0px)}
.pbar{display:flex;align-items:center;gap:10px;background:var(--sign);color:var(--sign-ink);
  padding-top:max(8px,env(safe-area-inset-top,0px));padding-bottom:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.pbar h2{flex:1;min-width:0;margin:0;font-family:var(--display);font-weight:900;font-size:1.05rem;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.pbtn{appearance:none;border:1.5px solid var(--sign-ink);background:transparent;color:var(--sign-ink);border-radius:999px;padding:6px 12px;font:700 .85rem var(--body);cursor:pointer;white-space:nowrap}
.pbtn.solid{background:var(--sign-ink);color:var(--sign)}
.screen{position:relative;flex:1;min-height:0}
.screen iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:var(--stage)}
.status{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:12px;color:#c9cfdd;font-size:.95rem;text-align:center;padding:24px}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.pbar button:focus-visible{outline-color:var(--sign-ink)}
@media (max-width:420px){.pbtn.hide-sm{display:none}}

/* online leaderboard */
.top{display:flex;justify-content:space-between;align-items:baseline;gap:6px;font-size:.74rem;color:var(--muted);min-width:0}
.top span{flex:none}
.top b{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700;color:var(--accent)}
.top b em{font-style:normal;font-family:var(--num);font-weight:600;color:var(--ink);margin-left:4px}
.top b.none{font-weight:500;color:var(--muted)}
.pbtn.rank{background:var(--card);border-color:var(--sign-ink)}
.rank-panel{position:absolute;top:10px;right:max(12px,env(safe-area-inset-right,0px));z-index:4;width:min(340px,calc(100% - 24px));max-height:calc(100% - 20px);display:flex;flex-direction:column;border-radius:14px;background:var(--card);color:var(--ink);box-shadow:0 18px 40px rgba(0,0,0,.45);overflow:hidden}
.rank-head{display:flex;align-items:center;gap:8px;padding:12px 12px 10px 16px;background:var(--sign);color:var(--sign-ink)}
.rank-head h3{flex:1;min-width:0;margin:0;font-family:var(--display);font-weight:900;font-size:1rem;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank-close{appearance:none;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--sign-ink);background:transparent;color:var(--sign-ink);font-size:1rem;cursor:pointer;display:grid;place-items:center;padding:0}
.rank-tabs{display:flex;gap:6px;padding:10px 12px 0}
.rank-tabs button{appearance:none;flex:1;border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:5px 0;font:700 .8rem var(--body);cursor:pointer}
.rank-tabs button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--card)}
.rank-list{list-style:none;margin:0;padding:6px 8px 10px;overflow-y:auto}
.rank-list li{display:grid;grid-template-columns:2.2em minmax(0,1fr) auto;align-items:baseline;gap:8px;padding:7px 8px;border-radius:8px;font-size:.9rem}
.rank-list li:nth-child(odd){background:color-mix(in srgb,var(--line) 30%,transparent)}
.rank-list li.me{outline:2px solid var(--accent);outline-offset:-2px}
.rank-list .no{font-family:var(--num);font-weight:600;color:var(--muted);text-align:right}
.rank-list li:nth-child(-n+3) .no{color:var(--accent)}
.rank-list .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.rank-list .sc{font-family:var(--num);font-weight:600;font-variant-numeric:tabular-nums}
.rank-note{padding:14px 16px 18px;font-size:.86rem;color:var(--muted);line-height:1.6}
.rank-me{padding:8px 16px 12px;border-top:1px dashed var(--line);font-size:.8rem;color:var(--muted)}
.dialog-back{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:16px;background:rgba(10,14,24,.55)}
.dialog{width:min(360px,100%);padding:18px;border-radius:16px;background:var(--card);color:var(--ink);box-shadow:0 20px 50px rgba(0,0,0,.4);display:flex;flex-direction:column;gap:12px}
.dialog h3{margin:0;font-family:var(--display);font-weight:900;font-size:1.15rem}
.dialog p{margin:0;font-size:.88rem;color:var(--muted);line-height:1.6}
.name-row{display:flex;gap:8px}
.name-row input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:10px;background:var(--board);color:var(--ink);font:700 1rem var(--body);padding:9px 12px}
.name-row input:focus{outline:2px solid var(--accent);outline-offset:1px}
.dice{appearance:none;flex:none;width:42px;border:1.5px solid var(--line);border-radius:10px;background:transparent;color:var(--ink);cursor:pointer;font-size:.85rem;font-weight:700}
.dialog .err{min-height:1.2em;color:#d9534f;font-size:.82rem}
.dialog-actions{display:flex;gap:8px;justify-content:flex-end}
.dialog-actions button{appearance:none;border-radius:999px;padding:9px 18px;font:700 .9rem var(--body);cursor:pointer}
.btn-ghost{border:1.5px solid var(--line);background:transparent;color:var(--ink)}
.btn-main{border:0;background:var(--accent);color:var(--on-accent)}
.random.alt{background:var(--card);color:var(--ink);border:3px solid var(--ink);font-weight:900}
.dialog.all{width:min(440px,100%);max-height:calc(100% - 32px);gap:10px}
.all-head{display:flex;align-items:center;justify-content:space-between}
.all-head button{appearance:none;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;padding:0}
.dialog.all .rank-tabs{padding:0}
.all-list{min-height:0;overflow-y:auto;display:flex;flex-direction:column;margin:0 -6px}
.all-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;padding:8px 6px;border-radius:8px;color:inherit;text-decoration:none}
.all-row:nth-child(odd){background:color-mix(in srgb,var(--line) 30%,transparent)}
.all-row.me{outline:2px solid var(--accent);outline-offset:-2px}
.all-tag{font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:999px;border:1.5px solid var(--line);color:var(--muted)}
.all-name{min-width:0;display:flex;flex-direction:column;line-height:1.3;font-weight:700;font-size:.92rem}
.all-name small{font-weight:500;font-size:.76rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.all-score{font-family:var(--num);font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.all-score.none{font-family:var(--body);font-weight:500;font-size:.8rem;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:max(20px,calc(env(safe-area-inset-bottom,0px) + 14px));z-index:70;transform:translateX(-50%);max-width:calc(100% - 32px);padding:10px 16px;border-radius:999px;background:var(--ink);color:var(--card);font-size:.88rem;font-weight:700;box-shadow:0 10px 24px rgba(0,0,0,.3)}
@media (prefers-reduced-motion:reduce){.card{transition:none}.card:hover{transform:none}}
</style>

<div class="wrap" id="lobby">
  <header class="sign">
    <span class="bell">噹——噹——噹——</span>
    <h1>下課十分鐘</h1>
    <p><span id="game-count">16</span> 款小遊戲掛在這面牆上，挑一款就開玩，玩到上課鐘響。手機用手指，電腦用鍵盤或滑鼠。</p>
  </header>

  <div class="tools">
    <div class="chips" id="chips" role="group" aria-label="依類型篩選"></div>
    <button 
      class="random alt" id="all-btn" type="button">

<script>
(() => {
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const $ = id => document.getElementById(id);

/* ---------- game registry: one entry per file in games/ ---------- */
const score = (key, unit) => () => { const v = store.get(key, 0); return v > 0 ? `${v} ${unit}` : null; };
const GAMES = [
  { id: 'mahjong2048', title: '麻將 2048', cat: '益智', desc: '滑動合併麻將牌，合出「發財」就是 2048。', best: score('mj2048.best', '分') },
  { id: 'zodiac',      title: '生肖翻牌',   cat: '益智', desc: '先記住十二生肖的位置，再限時配對。', best: score('zodiac.best', '分') },
  { id: 'mines',       title: '測量踩地雷', cat: '益智', desc: '三種難度，長按插旗，挖開會露出等高線。', best: () => {
      const b = store.get('mines.best', {}) || {};
      for (const [k, n] of [['hard', '高級'], ['mid', '中級'], ['easy', '初級']]) if (b[k] != null) return `${n} ${b[k]} 秒`;
      return null;
    } },
  { id: 'bloodlab',    title: '抽血櫃台',   cat: '反應', desc: '四個櫃台照叫號抽血，計量條停在黃區分數最高。', best: score('bloodlab.best', '分') },
  { id: 'blueprint',   title: '藍圖方塊',   cat: '益智', desc: '排滿一整列就消掉，每消十行升一級。', best: score('blueprint.best', '分') },
  { id: 'tower',       title: '疊疊塔',     cat: '反應', desc: '點一下放下滑動的樓層，對得越準蓋得越高。', best: score('tower.best', '層') },
  { id: 'snake',       title: '掌機貪食蛇', cat: '反應', desc: '滑動轉彎，每吃五顆出現限時大餌。', best: score('snake.best', '分') },
  { id: 'mole',        title: '草皮打地鼠', cat: '反應', desc: '45 秒一局，金色地鼠多給分，炸彈別敲。', best: score('mole.best', '分') },
  { id: 'piano',       title: '月光鋼琴',   cat: '反應', desc: '只踩黑鍵，每點一下彈出曲子的下一個音。', best: score('piano.best', '個音') },
  { id: 'boba',        title: '珍珠接接樂', cat: '反應', desc: '拖杯子接珍珠，裝滿一杯換口味，避開辣椒。', best: score('boba.best', '分') },
  { id: 'goldfish',    title: '夜市撈金魚', cat: '反應', desc: '慢慢滑到金魚底下再撈，紙網泡太久會破。', best: score('goldfish.best', '分') },
  { id: 'ringtoss',    title: '夜市套圈圈', cat: '動作', desc: '往下拉再放開丟竹圈，整個套住獎品才算。', best: score('ringtoss.best', '分') },
  { id: 'bricks',      title: '套色打磚塊', cat: '動作', desc: '孔版印刷風打磚塊，四種道具輪流掉。', best: score('riso.best', '分') },
  { id: 'stardust',    title: '星塵防線',   cat: '動作', desc: '拖曳移動、自動開火，撐到母艦出現。', best: score('stardust.best', '分') },
  { id: 'plane',       title: '筆記本紙飛機', cat: '動作', desc: '點一下往上飄，從鉛筆之間的縫鑽過去。', best: score('plane.best', '枝') },
  { id: 'rooftop',     title: '屋頂貓',     cat: '動作', desc: '黑貓在公寓頂樓間跑酷，空中可以再跳一次。', best: score('roofcat.best', '分') }
];
const CATS = [
  { k: '益智', sub: '慢慢想' },
  { k: '反應', sub: '看準時機' },
  { k: '動作', sub: '手要快' }
];
const byId = Object.fromEntries(GAMES.map(g => [g.id, g]));

/* ---------- lobby ---------- */
const chipsEl = $('chips'), shelvesEl = $('shelves'), lobby = $('lobby');
let cat = store.get('lobby.cat', 'all');
if (cat !== 'all' && !CATS.some(c => c.k === cat)) cat = 'all';

function renderChips() {
  const items = [{ k: 'all', label: '全部', n: GAMES.length }, ...CATS.map(c => ({ k: c.k, label: c.k, n: GAMES.filter(g => g.cat === c.k).length }))];
  chipsEl.innerHTML = '';
  for (const it of items) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'chip'; b.dataset.cat = it.k;
    b.setAttribute('aria-pressed', String(cat === it.k));
    b.innerHTML = `${it.label}<b>${it.n}</b>`;
    b.addEventListener('click', () => { cat = it.k; store.set('lobby.cat', cat); applyFilter(); });
    chipsEl.appendChild(b);
  }
}
function renderShelves() {
  shelvesEl.innerHTML = '';
  for (const c of CATS) {
    const list = GAMES.filter(g => g.cat === c.k);
    const sec = document.createElement('section');
    sec.className = 'shelf'; sec.dataset.cat = c.k;
    sec.innerHTML = `<h2>${c.k}<span>${list.length} 款・${c.sub}</span></h2><div class="grid"></div>`;
    const grid = sec.querySelector('.grid');
    for (const g of list) {
      const a = document.createElement('a');
      a.className = 'card'; a.href = '#' + g.id; a.dataset.id = g.id;
      a.innerHTML = `<span class="thumb"><img src="thumbs/${g.id}.jpg" alt="${g.title}的遊戲畫面" width="300" height="400" loading="lazy" decoding="async"></span>
        <span class="name">${g.title}</span><span class="desc">${g.desc}</span>
        <span class="top"><span>第一名</span><b class="none">載入中…</b></span>
        <span class="best"><span>我的最高</span><b></b></span><span class="last" hidden>上次玩</span>`;
      a.addEventListener('click', e => { e.preventDefault(); go(g.id); });
      grid.appendChild(a);
    }
    shelvesEl.appendChild(sec);
  }
}
function applyFilter() {
  chipsEl.querySelectorAll('.chip').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.cat === cat)));
  shelvesEl.querySelectorAll('.shelf').forEach(s => { s.hidden = cat !== 'all' && s.dataset.cat !== cat; });
}
function refreshCards() {
  const last = store.get('lobby.last', null);
  shelvesEl.querySelectorAll('.card').forEach(a => {
    const g = byId[a.dataset.id], v = g.best(), b = a.querySelector('.best b');
    b.textContent = v || '還沒玩過';
    b.classList.toggle('none', !v);
    a.querySelector('.last').hidden = a.dataset.id !== last;
  });
}

/* ---------- player: each game runs in its own iframe ---------- */
const player = $('player'), screenEl = $('screen'), statusEl = $('status'), pTitle = $('p-title');
let frame = null, current = null, token = 0, loadTimer = 0;

function unmount() {
  token++; clearTimeout(loadTimer);
  if (frame) { frame.remove(); frame = null; }   // removing the iframe stops its loops, listeners and audio
  current = null;
}
async function mount(g) {
  unmount();
  const my = token;
  current = g.id;
  pTitle.textContent = g.title;
  player.hidden = false; document.body.classList.add('playing'); lobby.inert = true;
  statusEl.textContent = '載入中…'; statusEl.hidden = false;
  store.set('lobby.last', g.id);

  const f = document.createElement('iframe');
  f.title = g.title;
  f.setAttribute('allow', 'autoplay; fullscreen');
  f.addEventListener('load', () => {
    if (my !== token) return;
    clearTimeout(loadTimer); statusEl.hidden = true;
    try { f.contentWindow.focus(); } catch (e) {}
  });
  const url = 'games/' + g.id + '.html';
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error(res.status);
    const html = await res.text();
    if (my !== token) return;
    f.srcdoc = html;              // same-origin document: shares localStorage with the lobby
  } catch (e) {
    if (my !== token) return;
    f.src = url;                  // fallback, e.g. when opened straight from disk
  }
  loadTimer = setTimeout(() => {
    if (my !== token) return;
    statusEl.textContent = '這款遊戲載入不了。按「重玩」再試一次，或回大廳換一款。';
  }, 10000);
  screenEl.appendChild(f); frame = f;
}
function close() {
  const was = current;
  unmount();
  player.hidden = true; document.body.classList.remove('playing'); lobby.inert = false;
  refreshCards();
  if (was) { const card = shelvesEl.querySelector(`.card[data-id="${was}"]`); if (card) try { card.focus({ preventScroll: true }); } catch (e) {} }
}

/* ---------- routing on #id so a game can be linked directly ---------- */
function route() {
  const id = decodeURIComponent(location.hash.slice(1));
  const g = byId[id];
  if (g) { if (current !== g.id) mount(g); }
  else if (!player.hidden) close();
}
function go(id) {
  const want = id ? '#' + id : '';
  if (location.hash !== want) { try { location.hash = id; } catch (e) {} }
  route();
}
function pickRandom() {
  const last = store.get('lobby.last', null);
  const pool = GAMES.filter(g => g.id !== current && g.id !== last && (cat === 'all' || g.cat === cat || current));
  const list = pool.length ? pool : GAMES;
  return list[Math.floor(Math.random() * list.length)].id;
}

$('back').addEventListener('click', () => go(''));
$('reload').addEventListener('click', () => { if (current) mount(byId[current]); });
$('shuffle').addEventListener('click', () => go(pickRandom()));
$('random').addEventListener('click', () => go(pickRandom()));
addEventListener('hashchange', route);
addEventListener('storage', e => { if (e.key && e.key.endsWith('.best')) refreshCards(); });

$('game-count').textContent = GAMES.length;
renderChips(); renderShelves(); applyFilter(); refreshCards(); route();
})();
</script>

<script type="module">
/* ---------- 線上排行榜：卡片上的第一名、遊戲裡的前 20 名、上傳成績 ---------- */
import { submitScore, getBoard, cleanName, isMock } from './leaderboard.js';

const $ = id => document.getElementById(id);
const local = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};
const UNIT = { tower: '層', piano: '音', plane: '枝', 'mines-easy': '秒', 'mines-mid': '秒', 'mines-hard': '秒' };
const MINES = [['mines-easy', '初級'], ['mines-mid', '中級'], ['mines-hard', '高級']];
const isAsc = g => g.startsWith('mines-');
const better = (g, a, b) => (isAsc(g) ? a < b : a > b);
const boardOf = id => (id === 'mines' ? 'mines-easy' : id);     // 踩地雷的卡片顯示初級第一名
const fmt = (g, v) => `${Number(v).toLocaleString()} ${UNIT[g] || '分'}`;

/* ---------- 提示訊息 ---------- */
let toastT = 0;
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 2800);
}

/* ---------- 第一次上榜時取名字 ---------- */
const ADJ = ['勇敢的', '快手', '愛吃的', '夜市', '神準', '想睡的', '下課的', '認真的'];
const NOUN = ['金魚', '護理師', '竹圈', '紙飛機', '黑貓', '鋼琴手', '地鼠', '珍珠'];
const randomName = () => ADJ[Math.random() * ADJ.length | 0] + NOUN[Math.random() * NOUN.length | 0];
function askName() {
  return new Promise(resolve => {
    const back = $('name-dialog'), input = $('name-input'), err = $('name-err'), form = $('name-form');
    input.value = randomName(); err.textContent = ''; back.hidden = false;
    setTimeout(() => { input.focus(); input.select(); }, 30);
    const done = v => { back.hidden = true; form.onsubmit = null; $('name-skip').onclick = null; $('name-dice').onclick = null; resolve(v); };
    $('name-dice').onclick = () => { input.value = randomName(); input.focus(); };
    $('name-skip').onclick = () => done(null);
    form.onsubmit = e => {
      e.preventDefault();
      const r = cleanName(input.value);
      if (r.error) { err.textContent = r.error; return; }
      done(r.name);
    };
  });
}
let asking = null;
async function getName() {
  const saved = local.get('arcade.name');
  if (saved) return saved;
  if (!asking) asking = askName().then(v => { asking = null; if (v) local.set('arcade.name', v); return v; });
  return asking;
}

/* ---------- 卡片上的第一名（快取 1 分鐘，省 Firestore 讀取次數） ---------- */
const TTL = 1 * 60e3;
const readTops = () => { try { return JSON.parse(sessionStorage.getItem('arcade.tops')) || {}; } catch (e) { return {}; } };
const saveTops = t => { try { sessionStorage.setItem('arcade.tops', JSON.stringify(t)); } catch (e) {} };
function paintTop(id, entry, failed) {
  const row = document.querySelector(`.card[data-id="${id}"] .top`);
  if (!row) return;
  const b = row.querySelector('b'), g = boardOf(id);
  if (id === 'mines') row.firstElementChild.textContent = '初級第一';
  if (failed) { b.className = 'none'; b.textContent = '暫時連不上'; return; }
  if (!entry) { b.className = 'none'; b.textContent = '還沒人上榜'; return; }
  b.className = ''; b.textContent = entry.name;
  const em = document.createElement('em'); em.textContent = fmt(g, entry.score); b.append(em);
  b.title = `${entry.name} ${fmt(g, entry.score)}`;
}
async function topOf(g, cache, now) {              // 先看快取，過期才查 Firestore
  const c = cache[g];
  if (c && now - c.at < TTL) return c.top;
  const [top] = await getBoard(g, 1);
  cache[g] = { top: top || null, at: now };
  return top || null;
}
async function loadTops() {
  const cache = readTops(), now = Date.now();
  const ids = [...document.querySelectorAll('.card[data-id]')].map(c => c.dataset.id);
  await Promise.all(ids.map(async id => {
    try { paintTop(id, await topOf(boardOf(id), cache, now)); }
    catch (e) { paintTop(id, null, true); }
  }));
  saveTops(cache);
}

/* ---------- 遊戲結束：收到分數就上傳 ---------- */
addEventListener('message', async e => {
  const frame = document.querySelector('#screen iframe');
  if (!frame || e.source !== frame.contentWindow) return;          // 只收目前這款遊戲傳的
  const d = e.data;
  if (!d || d.type !== 'arcade:score' || typeof d.game !== 'string' || !Number.isInteger(d.score)) return;
  if (!isAsc(d.game) && d.score <= 0) return;
  const name = await getName();
  if (!name) { toast('這次先不上傳，下次玩完會再問你'); return; }
  try {
    const r = await submitScore(d.game, name, d.score);
    if (!r.improved) { toast(`沒超過你的最佳 ${fmt(d.game, r.best)}`); return; }
    toast(`已上傳排行榜：${name} ${fmt(d.game, d.score)}`);
    const cache = readTops(), c = cache[d.game];
    if (c && (!c.top || better(d.game, d.score, c.top.score))) { c.top = { name, score: d.score }; saveTops(cache); }
    if (!$('rank-panel').hidden && rankGame === d.game) showBoard(d.game);
  } catch (err) {
    console.warn('排行榜上傳失敗', err);
    toast('排行榜暫時連不上，這次沒上傳成功');
  }
});

/* ---------- 遊戲右上角的前 20 名 ---------- */
let rankGame = null;
function currentGameId() {
  const id = decodeURIComponent(location.hash.slice(1));
  return id && document.querySelector(`.card[data-id="${CSS.escape(id)}"]`) ? id : null;
}
async function showBoard(g) {
  rankGame = g;
  const list = $('rank-list'), note = $('rank-note'), meEl = $('rank-me'), me = local.get('arcade.name');
  list.innerHTML = ''; note.hidden = false; note.textContent = '載入中…'; meEl.textContent = '';
  try {
    const rows = await getBoard(g, 20);
    if (rankGame !== g) return;
    note.hidden = rows.length > 0;
    if (!rows.length) note.textContent = '還沒有人上榜，玩一局搶第一名！';
    rows.forEach((r, i) => {
      const li = document.createElement('li');
      if (r.name === me) li.className = 'me';
      for (const [cls, text] of [['no', i + 1], ['nm', r.name], ['sc', fmt(g, r.score)]]) {
        const s = document.createElement('span'); s.className = cls; s.textContent = text; li.append(s);
      }
      list.append(li);
    });
    const mine = rows.findIndex(r => r.name === me);
    meEl.textContent = !me ? '玩完一局就能取名字上榜'
      : mine >= 0 ? `你是第 ${mine + 1} 名（${me}）` : `你的名字是「${me}」，還沒進前 20 名`;
    if (isMock) meEl.textContent += '・目前是本機測試資料';
  } catch (e) {
    if (rankGame !== g) return;
    note.hidden = false; note.textContent = '排行榜暫時連不上，稍後再試。';
  }
}
function openRank() {
  const id = currentGameId();
  if (!id) return;
  $('rank-title').textContent = `${document.querySelector(`.card[data-id="${id}"] .name`).textContent}・前 20 名`;
  const tabs = $('rank-tabs');
  if (id === 'mines') {
    let lv = 'easy'; try { lv = JSON.parse(local.get('mines.lv')) || 'easy'; } catch (e) {}
    const start = MINES.some(([g]) => g === 'mines-' + lv) ? 'mines-' + lv : 'mines-easy';
    tabs.innerHTML = '';
    for (const [g, label] of MINES) {
      const b = document.createElement('button');
      b.type = 'button'; b.textContent = label; b.setAttribute('aria-pressed', String(g === start));
      b.onclick = () => { tabs.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x === b))); showBoard(g); };
      tabs.append(b);
    }
    tabs.hidden = false; showBoard(start);
  } else { tabs.hidden = true; showBoard(id); }
  $('rank-panel').hidden = false; $('rank-btn').setAttribute('aria-expanded', 'true');
}
function closeRank() { $('rank-panel').hidden = true; $('rank-btn').setAttribute('aria-expanded', 'false'); rankGame = null; }
$('rank-btn').addEventListener('click', () => ($('rank-panel').hidden ? openRank() : closeRank()));
$('rank-close').addEventListener('click', closeRank);
addEventListener('keydown', e => { if (e.key === 'Escape' && !$('rank-panel').hidden) closeRank(); });
addEventListener('hashchange', () => { closeRank(); if (!currentGameId()) loadTops(); });

/* ---------- 總排行榜：所有遊戲的第一名，依類型分組，點一列直接去玩 ---------- */
const allDialog = $('all-dialog'), allList = $('all-list'), allTabs = $('all-tabs');
function openAll() {
  const me = local.get('arcade.name'), rows = [], cats = ['全部'];
  document.querySelectorAll('.shelf').forEach(sh => {
    cats.push(sh.dataset.cat);
    sh.querySelectorAll('.card').forEach(a => {
      const id = a.dataset.id, title = a.querySelector('.name').textContent;
      if (id === 'mines') MINES.forEach(([g, lv]) => rows.push({ g, id, cat: sh.dataset.cat, title: `${title}・${lv}` }));
      else rows.push({ g: id, id, cat: sh.dataset.cat, title });
    });
  });
  const filter = cat => {
    allTabs.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.textContent === cat)));
    allList.querySelectorAll('.all-row').forEach(r => { r.hidden = cat !== '全部' && r.dataset.cat !== cat; });
  };
  allTabs.innerHTML = '';
  for (const c of cats) { const b = document.createElement('button'); b.type = 'button'; b.textContent = c; b.onclick = () => filter(c); allTabs.append(b); }
  allList.innerHTML = '';
  const cache = readTops(), now = Date.now();
  Promise.all(rows.map(async r => {
    const el = document.createElement('a');
    el.className = 'all-row'; el.href = '#' + r.id; el.dataset.cat = r.cat;
    el.innerHTML = '<span class="all-tag"></span><span class="all-name"><span></span><small>載入中…</small></span><span class="all-score none">—</span>';
    el.querySelector('.all-tag').textContent = r.cat;
    el.querySelector('.all-name span').textContent = r.title;
    allList.append(el);
    const small = el.querySelector('small'), score = el.querySelector('.all-score');
    try {
      const top = await topOf(r.g, cache, now);
      if (!top) { small.textContent = '還沒人上榜'; return; }
      small.textContent = '第一名 ' + top.name; score.textContent = fmt(r.g, top.score); score.classList.remove('none');
      el.classList.toggle('me', top.name === me);
    } catch (e) { small.textContent = '暫時連不上'; }
  })).then(() => saveTops(cache));
  filter('全部'); allDialog.hidden = false;
}
const closeAll = () => { allDialog.hidden = true; };
$('all-btn').addEventListener('click', openAll);
$('all-close').addEventListener('click', closeAll);
allDialog.addEventListener('click', e => { if (e.target === allDialog || e.target.closest('.all-row')) closeAll(); });
addEventListener('keydown', e => { if (e.key === 'Escape' && !allDialog.hidden) closeAll(); });

loadTops();
</script>
