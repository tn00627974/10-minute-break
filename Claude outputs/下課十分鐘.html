<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.5 system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>下課十分鐘</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@500;700;900&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: a toy-shop pegboard wall. A yellow shop sign hangs at the top; game cards hang below it on hooks, one row per category. Picking a card slides a player layer over the whole board. */
:root{
  --board:#e2e5ea;
  --hole:rgba(36,46,74,.2);
  --card:#fcfcfa;
  --ink:#1b2031;
  --muted:#596178;
  --line:#c9ced8;
  --accent:#2c54d1;
  --on-accent:#ffffff;
  --sign:#ffd23f;
  --sign-ink:#1b2031;
  --peg:#8b919f;
  --stage:#12141a;
  --shadow:rgba(24,32,56,.12);
  --display:"Chiron GoRound TC","Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  --body:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  --num:"Fredoka","Chiron GoRound TC",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --board:#1c2029;--hole:rgba(0,0,0,.5);--card:#272c38;--ink:#eceff7;--muted:#a3aabd;--line:#394052;
    --accent:#88a3ff;--on-accent:#111a3a;--sign:#f2c52e;--sign-ink:#1b2031;--peg:#5d6474;--stage:#0d0f14;--shadow:rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --board:#1c2029;--hole:rgba(0,0,0,.5);--card:#272c38;--ink:#eceff7;--muted:#a3aabd;--line:#394052;
  --accent:#88a3ff;--on-accent:#111a3a;--sign:#f2c52e;--sign-ink:#1b2031;--peg:#5d6474;--stage:#0d0f14;--shadow:rgba(0,0,0,.35);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0;color:var(--ink);font-family:var(--body);
  background-color:var(--board);
  background-image:radial-gradient(circle,var(--hole) 2.4px,transparent 3px);
  background-size:26px 26px;background-position:13px 13px;
  -webkit-tap-highlight-color:transparent;
}
body.playing{overflow:hidden}
.wrap{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:22px;
  padding-block:24px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px))}

/* the shop sign, hung from two pegs */
.sign{position:relative;margin-top:8px;padding:22px 22px 18px;border-radius:16px;background:var(--sign);color:var(--sign-ink);box-shadow:0 5px 0 rgba(0,0,0,.14);display:flex;flex-direction:column;gap:6px}
.sign::before,.sign::after{content:"";position:absolute;top:-8px;width:14px;height:14px;border-radius:50%;background:var(--peg);box-shadow:inset 0 -2px 0 rgba(0,0,0,.25)}
.sign::before{left:30px}.sign::after{right:30px}
.sign h1{margin:0;font-family:var(--display);font-weight:900;font-size:clamp(2rem,7vw,3rem);line-height:1.1;letter-spacing:.06em;text-wrap:balance}
.sign p{margin:0;font-size:.95rem;line-height:1.65;max-width:44ch}
.sign .bell{font-family:var(--display);font-weight:700;font-size:.85rem;letter-spacing:.08em}

.tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap;flex:1;min-width:0}
.chip{appearance:none;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 14px;font:700 .9rem var(--body);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip b{font-family:var(--num);font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--card)}
.chip[aria-pressed="true"] b{color:var(--sign)}
.random{appearance:none;border:0;border-radius:999px;background:var(--accent);color:var(--on-accent);padding:9px 18px;font:700 .9rem var(--body);cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.random svg{width:16px;height:16px}

#shelves{display:flex;flex-direction:column;gap:30px}
.shelf{display:flex;flex-direction:column;gap:14px}
.shelf h2{margin:0;display:flex;align-items:baseline;gap:10px;font-family:var(--display);font-weight:900;font-size:1.35rem;letter-spacing:.06em}
.shelf h2 span{font-family:var(--body);font-weight:500;font-size:.85rem;color:var(--muted);letter-spacing:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:26px 14px;padding-top:6px}

/* each game is a hang-tab card with a euro-slot hole at the top */
.card{position:relative;display:flex;flex-direction:column;gap:7px;padding:24px 10px 12px;border-radius:12px;background:var(--card);color:inherit;text-decoration:none;box-shadow:0 2px 0 var(--shadow),0 10px 20px var(--shadow);transition:transform .18s ease}
.card::before{content:"";position:absolute;top:8px;left:50%;width:32px;height:9px;margin-left:-16px;border-radius:5px;background:var(--board);box-shadow:inset 0 2px 2px rgba(0,0,0,.22)}
.card::after{content:"";position:absolute;top:-6px;left:50%;width:6px;height:20px;margin-left:-3px;border-radius:3px;background:var(--peg)}
.card:hover{transform:translateY(-3px) rotate(-.6deg)}
.card:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.thumb{display:block;aspect-ratio:3/4;max-width:100%;border-radius:8px;overflow:hidden;background:var(--line)}
.thumb img{display:block;width:100%;height:100%;object-fit:cover}
.name{font-family:var(--display);font-weight:700;font-size:1.05rem;line-height:1.3}
.desc{font-size:.8rem;line-height:1.5;color:var(--muted);min-height:3em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.best{margin-top:auto;padding-top:7px;border-top:1px dashed var(--line);display:flex;justify-content:space-between;align-items:baseline;gap:6px;font-size:.74rem;color:var(--muted)}
.best b{font-family:var(--num);font-weight:600;font-size:.95rem;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.best b.none{font-family:var(--body);font-weight:500;font-size:.78rem;color:var(--muted)}
.last{position:absolute;top:32px;left:16px;z-index:1;padding:2px 9px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-size:.7rem;font-weight:700;letter-spacing:.06em}
.foot{font-size:.8rem;color:var(--muted);line-height:1.6}

/* player layer */
.player{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;background:var(--stage);padding-bottom:env(safe-area-inset-bottom,0px)}
.pbar{display:flex;align-items:center;gap:10px;background:var(--sign);color:var(--sign-ink);
  padding-top:max(8px,env(safe-area-inset-top,0px));padding-bottom:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.pbar h2{flex:1;min-width:0;margin:0;font-family:var(--display);font-weight:900;font-size:1.05rem;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.pbtn{appearance:none;border:1.5px solid var(--sign-ink);background:transparent;color:var(--sign-ink);border-radius:999px;padding:6px 12px;font:700 .85rem var(--body);cursor:pointer;white-space:nowrap}
.pbtn.solid{background:var(--sign-ink);color:var(--sign)}
.screen{position:relative;flex:1;min-height:0}
.screen iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:var(--stage)}
.status{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:12px;color:#c9cfdd;font-size:.95rem;text-align:center;padding:24px}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.pbar button:focus-visible{outline-color:var(--sign-ink)}
@media (max-width:420px){.pbtn.hide-sm{display:none}}

/* online leaderboard */
.top{display:flex;justify-content:space-between;align-items:baseline;gap:6px;font-size:.74rem;color:var(--muted);min-width:0}
.top span{flex:none}
.top b{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700;color:var(--accent)}
.top b em{font-style:normal;font-family:var(--num);font-weight:600;color:var(--ink);margin-left:4px}
.top b.none{font-weight:500;color:var(--muted)}
.pbtn.rank{background:var(--card);border-color:var(--sign-ink)}
.rank-panel{position:absolute;top:10px;right:max(12px,env(safe-area-inset-right,0px));z-index:4;width:min(340px,calc(100% - 24px));max-height:calc(100% - 20px);display:flex;flex-direction:column;border-radius:14px;background:var(--card);color:var(--ink);box-shadow:0 18px 40px rgba(0,0,0,.45);overflow:hidden}
.rank-head{display:flex;align-items:center;gap:8px;padding:12px 12px 10px 16px;background:var(--sign);color:var(--sign-ink)}
.rank-head h3{flex:1;min-width:0;margin:0;font-family:var(--display);font-weight:900;font-size:1rem;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank-close{appearance:none;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--sign-ink);background:transparent;color:var(--sign-ink);font-size:1rem;cursor:pointer;display:grid;place-items:center;padding:0}
.rank-tabs{display:flex;gap:6px;padding:10px 12px 0}
.rank-tabs button{appearance:none;flex:1;border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:5px 0;font:700 .8rem var(--body);cursor:pointer}
.rank-tabs button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--card)}
.rank-list{list-style:none;margin:0;padding:6px 8px 10px;overflow-y:auto}
.rank-list li{display:grid;grid-template-columns:2.2em minmax(0,1fr) auto;align-items:baseline;gap:8px;padding:7px 8px;border-radius:8px;font-size:.9rem}
.rank-list li:nth-child(odd){background:color-mix(in srgb,var(--line) 30%,transparent)}
.rank-list li.me{outline:2px solid var(--accent);outline-offset:-2px}
.rank-list .no{font-family:var(--num);font-weight:600;color:var(--muted);text-align:right}
.rank-list li:nth-child(-n+3) .no{color:var(--accent)}
.rank-list .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.rank-list .sc{font-family:var(--num);font-weight:600;font-variant-numeric:tabular-nums}
.rank-note{padding:14px 16px 18px;font-size:.86rem;color:var(--muted);line-height:1.6}
.rank-me{padding:8px 16px 12px;border-top:1px dashed var(--line);font-size:.8rem;color:var(--muted)}
.dialog-back{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:16px;background:rgba(10,14,24,.55)}
.dialog{width:min(360px,100%);padding:18px;border-radius:16px;background:var(--card);color:var(--ink);box-shadow:0 20px 50px rgba(0,0,0,.4);display:flex;flex-direction:column;gap:12px}
.dialog h3{margin:0;font-family:var(--display);font-weight:900;font-size:1.15rem}
.dialog p{margin:0;font-size:.88rem;color:var(--muted);line-height:1.6}
.name-row{display:flex;gap:8px}
.name-row input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:10px;background:var(--board);color:var(--ink);font:700 1rem var(--body);padding:9px 12px}
.name-row input:focus{outline:2px solid var(--accent);outline-offset:1px}
.dice{appearance:none;flex:none;width:42px;border:1.5px solid var(--line);border-radius:10px;background:transparent;color:var(--ink);cursor:pointer;font-size:.85rem;font-weight:700}
.dialog .err{min-height:1.2em;color:#d9534f;font-size:.82rem}
.dialog-actions{display:flex;gap:8px;justify-content:flex-end}
.dialog-actions button{appearance:none;border-radius:999px;padding:9px 18px;font:700 .9rem var(--body);cursor:pointer}
.btn-ghost{border:1.5px solid var(--line);background:transparent;color:var(--ink)}
.btn-main{border:0;background:var(--accent);color:var(--on-accent)}
.toast{position:fixed;left:50%;bottom:max(20px,calc(env(safe-area-inset-bottom,0px) + 14px));z-index:70;transform:translateX(-50%);max-width:calc(100% - 32px);padding:10px 16px;border-radius:999px;background:var(--ink);color:var(--card);font-size:.88rem;font-weight:700;box-shadow:0 10px 24px rgba(0,0,0,.3)}
@media (prefers-reduced-motion:reduce){.card{transition:none}.card:hover{transform:none}}
</style>

<div class="wrap" id="lobby">
  <header class="sign">
    <span class="bell">噹——噹——噹——</span>
    <h1>下課十分鐘</h1>
    <p><span id="game-count">16</span> 款小遊戲掛在這面牆上，挑一款就開玩，玩到上課鐘響。手機用手指，電腦用鍵盤或滑鼠。</p>
  </header>

  <div class="tools">
    <div class="chips" id="chips" role="group" aria-label="依類型篩選"></div>
    <button class="random" id="random" type="button">
      <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="1.5" width="13" height="13" rx="3" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="5" cy="5" r="1.3" fill="currentColor"/><circle cx="11" cy="11" r="1.3" fill="currentColor"/><circle cx="8" cy="8" r="1.3" fill="currentColor"/></svg>
      隨便玩一款
    </button>
  </div>

  <div id="shelves"></div>
  <p class="foot">「我的最高」只存在這台裝置的瀏覽器裡；「第一名」是線上排行榜，玩完會自動上傳你的成績。在遊戲裡按右上角的「排行榜」可以看前 20 名。</p>
</div>

<section class="player" id="player" hidden aria-label="遊戲畫面">
  <div class="pbar">
    <button class="pbtn solid" id="back" type="button">← 大廳</button>
    <h2 id="p-title"></h2>
    <button class="pbtn hide-sm" id="shuffle" type="button">換一款</button>
    <button class="pbtn" id="reload" type="button">重玩</button>
    <button class="pbtn rank" id="rank-btn" type="button" aria-expanded="false" aria-controls="rank-panel">排行榜</button>
  </div>
  <div class="screen" id="screen">
    <div class="status" id="status"></div>
    <section class="rank-panel" id="rank-panel" hidden aria-label="排行榜">
      <div class="rank-head"><h3 id="rank-title">排行榜</h3><button class="rank-close" id="rank-close" type="button" aria-label="關閉排行榜">✕</button></div>
      <div class="rank-tabs" id="rank-tabs" hidden></div>
      <ol class="rank-list" id="rank-list"></ol>
      <div class="rank-note" id="rank-note" hidden></div>
      <div class="rank-me" id="rank-me"></div>
    </section>
  </div>
</section>

<div class="dialog-back" id="name-dialog" hidden>
  <form class="dialog" id="name-form" aria-labelledby="name-title">
    <h3 id="name-title">上排行榜要取個名字</h3>
    <p id="name-desc">之後的成績都會用這個名字上傳，排行榜上大家都看得到。</p>
    <div class="name-row">
      <input id="name-input" maxlength="12" autocomplete="nickname" aria-label="排行榜名字">
      <button class="dice" id="name-dice" type="button" aria-label="換一個隨機名字">換</button>
    </div>
    <div class="err" id="name-err" aria-live="polite"></div>
    <div class="dialog-actions">
      <button class="btn-ghost" id="name-skip" type="button">先不要</button>
      <button class="btn-main" type="submit">送出成績</button>
    </div>
  </form>
</div>
<div class="toast" id="toast" hidden role="status"></div>

<script>
const GAME_SRC = {"bloodlab": "<!doctype html>\n<html lang=\"zh-Hant\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1,viewport-fit=cover\">\n<style>body{margin:0;font:14px/1.5 system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}<\/style>\n<title>抽血櫃台<\/title>\n<meta name=\"claude:viewport-fit-sides\" content=\"cover\">\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@500;700;900&display=swap\">\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700&family=Fredoka:wght@500;600&family=Share+Tech+Mono&display=swap\">\n<style>\n/* Layout: a hospital blood-draw station — the red LED queue board hangs on top, four numbered counters sit in a row, the waiting benches fill the bottom */\n:root{\n  --mint:#dcefe8;\n  --counter:#f6faf8;\n  --ink:#1f3b36;\n  --muted:#5e7a74;\n  --teal:#1f8a7a;\n  --warn:#d9534f;\n  --line:#bcd8cf;\n  --led:#ff4a3d;\n  --display:\"Chiron GoRound TC\",\"Noto Sans TC\",system-ui,-apple-system,\"PingFang TC\",\"Microsoft JhengHei\",sans-serif;\n  --body:\"Noto Sans TC\",system-ui,-apple-system,\"PingFang TC\",\"Microsoft JhengHei\",sans-serif;\n  --num:\"Fredoka\",\"Chiron GoRound TC\",system-ui,sans-serif;\n  color-scheme:light;\n}\nhtml{height:100%;box-sizing:border-box;background:var(--mint)}\n*,*::before,*::after{box-sizing:inherit}\n[hidden]{display:none!important}\nbody{\n  height:100%;margin:0;overflow:hidden;\n  display:flex;flex-direction:column;align-items:center;gap:10px;\n  padding-block:10px 14px;\n  padding-left:max(16px,env(safe-area-inset-left,0px));\n  padding-right:max(16px,env(safe-area-inset-right,0px));\n  background:var(--mint);color:var(--ink);font-family:var(--body);\n  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;\n}\n.hud{width:100%;max-width:520px;display:flex;align-items:center;gap:12px}\n.brand{flex:1;min-width:0;font-family:var(--display);font-weight:900;font-size:1.1rem;letter-spacing:.1em;white-space:nowrap;color:var(--teal)}\n.stat{display:flex;flex-direction:column;align-items:flex-end;line-height:1.1}\n.stat span{font-size:.64rem;color:var(--muted);letter-spacing:.12em}\n.stat b{font-family:var(--num);font-weight:600;font-size:1.2rem;font-variant-numeric:tabular-nums}\n.strikes{display:flex;gap:3px;height:1.32rem;align-items:center}\n.strikes i{width:12px;height:12px;border-radius:50%;background:var(--warn)}\n.strikes i.ok{background:transparent;box-shadow:inset 0 0 0 2px var(--line)}\n.icon-btn{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;font-size:.9rem;display:grid;place-items:center;padding:0}\n.icon-btn.off{color:var(--muted);text-decoration:line-through}\n.stage{position:relative;flex:1;min-height:0;width:100%;max-width:520px;border-radius:14px;overflow:hidden;touch-action:none;background:var(--counter);box-shadow:0 0 0 1px var(--line),0 14px 34px rgba(31,59,54,.12)}\n#cv{position:absolute;inset:0;width:100%;height:100%;display:block}\n.pop{position:absolute;left:0;right:0;top:56%;text-align:center;font:900 1.35rem var(--display);color:var(--teal);text-shadow:0 2px 0 #fff;opacity:0;pointer-events:none}\n.pop.bad{color:var(--warn)}\n.stage.shake{animation:shake .25s}\n@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}\n.pop.show{animation:pop 1s ease-out}\n@keyframes pop{0%{opacity:0;transform:translateY(8px)}15%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}\n.overlay{position:absolute;left:14px;right:14px;top:50%;transform:translateY(-50%);z-index:5;padding:18px;border-radius:14px;background:#fff;border:1px solid var(--line);box-shadow:0 16px 40px rgba(31,59,54,.2);display:flex;flex-direction:column;gap:10px;max-height:calc(100% - 28px);overflow-y:auto}\n.overlay h1{margin:0;font-family:var(--display);font-weight:900;font-size:1.45rem;letter-spacing:.08em;color:var(--teal)}\n.overlay p{margin:0;font-size:.92rem;line-height:1.75;max-width:40ch}\n.legend{display:flex;flex-direction:column;gap:6px;font-size:.86rem}\n.legend div{display:flex;align-items:center;gap:8px}\n.legend i{flex:none;width:34px;height:12px;border-radius:3px}\n.legend b{margin-left:auto;font-family:var(--num);font-weight:600}\n.row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}\n.btn{appearance:none;border:0;border-radius:10px;background:var(--teal);color:#fff;font:900 1rem var(--display);padding:10px 20px;cursor:pointer;letter-spacing:.08em}\n.keys{font-size:.8rem;color:var(--muted)}\n.rec{color:var(--warn);font-weight:700}\nbutton:focus-visible{outline:2px solid var(--teal);outline-offset:2px}\n@media (prefers-reduced-motion:reduce){.stage.shake{animation:none}.pop.show{animation:fade 1s}@keyframes fade{0%,100%{opacity:0}15%,75%{opacity:1}}}\n<\/style>\n\n<header class=\"hud\">\n  <div class=\"brand\">抽血櫃台<\/div>\n  <div class=\"stat\"><span>已抽<\/span><b id=\"served\">0<\/b><\/div>\n  <div class=\"stat\"><span>分數<\/span><b id=\"score\">0<\/b><\/div>\n  <div class=\"stat\"><span>客訴<\/span><div class=\"strikes\" id=\"strikes\"><\/div><\/div>\n  <div class=\"stat\"><span>最高<\/span><b id=\"best\">0<\/b><\/div>\n  <button class=\"icon-btn\" id=\"mute\" aria-label=\"音效\" aria-pressed=\"true\">♪<\/button>\n<\/header>\n<main class=\"stage\" id=\"stage\">\n  <canvas id=\"cv\"><\/canvas>\n  <div class=\"pop\" id=\"pop\" aria-live=\"polite\"><\/div>\n  <section class=\"overlay\" id=\"overlay\">\n    <h1 id=\"ov-title\">抽血櫃台<\/h1>\n    <p id=\"ov-text\">你是唯一的抽血護理師。看上面的叫號燈，點坐著那個號碼的櫃台，跑過去準備抽血。計量條會來回跑，在黃區按下去分數最高，按完就換下一號。病人等太久會生氣離開，被客訴三次就下班。<\/p>\n    <div class=\"legend\" id=\"legend\">\n      <div><i style=\"background:#f6c431\"><\/i>黃區：一針見血<b>+100<\/b><\/div>\n      <div><i style=\"background:#9fd8a8\"><\/i>綠區：有抽到<b>+40<\/b><\/div>\n      <div><i style=\"background:#e9eeec\"><\/i>其他：沒抽到<b>+0<\/b><\/div>\n      <div><i style=\"background:#d9534f\"><\/i>點錯號碼<b>−30<\/b><\/div>\n    <\/div>\n    <div class=\"row\"><button class=\"btn\" id=\"ov-btn\">開始看診<\/button><span class=\"keys\" id=\"ov-keys\">電腦：1–4 選櫃台，空白鍵按下<\/span><\/div>\n  <\/section>\n<\/main>\n\n<script>\n(() => {\nconst store = {\n  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },\n  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }\n};\nconst $ = id => document.getElementById(id);\nconst stage = $('stage'), cv = $('cv'), ctx = cv.getContext('2d');\nconst servedEl = $('served'), scoreEl = $('score'), strikesEl = $('strikes'), bestEl = $('best'), muteBtn = $('mute'), pop = $('pop');\nconst ov = $('overlay'), ovTitle = $('ov-title'), ovText = $('ov-text'), ovBtn = $('ov-btn'), ovKeys = $('ov-keys'), legend = $('legend');\n\n/* ---------- sound ---------- */\nlet actx = null, muted = !!store.get('bloodlab.muted', false);\nfunction tone(f1, f2, dur = .1, type = 'sine', vol = .06) {\n  if (muted) return;\n  try {\n    actx = actx || new (window.AudioContext || window.webkitAudioContext)();\n    if (actx.state === 'suspended') actx.resume();\n    const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();\n    o.type = type; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(f2, t + dur);\n    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);\n    o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + dur + .02);\n  } catch (e) {}\n}\nconst sfx = {\n  ding: () => { tone(880, 880, .18, 'sine', .06); setTimeout(() => tone(660, 660, .3, 'sine', .06), 180); },   // the queue-board chime\n  step: () => tone(520, 420, .05, 'triangle', .04),\n  perfect: () => { [1047, 1319, 1568, 2093].forEach((f, i) => setTimeout(() => tone(f, f, .1, 'triangle', .07), i * 45)); setTimeout(() => tone(2637, 2637, .35, 'sine', .04), 180); },\n  good: () => { tone(784, 784, .08, 'triangle', .07); setTimeout(() => tone(1175, 1175, .14, 'triangle', .06), 60); },\n  miss: () => tone(240, 170, .25, 'square', .045),\n  angry: () => tone(200, 120, .45, 'sawtooth', .05)\n};\nfunction setMute(m) { muted = m; muteBtn.setAttribute('aria-pressed', String(!m)); muteBtn.classList.toggle('off', m); store.set('bloodlab.muted', m); }\nsetMute(muted);\nmuteBtn.addEventListener('click', () => { setMute(!muted); muteBtn.blur(); if (!muted) sfx.ding(); });\nfunction showPop(t, bad) { pop.textContent = t; pop.classList.toggle('bad', !!bad); pop.classList.remove('show'); void pop.offsetWidth; pop.classList.add('show'); }\n\n/* ---------- layout: queue board on top, four counters, waiting benches below ---------- */\nconst W = 400, N = 4, CW = W / N;\nlet H = 640, S = 1, DPR = 1, deskY = 200, benchY = 480;\nfunction fit() {\n  const r = stage.getBoundingClientRect();\n  if (!r.width || !r.height) return;\n  DPR = Math.min(window.devicePixelRatio || 1, 2);\n  cv.width = Math.round(r.width * DPR); cv.height = Math.round(r.height * DPR);\n  S = r.width / W; H = r.height / S;\n  deskY = Math.max(150, H * .36); benchY = Math.max(deskY + 170, H * .78);\n  METER.y = deskY + 150;\n}\nconst counterX = i => CW * i + CW / 2;\nconst SKINS = ['#f3cfb3', '#e8b995', '#d8a27c', '#f6dcc6'];\nconst HAIRS = ['#2b2b2b', '#3b2a20', '#4a2b1a', '#d8d8d8', '#1e1e1e', '#6b3d22'];\nconst rand = (a, b) => a + Math.random() * (b - a);\n\n/* ---------- state ---------- */\nlet state = 'ready', counters = [], lobby = [], leaving = [], floats = [];\nlet nextNo = 1, callNo = 1, score = 0, served = 0, strikes = 0, combo = 0, elapsed = 0, arriveT = 0;\nlet nurse = { x: W / 2, tx: W / 2, at: -1 }, meter = null, overAt = 0, rushAt = 0;\nconst RUSH = [45, 100, 150], RUSH_TEXT = ['門診人潮變多了', '午休前大排長龍', '全院都來抽血了'];\nlet best = store.get('bloodlab.best', 0);\nbestEl.textContent = best;\nconst pad3 = n => String(n).padStart(3, '0');\n\nfunction makePatient() {\n  return { no: nextNo++, skin: SKINS[Math.floor(Math.random() * SKINS.length)], hair: HAIRS[Math.floor(Math.random() * HAIRS.length)],\n    kid: Math.random() < .2, patience: 1, face: 'calm', bob: Math.random() * 6 };\n}\nfunction hud() {\n  servedEl.textContent = served; scoreEl.textContent = score;\n  strikesEl.innerHTML = [0, 1, 2].map(i => `<i class=\"${i < strikes ? '' : 'ok'}\"><\/i>`).join('');\n}\nfunction reset() {\n  counters = Array.from({ length: N }, () => ({ p: null, fillT: 0 }));\n  lobby = []; leaving = []; floats = [];\n  nextNo = 1; callNo = 1; score = 0; served = 0; strikes = 0; combo = 0; elapsed = 0; arriveT = 0;\n  nurse = { x: W / 2, tx: W / 2, at: -1 }; meter = null; judge = null; rushAt = 0;\n  for (let i = 0; i < 4; i++) lobby.push(makePatient());\n  hud();\n}\nfunction start() {\n  if (state === 'play') return;\n  reset(); state = 'play'; ov.hidden = true; ovBtn.blur(); sfx.ding();\n}\nfunction gameOver() {\n  state = 'over'; overAt = performance.now(); meter = null;\n  const rec = score > best;\n  try { parent.postMessage({ type: 'arcade:score', game: 'bloodlab', score: score }, '*'); } catch (e) {}   // 交給大廳上傳排行榜\n  if (rec) { best = score; store.set('bloodlab.best', best); bestEl.textContent = best; }\n  ovTitle.textContent = '被客訴三次，下班了';\n  ovText.innerHTML = (rec ? '<span class=\"rec\">新紀錄！<\/span>' : '') + `今天抽了 ${served} 位病人，得到 ${score} 分。最高紀錄 ${best} 分。`;\n  legend.hidden = true; ovBtn.textContent = '明天再上班'; ovKeys.textContent = '';\n  ov.hidden = false;\n}\n\n// difficulty: patients come faster, the meter runs faster and the yellow zone shrinks\nconst level = () => Math.min(1, elapsed / 150);\nconst patienceTime = () => 22 - level() * 9;\n\n/* ---------- the timing meter that appears when the needle goes in ---------- */\nconst METER = { x: 24, w: W - 48, y: 0 };   // y follows the layout, set in fit()\n// rhythm-game style judgement: the word pops in big, a ring bursts out of the needle mark\nconst JUDGE = {\n  perfect: { text: 'PERFECT', sub: '一針見血', fill: '#f6c431', edge: '#a8740a', glow: 'rgba(246,196,49,.75)' },\n  good:    { text: 'GOOD',    sub: '有抽到',   fill: '#5cc27a', edge: '#23744a', glow: 'rgba(92,194,122,.6)' },\n  miss:    { text: 'MISS',    sub: '沒抽到',   fill: '#b9c3c0', edge: '#6d7a76', glow: 'rgba(0,0,0,0)' }\n};\nlet judge = null;\nfunction showJudge(kind, x, y) {\n  const n = kind === 'perfect' ? 18 : kind === 'good' ? 8 : 0;\n  judge = { kind, x, y, t: 0, combo, sparks: Array.from({ length: n }, () => { const a = Math.random() * Math.PI * 2, v = 90 + Math.random() * 160; return { vx: Math.cos(a) * v, vy: Math.sin(a) * v - 40 }; }) };\n  if (kind === 'miss') { stage.classList.remove('shake'); void stage.offsetWidth; stage.classList.add('shake'); }\n}\nfunction drawJudge() {\n  if (!judge) return;\n  const j = judge, J = JUDGE[j.kind], t = j.t;\n  // the ring\n  if (j.kind !== 'miss') {\n    ctx.strokeStyle = J.fill; ctx.globalAlpha = Math.max(0, 1 - t / .45); ctx.lineWidth = 4 * (1 - t / .45) + 1;\n    ctx.beginPath(); ctx.arc(j.x, j.y, 10 + t * 160, 0, Math.PI * 2); ctx.stroke();\n    ctx.fillStyle = J.fill;\n    for (const s of j.sparks) { const k = t * (1 - t * .6); ctx.beginPath(); ctx.arc(j.x + s.vx * k, j.y + s.vy * k + 120 * t * t, 3 * (1 - t), 0, Math.PI * 2); ctx.fill(); }\n    ctx.globalAlpha = 1;\n  }\n  // the word: overshoot in, hold, drift up and fade\n  const sc = t < .1 ? .4 + t / .1 * .9 : t < .2 ? 1.3 - (t - .1) / .1 * .3 : 1;\n  const a = t < .55 ? 1 : Math.max(0, 1 - (t - .55) / .3), y = METER.y + 4 - Math.max(0, t - .55) * 40;\n  const tx = W / 2;   // the word sits where the meter just was; the ring stays on the needle mark\n  ctx.save(); ctx.globalAlpha = a; ctx.translate(tx, y); ctx.scale(sc, sc); ctx.rotate(j.kind === 'miss' ? .06 : -.06);\n  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';\n  ctx.font = 'italic 600 40px Fredoka, sans-serif';\n  ctx.shadowColor = J.glow; ctx.shadowBlur = 18;\n  ctx.lineWidth = 7; ctx.strokeStyle = '#ffffff'; ctx.strokeText(J.text, 0, 0);\n  ctx.shadowBlur = 0; ctx.lineWidth = 2.5; ctx.strokeStyle = J.edge; ctx.strokeText(J.text, 0, 0);\n  ctx.fillStyle = J.fill; ctx.fillText(J.text, 0, 0);\n  ctx.font = '900 13px \"Chiron GoRound TC\", sans-serif'; ctx.fillStyle = J.edge;\n  ctx.fillText(j.kind === 'perfect' && j.combo > 1 ? `${J.sub}　COMBO ×${j.combo}` : J.sub, 0, 30);\n  ctx.restore();\n}\nfunction openMeter(i) {\n  const L = level(), yw = .16 - L * .08, gw = yw + .2;\n  const yc = rand(.2 + gw / 2, .8 - gw / 2);\n  meter = { i, pos: 0, dir: 1, speed: .9 + L * 1.1, y0: yc - yw / 2, y1: yc + yw / 2, g0: yc - gw / 2, g1: yc + gw / 2, wait: .25 };\n}\nfunction pressMeter() {\n  if (!meter || meter.wait > 0) return;\n  const m = meter, c = counters[m.i], p = c.p, x = m.pos;\n  let pts = 0, kind = 'miss', bad = true;\n  if (x >= m.y0 && x <= m.y1) { combo++; pts = 100 + Math.min(combo - 1, 5) * 20; kind = 'perfect'; bad = false; sfx.perfect(); p.face = 'happy'; }\n  else if (x >= m.g0 && x <= m.g1) { combo = 0; pts = 40; kind = 'good'; bad = false; sfx.good(); p.face = 'calm'; }\n  else { combo = 0; sfx.miss(); p.face = 'ouch'; }\n  score += pts; served++;\n  floats.push({ x: counterX(m.i), y: deskY - 40, text: pts ? '+' + pts : '+0', t: 0, bad });\n  showJudge(kind, METER.x + METER.w * x, METER.y + 11);\n  c.fillT = pts ? .7 : .01;    // a short moment for the tube to fill, then the patient leaves\n  meter = null; callNo = p.no + 1; syncCall();\n  hud();\n}\n// checked every frame: call the smallest number still waiting; with nobody waiting, call the next number to be handed out\nfunction syncCall() {\n  const waiting = [...counters.filter(c => c.p && c.fillT <= 0).map(c => c.p.no), ...lobby.map(p => p.no)].filter(n => n >= callNo);\n  const want = waiting.length ? Math.min(...waiting) : nextNo;\n  if (want !== callNo) { callNo = want; if (waiting.length) sfx.ding(); }\n}\n\n/* ---------- input ---------- */\nfunction pickCounter(i) {\n  if (state !== 'play') return;\n  if (meter) { pressMeter(); return; }\n  const c = counters[i];\n  if (!c.p || c.fillT > 0) return;\n  if (c.p.no !== callNo) {\n    score = Math.max(0, score - 30); combo = 0; hud(); sfx.miss();\n    floats.push({ x: counterX(i), y: deskY - 40, text: '-30', t: 0, bad: true });\n    showPop(`還沒輪到 ${pad3(c.p.no)} 號`, true);\n    return;\n  }\n  nurse.tx = counterX(i); nurse.at = i; sfx.step();\n  openMeter(i);\n}\nstage.addEventListener('pointerdown', e => {\n  if (e.target.closest('.overlay')) return;\n  e.preventDefault();\n  if (state === 'over') { if (performance.now() - overAt > 900) start(); return; }\n  if (state !== 'play') return;\n  if (meter) { pressMeter(); return; }\n  const r = stage.getBoundingClientRect(), x = (e.clientX - r.left) / S, y = (e.clientY - r.top) / S;\n  if (y > 40 && y < benchY - 20) pickCounter(Math.max(0, Math.min(N - 1, Math.floor(x / CW))));\n});\novBtn.addEventListener('click', () => { if (state === 'over' && performance.now() - overAt < 600) return; start(); });\naddEventListener('keydown', e => {\n  if (state === 'play') {\n    if (/^Digit[1-4]$/.test(e.code)) { pickCounter(+e.code.slice(5) - 1); return; }\n    if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); if (!e.repeat) pressMeter(); return; }\n  }\n  if ((e.code === 'Space' || e.code === 'Enter') && !ov.hidden && !(e.target.closest && e.target.closest('button'))) { e.preventDefault(); ovBtn.click(); }\n});\n\n/* ---------- update ---------- */\nfunction update(dt) {\n  for (const f of floats) f.t += dt;\n  if (judge) { judge.t += dt; if (judge.t > .9) judge = null; }\n  floats = floats.filter(f => f.t < 1);\n  for (const l of leaving) { l.t += dt; l.x += l.vx * dt; }\n  leaving = leaving.filter(l => l.t < 1.4);\n  nurse.x += (nurse.tx - nurse.x) * Math.min(1, dt * 12);\n  if (state !== 'play') return;\n  elapsed += dt;\n  // new arrivals take a number at the registration desk\n  arriveT -= dt;\n  if (arriveT <= 0) {\n    // the clinic gets busier: shorter gaps, and after a while people start arriving in pairs and threes\n    const group = elapsed > 100 && Math.random() < .35 ? 3 : elapsed > 45 && Math.random() < .4 ? 2 : 1;\n    for (let g = 0; g < group && lobby.length < 10; g++) lobby.push(makePatient());\n    arriveT = Math.max(.9, 3.6 - elapsed * .018) * rand(.75, 1.25);\n  }\n  if (rushAt < RUSH.length && elapsed >= RUSH[rushAt]) { showPop(RUSH_TEXT[rushAt]); rushAt++; }\n  // free counters are filled from the front of the waiting line, each into a random free seat\n  const free = counters.map((c, i) => (!c.p ? i : -1)).filter(i => i >= 0);\n  if (free.length && lobby.length) {\n    const i = free[Math.floor(Math.random() * free.length)];\n    counters[i].p = lobby.shift(); counters[i].p.patience = 1;\n  }\n  if (meter) {\n    if (meter.wait > 0) meter.wait -= dt;\n    else {\n      meter.pos += meter.dir * meter.speed * dt;\n      if (meter.pos > 1) { meter.pos = 1; meter.dir = -1; } else if (meter.pos < 0) { meter.pos = 0; meter.dir = 1; }\n    }\n  }\n  counters.forEach((c, i) => {\n    if (!c.p) return;\n    if (c.fillT > 0) {\n      c.fillT -= dt;\n      if (c.fillT <= 0) { leaving.push({ ...c.p, x: counterX(i), vx: i < 2 ? -120 : 120, t: 0, happy: c.p.face !== 'ouch' }); c.p = null; c.fillT = 0; }\n      return;\n    }\n    if (meter && meter.i === i) return;   // the patient being drawn doesn't lose patience\n    c.p.patience -= dt / patienceTime();\n    if (c.p.patience < .35 && c.p.face !== 'ouch') c.p.face = 'grumpy';\n    if (c.p.patience <= 0) {\n      strikes++; combo = 0; sfx.angry();\n      showPop(`${pad3(c.p.no)} 號等太久走掉了`, true);\n      leaving.push({ ...c.p, x: counterX(i), vx: i < 2 ? -160 : 160, t: 0, angry: true });\n      const gone = c.p.no; c.p = null;\n      if (gone === callNo) { callNo++; syncCall(); }\n      hud();\n      if (strikes >= 3) gameO e = 'over'; overAt = performance.now();\n  const rec = score > best;\n  try { parent.postMessage({ type: 'arcade:score', game: 'blueprint', score: score }, '*'); } catch (e) {}   // 交給大廳上傳排行榜\n  if (rec) { best = score; store.set('blueprint.best', best); }\n  bestEl.textContent = best;\n  tone(200, .6, 'sawtooth', .05, .3);\n  ovTitle.textContent = '圖紙畫滿了';\n  ovText.innerHTML = (rec ? '<span class=\"rec\">新紀錄！<\/span>' : '') + `第 ${level} 級，消了 ${lines} 行，得到 ${score} 分。最高 ${best} 分。`;\n  ovHelp.hidden = true; ovBtn.textContent = '換一張新圖紙'; ovKeys.textContent = '';\n  setTimeout(() => { if (state === 'over') ov.hidden = false; }, 500);\n}\n\n/* ---------- input ---------- */\nconst ACT = { left: () => move(-1), right: () => move(1), rot: () => rotate(1), down: soft, drop: hard };\ndocument.querySelectorAll('#pad button').forEach(b => {\n  let t1 = null, t2 = null;\n  const stop = () => { clearTimeout(t1); clearInterval(t2); t1 = t2 = null; };\n  b.addEventListener('pointerdown', e => {\n    e.preventDefault();\n    if (state === 'ready' || (state === 'over' && performance.now() - overAt > 600)) { start(); return; }\n    if (state === 'paused') { start(); return; }\n    const a = b.dataset.a; ACT[a]();\n    if (a === 'left' || a === 'right' || a === 'down') { t1 = setTimeout(() => { t2 = setInterval(ACT[a], a === 'down' ? 40 : 55); }, 170); }\n  });\n  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => b.addEventListener(ev, stop));\n});\nlet g = null;\nstage.addEventListener('pointerdown', e => {\n  if (e.target.closest('.overlay')) return;\n  e.preventDefault();\n  if (state === 'ready' || (state === 'over' && performance.now() - overAt > 600)) { start(); return; }\n  if (state === 'paused') { start(); return; }\n  g = { id: e.pointerId, x0: e.clientX, y0: e.clientY, lx: e.clientX, t0: performance.now(), moved: false };\n});\nstage.addEventListener('pointermove', e => {\n  if (!g || g.id !== e.pointerId) return;\n  const step = cell * S * .9;\n  while (e.cl t: W / 2, wideT: 0, squash: 0 };\nfunction fit() {\n  const r = stage.getBoundingClientRect();\n  if (!r.width || !r.height) return;\n  DPR = Math.min(window.devicePixelRatio || 1, 2);\n  cv.width = Math.round(r.width * DPR); cv.height = Math.round(r.height * DPR);\n  S = r.width / W; H = r.height / S;\n  paddle.y = H - 54;\n}\nfit();\nif ('ResizeObserver' in window) new ResizeObserver(fit).observe(stage); else addEventListener('resize', fit);\n\n/* ---------- sound ---------- */\nlet actx = null, muted = !!store.get('riso.muted', false);\nfunction tone(f, d = .08, type = 'square', v = .04) {\n  if (muted) return;\n  try {\n    actx = actx || new (window.AudioContext || window.webkitAudioContext)();\n    if (actx.state === 'suspended') actx.resume();\n    const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();\n    o.type = type; o.frequency.setValueAtTime(f, t);\n    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);\n    o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + d + .02);\n  } catch (e) {}\n}\nfunction setMute(m) { muted = m; muteBtn.setAttribute('aria-pressed', String(!m)); muteBtn.classList.toggle('off', m); store.set('riso.muted', m); }\nsetMute(muted);\nmuteBtn.addEventListener('click', () => { setMute(!muted); muteBtn.blur(); if (!muted) tone(660, .06); });\n\n/* ---------- inks & sheet ---------- */\nconst INK = { pink: '#ff48b0', blue: '#0078bf', yellow: '#ffe800', black: '#1e1d1f', paper: '#f0efe9' };\nconst ROWINK = [['pink', 'blue'], ['yellow', 'pink'], ['blue', 'yellow']]; // [main ink, misregistered ink]\nconst COLS = 8, MARGIN = 14, GAP = 6, BRH = 18, TOP = 58;\nconst BW = (W - MARGIN * 2 - GAP * (COLS - 1)) / COLS;\nconst HEART = ['.##..##.', '########', '########', '.######.', '..####..', '...##...'];\nconst PATTERNS = [\n  () => true,\n  (r, c) => (r + c) % 2 === 0,\n  (r, c) => Math.abs(c - 3.5) <= (r + 1) * .75,\n  (r, c) => r % 2 === 0 || (c !== 3 && c !== 4),\n  (r, c) => !!HEART[r] && HEART[r][c] === '#',\n  (r, c) => c % 3 !== 2\n];\nconst DROPS = {\n  wide:  { ch: '寬', main: 'blue',   off: 'yellow', text: 'paper', msg: '板子變寬' },\n  multi: { ch: '多', main: 'pink',   off: 'blue',   text: 'paper', msg: '分裂！' },\n  slow:  { ch: '慢', main: 'yellow', off: 'pink',   text: 'black', msg: '減速' },\n  life:  { ch: '命', main: 'black',  off: 'pink',   text: 'paper', msg: '+1 次機會' }\n};\nconst grain = (() => {\n  const g = document.createElement('canvas'); g.width = g.height = 96;\n  const c = g.getContext('2d'), img = c.createImageData(96, 96);\n  for (let i = 0; i < img.data.length; i += 4) {\n    img.data[i] = 40; img.data[i + 1] = 38; img.data[i + 2] = 45;\n    img.data[i + 3] = Math.random() < .12 ? Math.random() * 38 : 0;\n  }\n  c.putImageData(img, 0, 0);\n  return ctx.createPattern(g, 'repeat');\n})();\n\n/* ---------- state ---------- */\nlet balls = [], bricks = [], drops = [], parts = [];\nlet state = 'ready', prevState = 'play', level = 1, score = 0, lives = 3, slowT = 0, chain = 0, clearT = 0, overAt = 0, ignoreUp = false;\nlet best = store.get('riso.best', 0);\nconst held = new Set();\n\nconst baseSpeed = () => Math.min(300 + (level - 1) * 16, 500);\nfunction newBall() { return { x: paddle.x, y: paddle.y - 7, vx: 0, vy: 0, r: 6, sp: baseSpeed(), stuck: true, off: (Math.random() - .5) * 24 }; }\nfunction makeLevel(n) {\n  const idx = (n - 1) % PATTERNS.length, p = PATTERNS[idx];\n  const R = idx === 4 ? 6 : Math.min(4 + Math.floor((n - 1) / 2), 8);\n  const hard = Math.min(Math.floor((n - 1) / 2), R - 1);\n  bricks = [];\n  for (let r = 0; r < R; r++) for (let c = 0; c < COLS; c++) {\n    if (!p(r, c, R)) continue;\n    let hp = r < hard ? 2 : 1;\n    if (n >= 6 && r === 0) hp = 3;\n    bricks.push({ x: MARGIN + c * (BW + GAP), y: TOP + r * (BRH + GAP), w: BW, h: BRH, hp, max: hp, row: r, flash: 0 });\n  }\n}\nfunction hud() {\n  scoreEl.textContent = score;\n  levelEl.textContent = level;\n  livesEl.innerHTML = '<i><\/i>'.repeat(Math.max(0, lives));\n}\nfunction showPop(text) { pop.textContent = text; pop.classList.remove('show'); void pop.offsetWidth; pop.classList.add('show'); }\nfunction resetGame() {\n  level = 1; score = 0; lives = 3; slowT = 0; chain = 0; drops = []; parts = [];\n  paddle.wideT = 0; paddle.w = 78;\n  makeLevel(level); balls = [newBall()]; hud();\n}\nfunction start() {\n  if (state === 'play' || state === 'clear') return;\n  resetGame(); state = 'play'; ov.hidden = true; ovBtn.blur();\n  showPop('第 1 關');\n}\nfunction launch() {\n  let any = false;\n  for (const b of balls) if (b.stuck) {\n    const a = (Math.random() - .5) * .7;\n    b.vx = b.sp * Math.sin(a); b.vy = -b.sp * Math.cos(a); b.stuck = false; any = true;\n  }\n  if (any) tone(620, .06);\n}\nfunction pause() {\n  if (state !== 'play' && state !== 'clear') return;\n  prevState = state; state = 'paused';\n  ovTitle.textContent = '暫停中';\n  ovText.textContent = `第 ${level} 關，目前 ${score} 分。`;\n  legend.hidden = false; ovBtn.textContent = '繼續'; ovKeys.textContent = 'P 或空白鍵繼續';\n  ov.hidden = false;\n}\nfunction resume() { if (state !== 'paused') return; state = prevState; ov.hidden = true; ovBtn.blur(); }\nfunction gameOver() {\n  state = 'over'; overAt = performance.now();\n  const rec = score > best && score > 0;\n  try { parent.postMessage({ type: 'arcade:score', game: 'bricks', score: score }, '*'); } catch (e) {}   // 交給大廳上傳排行榜\n  if (rec) { best = score; store.set('riso.best', best); }\n  ovTitle.textContent = '沒接住';\n  ovText.innerHTML = (rec ? '<span class=\"rec\">新紀錄！<\/span>' : '') + `印到第 ${level} 關，得到 ${score} 分。最高紀錄 ${best} 分。`;\n  legend.hidden = true; ovBtn.textContent = '再印一張'; ovKeys.textContent = '點擊畫面・空白鍵';\n  setTimeout(() => { if (state === 'over') ov.hidden = false; }, 500);\n}\nfunction loseLife() {\n  lives--; hud(); tone(180, .4, 'sawtooth', .05);\n  if (lives <= 0) { gameOver(); return; }\n  balls = [newBall()]; drops = []; paddle.wideT = 0; slowT = 0; chain = 0;\n  showPop(`剩下 ${lives} 次機會`);\n}\nfunction levelClear() {\n  state = 'clear'; clearT = 1.6;\n  const bonus = 100 * level; score += bonus; balls = []; drops = []; hud();\n  showPop(`第 ${level} 關完成 +${bonus}`);\n  [523, 659, 784].forEach((f, i) => setTimeout(() => tone(f, .12, 'triangle', .06), i * 110));\n}\nfunction nextLevel() {\n  level++; makeLevel(level); balls = [newBall()]; state = 'play'; slowT = 0; hud();\n  showPop(`第 ${level} 關`);\n}\n\n/* ---------- physics ---------- */\nfunction hitBrick(b) {\n  for (const br of bricks) {\n    if (br.hp > 0 && b.x + b.r > br.x && b.x - b.r < br.x + br.w && b.y + b.r > br.y && b.y - b.r < br.y + br.h) return br;\n  }\n  return null;\n}\nfunction burst(br) {\n  const [m, o] = ROWINK[br.row % 3];\n  for (let i = 0; i < 10; i++) parts.push({\n    x: br.x + Math.random() * br.w, y: br.y + Math.random() * br.h,\n    vx: (Math.random() - .5) * 220, vy: -Math.random() * 160 - 20,\n    s: 3 + Math.random() * 4, rot: Math.random() * 6, vr: (Math.random() - .5) * 12, life: .8, ink: i % 2 ? m : o\n  });\n}\nfunction damage(br, b) {\n  br.hp--; br.flash = .15; chain++;\n  b.sp = Math.min(b.sp + 2.5, baseSpeed() * 1.35);\n  const m = Math.hypot(b.vx, b.vy) || 1; b.vx *= b.sp / m; b.vy *= b.sp / m;\n  if (br.hp <= 0) {\n    score += 10 * br.max + chain * 2; burst(br);\n    tone(392 + (7 - br.row) * 45, .07, 'square', .035);\n    if (Math.random() < .12 && drops.length < 3) {\n      const r = Math.random();\n      const type = r < .36 ? 'wide' : r < .72 ? 'multi' : r < .92 ? 'slow' : 'life';\n      drops.push({ x: br.x + br.w / 2, y: br.y + br.h / 2, type });\n    }\n  } else { score += 5; tone(160, .05, 'square', .03); }\n  hud();\n}\nfunction stepBall(b, dt) {\n  const f = slowT > 0 ? .62 : 1;\n  const n = Math.max(1, Math.ceil(b.sp * f * dt / 4)), h = dt * f / n;\n  for (let i = 0; i < n; i++) {\n    b.x += b.vx * h;\n    if (b.x < b.r) { b.x = b.r; b.vx = Math.abs(b.vx); tone(300, .03, 'square', .02); }\n    else if (b.x > W - b.r) { b.x = W - b.r; b.vx = -Math.abs(b.vx); tone(300, .03, 'square', .02); }\n    let br = hitBrick(b);\n    if (br) { b.x = b.vx > 0 ? br.x - b.r : br.x + br.w + b.r; b.vx = -b.vx; damage(br, b); }\n    b.y += b.vy * h;\n    if (b.y < b.r) { b.y = b.r; b.vy = Math.abs(b.vy); tone(300, .03, 'square', .02); }\n    br = hitBrick(b);\n    if (br) { b.y = b.vy > 0 ? br.y - b.r : br.y + br.h + b.r; b.vy = -b.vy; damage(br, b); }\n    const hw = paddle.w / 2;\n    if (b.vy > 0 && b.y + b.r >= paddle.y && b.y - b.r <= paddle.y + paddle.h && b.x >= paddle.x - hw - b.r && b.x <= paddle.x + hw + b.r) {\n      const rel = Math.max(-1, Math.min(1, (b.x - paddle.x) / hw)), a = rel * 1.05;\n      b.vx = b.sp * Math.sin(a); b.vy = -b.sp * Math.cos(a); b.y = paddle.y - b.r;\n      paddle.squash = 1; chain = 0; tone(440, .05, 'triangle', .05);\n    }\n    if (b.y - b.r > H) { b.dead = true; return; }\n  }\n}\nfunction applyDrop(type) {\n  showPop(DROPS[type].msg); tone(880, .12, 'triangle', .06);\n  if (type === 'wide') paddle.wideT = 12;\n  else if (type === 'slow') slowT = 9;\n  else if (type === 'life') { lives = Math.min(lives + 1, 6); hud(); }\n  else if (type === 'multi') {\n    if (balls.some(b => b.stuck)) launch();\n    const src = balls.slice(0, 3);\n    for (const s of src) for (const a of [-.42, .42]) {\n      if (balls.length >= 9) break;\n      const c = Math.cos(a), sn = Math.sin(a);\n      const nb = { ...s, vx: s.vx * c - s.vy * sn, vy: s.vx * sn + s.vy * c, stuck: false, dead: false };\n      if (Math.abs(nb.vy) < nb.sp * .35) {\n        nb.vy = (nb.vy >= 0 ? -1 : -1) * nb.sp * .35;\n        nb.vx = Math.sign(nb.vx || 1) * Math.sqrt(nb.sp * nb.sp - nb.vy * nb.vy);\n      }\n      balls.push(nb);\n    }\n  }\n}\n\n/* ---------- update ---------- */\nfunction update(dt) {\n  if (state === 'paused') return;\n  let dir = 0;\n  if (held.has('ArrowLeft') || held.has('KeyA')) dir -= 1;\n  if (held.has('ArrowRight') || held.has('KeyD')) dir += 1;\n  if (dir) { paddle.x += dir * 460 * dt; paddle.target = paddle.x; }\n  else paddle.x += (paddle.target - paddle.x) * Math.min(1, dt * 22);\n  paddle.w += ((paddle.wideT > 0 ? 122 : 78) - paddle.w) * Math.min(1, dt * 8);\n  paddle.x = Math.max(paddle.w / 2, Math.min(W - paddle.w / 2, paddle.x));\n  paddle.wideT = Math.max(0, paddle.wideT - dt);\n  paddle.squash = Math.max(0, paddle.squash - dt * 6);\n  slowT = Math.max(0, slowT - dt);\n\n  if (state === 'play' || state === 'ready') {\n    for (const b of balls) {\n      if (b.stuck) { b.x = paddle.x + b.off; b.y = paddle.y - b.r - 1; }\n      else if (state === 'play') stepBall(b, dt);\n    }\n  }\n  if (state === 'play') {\n    bricks = bricks.filter(br => br.hp > 0);\n    balls = balls.filter(b => !b.dead);\n    for (const d of drops) {\n      d.y += 110 * dt;\n      if (d.y + 8 >= paddle.y && d.y - 8 <= paddle.y + paddle.h && Math.abs(d.x - paddle.x) < paddle.w / 2 + 12) { d.got = true; applyDrop(d.type); }\n    }\n    drops = drops.filter(d => !d.got && d.y < H + 20);\n    if (!bricks.length) levelClear();\n    else if (!balls.length) loseLife();\n  } else if (state === 'clear') {\n    clearT -= dt; if (clearT <= 0) nextLevel();\n  }\n  for (const br of bricks) br.flash = Math.max(0, br.flash - dt);\n  for (const p of parts) { p.vy += 600 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt; p.life -= dt; }\n  parts = parts.filter(p => p.life > 0);\n}\n\n/* ---------- draw ---------- */\nfunction rr(x, y, w, h, r) {\n  r = Math.min(r, w / 2, h / 2);\n  ctx.beginPath(); ctx.moveTo(x + r, y);\n  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);\n  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();\n}\nfunction drawMarks() {\n  ctx.strokeStyle = 'rgba(30,29,31,.5)'; ctx.lineWidth = .8;\n  for (const [x, y] of [[12, 12], [W - 12, 12], [12, H - 12], [W - 12, H - 12]]) {\n    ctx.beginPath(); ctx.arc(x, y, 4, 0, Math.PI * 2);\n    ctx.moveTo(x - 8, y); ctx.lineTo(x + 8, y); ctx.moveTo(x, y - 8); ctx.lineTo(x, y + 8); ctx.stroke();\n  }\n  ['pink', 'yellow', 'blue', 'black'].forEach((k, i) => { ctx.fillStyle = INK[k]; ctx.fillRect(W / 2 - 26 + i * 13, H - 16, 11, 7); });\n  ctx.fillStyle = 'rgba(30,29,31,.5)'; ctx.font = '7px \"Rubik Mono One\", monospace'; ctx.textBaseline = 'middle';\n  ctx.textAlign = 'left'; ctx.fillText('SHEET ' + String(level).padStart(2, '0'), 26, H - 12);\n  ctx.textAlign = 'right'; ctx.fillText('PK · Y · BL', W - 26, H - 12);\n}\nfunction drawBrick(br) {\n  const [m, o] = br.hp >= 2 ? ['black', 'pink'] : ROWINK[br.row % 3];\n  const j = br.flash > 0 ? (Math.random() - .5) * 3 : 0;\n  ctx.fillStyle = INK[o]; rr(br.x + 2.5 + j, br.y + 2.5, br.w, br.h, 3); ctx.fill();\n  ctx.fillStyle = INK[m]; rr(br.x, br.y, br.w, br.h, 3); ctx.fill();\n}\nfunction draw() {\n  ctx.setTransform(DPR * S, 0, 0, DPR * S, 0, 0);\n  ctx.globalCompositeOperation = 'source-over';\n  ctx.fillStyle = INK.paper; ctx.fillRect(0, 0, W, H);\n  ctx.fillStyle = grain; ctx.fillRect(0, 0, W, H);\n  drawMarks();\n\n  ctx.globalCompositeOperation = 'multiply';\n  for (const br of bricks) drawBrick(br);\n  for (const p of parts) {\n    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.globalAlpha = Math.min(1, p.life * 2);\n    ctx.fillStyle = INK[p.ink]; ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s); ctx.restore();\n  }\n  ctx.globalAlpha = 1;\n  for (const d of drops) {\n    const k = DROPS[d.type];\n    ctx.fillStyle = INK[k.off]; rr(d.x - 15 + 2, d.y - 8 + 2, 30, 16, 8); ctx.fill();\n    ctx.fillStyle = INK[k.main]; rr(d.x - 15, d.y - 8, 30, 16, 8); ctx.fill();\n  }\n  const pw = paddle.w, ph = paddle.h * (1 - paddle.squash * .3), px = paddle.x - pw / 2, py = paddle.y + (paddle.h - ph);\n  ctx.fillStyle = INK.yellow; rr(px + 3, py + 3, pw, ph, 6); ctx.fill();\n  ctx.fillStyle = INK.blue; rr(px, py, pw, ph, 6); ctx.fill();\n  for (const b of balls) {\n    ctx.fillStyle = slowT > 0 ? INK.yellow : INK.blue;\n    ctx.beginPath(); ctx.arc(b.x + 2, b.y + 2, b.r, 0, Math.PI * 2); ctx.fill();\n    ctx.fillStyle = INK.pink;\n    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();\n  }\n\n  ctx.globalCompositeOperation = 'source-over';\n  ctx.fillStyle = INK.paper;\n  for (const br of bricks) if (br.hp >= 2) {\n    for (let i = 0; i < br.hp; i++) {\n      ctx.beginPath(); ctx.arc(br.x + br.w / 2 + (i - (br.hp - 1) / 2) * 7, br.y + br.h / 2, 2, 0, Math.PI * 2); ctx.fill();\n    }\n  }\n  ctx.font = '900 10px \"Noto Sans TC\", sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';\n  for (const d of drops) { const k = DROPS[d.type]; ctx.fillStyle = INK[k.text]; ctx.fillText(k.ch, d.x, d.y + .5); }\n}\n\n/* ---------- input ---------- */\nconst toX = e => (e.clientX - stage.getBoundingClientRect().left) / S;\nstage.addEventListener('pointerdown', e => {\n  if (e.target.closest('button')) return;\n  if (e.button > 0) return;\n  e.preventDefault();\n  if (state === 'ready' || (state === 'over' && performance.now() - overAt > 600)) { start(); ignoreUp = true; return; }\n  if (state === 'paused') { resume(); ignoreUp = true; return; }\n  paddle.target = toX(e);\n});\nstage.addEventListener('pointermove', e => { if (state === 'play' || state === 'clear') paddle.target = toX(e); });\nstage.addEventListener('pointerup', e => {\n  if (e.target.closest('button')) return;\n  if (ignoreUp) { ignoreUp = false; return; }\n  if (state === 'play') launch();\n});\novBtn.addEventListener('click', () => { if (state === 'paused') resume(); else start(); });\npauseBtn.addEventListener('click', () => { pauseBtn.blur(); state === 'paused' ? resume() : pause(); });\naddEventListener('keydown', e => {\n  const k = e.code;\n  if (k === 'ArrowLeft' || k === 'ArrowRight' || k === 'KeyA' || k === 'KeyD') { held.add(k); e.preventDefault(); return; }\n  if (k === 'KeyP' || k === 'Escape') { state === 'paused' ? resume() : pause(); return; }\n  if (k === 'Space' || k === 'Enter') {\n    if (e.target.closest && e.target.closest('button')) return;\ "Noto Sans TC\",system-ui,-apple-system,\"PingFang TC\",\"Microsoft JhengHei\",sans-serif;\n  --hand:\"LXGW WenKai TC\",\"Kaiti TC\",\"DFKai-SB\",\"STKaiti\",serif;\n  --num:\"Fredoka\",\"Chiron GoRound TC\",system-ui,sans-serif;\n  color-scheme:dark;\n}\nhtml{height:100%;box-sizing:border-box;background:var(--night)}\n*,*::before,*::after{box-sizing:inherit}\n[hidden]{display:none!important}\nbody{\n  height:100%;margin:0;overflow:hidden;\n  display:flex;flex-direction:column;align-items:center;gap:10px;\n  padding-block:10px 14px;\n  padding-left:max(16px,env(safe-area-inset-left,0px));\n  padding-right:max(16px,env(safe-area-inset-right,0px));\n  background:radial-gradient(120% 50% at 50% 0%,#3a2232,var(--night) 70%);\n  color:var(--text);font-family:var(--display);\n  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;\n}\n.hud{width:100%;max-width:520px;display:flex;align-items:center;gap:12px}\n.brand{flex:1;min-width:0;font-weight:900;font-size:1.1rem;letter-spacing:.1em;white-space:nowrap;color:var(--lamp);text-shadow:0 0 12px rgba(255,182,72,.45)}\n.stat{display:flex;flex-direction:column;align-items:flex-end;line-height:1.1}\n.stat span{font-size:.64rem;color:var(--muted);letter-spacing:.12em}\n.stat b{font-family:var(--num);font-weight:600;font-size:1.25rem;font-variant-numeric:tabular-nums}\n.poi{display:flex;gap:4px;height:1.375rem;align-items:center}\n.poi i{position:relative;width:15px;height:15px;border-radius:50%;border:2.5px solid var(--lantern);background:rgba(255,255,255,.85)}\n.poi i::after{content:\"\";position:absolute;right:-6px;bottom:-5px;width:7px;height:3px;border-radius:2px;background:var(--lantern);transform:rotate(45deg)}\n.poi i.used{opacity:.28;background:transparent}\n.icon-btn{width:34px;height:34px;border-radius:8px;border:1px solid #4a3a52;background:transparent;color:var(--text);cursor:pointer;font-size:.9rem;display:grid;place-items:center;padding:0}\n.icon-btn.off{color:v () {\n  const r = stage.getBoundingClientRect();\n  if (!r.width || !r.height) return;\n  DPR = Math.min(window.devicePixelRatio || 1, 2);\n  cv.width = Math.round(r.width * DPR); cv.height = Math.round(r.height * DPR);\n  S = r.width / W; H = r.height / S;\n  const counter = Math.max(96, Math.min(150, H * .19));\n  tub = { x: 12, y: 12, w: W - 24, h: H - counter - 18, r: 58 };\n  water = { x: tub.x + 13, y: tub.y + 13, w: tub.w - 26, h: tub.h - 26, r: 46 };\n  bowl = { x: W * .34, y: H - counter / 2 - 2, r: Math.min(46, counter / 2 - 8) };\n  for (const f of fish) keepInside(f);\n}\n// signed distance to the water's rounded rectangle; negative means inside\nfunction sd(px, py, b = water) {\n  const cx = b.x + b.w / 2, cy = b.y + b.h / 2;\n  const qx = Math.abs(px - cx) - (b.w / 2 - b.r), qy = Math.abs(py - cy) - (b.h / 2 - b.r);\n  return Math.hypot(Math.max(qx, 0), Math.max(qy, 0)) + Math.min(Math.max(qx, qy), 0) - b.r;\n}\nfunction keepInside(f) {\n  const m = f.size + 4, d = sd(f.x, f.y);\n  if (d > -m) {\n    const cx = water.x + water.w / 2, cy = water.y + water.h / 2, dx = cx - f.x, dy = cy - f.y, l = Math.hypot(dx, dy) || 1;\n    f.x += dx / l * (d + m); f.y += dy / l * (d + m);\n  }\n}\n\n/* ---------- state ---------- */\nlet fish = [], flying = [], inBowl = [], rings = [], floats = [];\nlet state = 'ready', score = 0, poisLeft = POIS, betweenT = 0, overAt = 0, held = null, counts = {};\nlet best = store.get('goldfish.best', 0);\nbestEl.textContent = best;\nconst poi = { x: W * .7, y: 300, tx: W * .7, ty: 300, inWater: false, wet: false, D: 100, torn: false, spd: 0, cracks: [], tearT: 0, visible: true };\nconst pickKind = () => { let r = Math.random() * 100; for (const k of KIND_KEYS) { if ((r -= KINDS[k].odds) < 0) return k; } return 'red'; };\nfunction makeFish(k, x, y) {\n  const K = KINDS[k];\n  return { k, x, y, a: Math.random() * Math.PI * 2, v: 30, size: K.size, base: (26 + Math.random() * 14) * K.sp, ph: Math.random() * 6, turn: 0, turnT: 0, flee: 0, fx: 0, fy: 0 };\n}\nfunction stock(n, pour) {\n  for (let i = 0; i < n; i++) {\n    let x, y, tries = 0;\n    do { x = water.x + 30 + Math.random() * (water.w - 60); y = water.y + 30 + Math.random() * (water.h - 60); } while (sd(x, y) > -30 && ++tries < 20);\n    if (pour) { x = water.x + water.w * (.3 + Math.random() * .4); y = water.y + 40 + Math.random() * 30; }\n    const f = makeFish(pickKind(), x, y);\n    if (pour) { f.flee = .8; f.fx = Math.random() - .5; f.fy = 1; }\n    fish.push(f);\n  }\n}\nfunction newPoi() {\n  Object.assign(poi, { inWater: false, wet: false, D: 100, torn: false, spd: 0, tearT: 0, visible: true });\n  poi.cracks = Array.from({ length: 6 }, () => {\n    const a = Math.random() * Math.PI * 2, b = a + (Math.random() - .5) * 1.6, r1 = Math.random() * R * .5, r2 = R * (.55 + Math.random() * .4);\n    return [Math.cos(a) * r1, Math.sin(a) * r1, Math.cos(b) * r2, Math.sin(b) * r2];\n  });\n}\nfunction hud() {\n  scoreEl.textContent = score;\n  const used = POIS - poisLeft;\n  poiEl.innerHTML = Array.from({ length: POIS }, (_, i) => `<i class=\"${i < used ? 'used' : ''}\"><\/i>`).join('');\n}\nfunction reset() {\n  fish = []; flying = []; inBowl = []; rings = []; floats = [];\n  score = 0; poisLeft = POIS; counts = {}; held = null;\n  stock(14, false); newPoi(); hud();\n}\nfunction start() {\n  if (state === 'play' || state === 'between') return;\n  if (state === 'paused') { resume(); return; }\n  reset(); state = 'play'; ov.hidden = true; ovBtn.blur();\n  showPop('第 1 支紙網');\n}\nfunction pause() {\n  if (state !== 'play' && state !== 'between') return;\n  state = 'paused'; held = null;\n  ovTitle.textContent = '休息一下'; ovText.textContent = '紙網先停在原地，水不會繼續泡它。';\n  pricesEl.hidden = true; ovBtn.textContent = '繼續撈'; ovKeys.textContent = 'P 或空白鍵也能繼續';\n  ov.hidden = false;\n}\nfunction resume() {\n  if (state !== 'paused') return;\n  state = 'play'; ov.hidden = true; pricesEl.hidden = false; ovBtn.blur();\n  if (poi.inWater) lift();\n}\nfunction l.innerHTML = '<div class=\"pit\"><\/div><div class=\"slot\"><div class=\"mole\"><i class=\"eye l\"><\/i><i class=\"eye r\"><\/i><i class=\"nose\"><\/i><i class=\"teeth\"><\/i><\/div><\/div><div class=\"lip\"><\/div><div class=\"float\"><\/div><span class=\"key\">' + KEYS[i][3] + '<\/span>';\n  plot.appendChild(el);\n  const h = { el, fl: el.querySelector('.float'), st: 'down', type: 'normal', t: 0, stay: 1 };\n  el.addEventListener('pointerdown', e => { e.preventDefault(); whack(h); });\n  holes.push(h);\n}\nfunction layout() {\n  const r = stage.getBoundingClientRect();\n  const h = Math.max(70, Math.min((r.width - 32) / 3.3, (r.height - 70) / 3.3, 150));\n  plot.style.setProperty('--h', Math.floor(h) + 'px');\n}\nlayout();\nif ('ResizeObserver' in window) new ResizeObserver(layout).observe(stage); else addEventListener('resize', layout);\n\nlet state = 'ready', timeLeft = ROUND, elapsed = 0, spawnT = 0, score = 0, combo = 0, hits = 0, swings = 0, overAt = 0;\nlet best = store.get('mole.best', 0);\nconst mult = () => Math.min(5, 1 + Math.floor(combo / 5));\nfunction hud() { scoreEl.textContent = score; comboEl.textContent = '×' + mult(); }\nfunction render(h) {\n  h.el.className = 'hole' + (h.st === 'up' ? ' up' : h.st === 'hit' ? ' hit' : '') + (h.type !== 'normal' ? ' ' + h.type : '');\n}\nfunction floatText(h, text, neg) {\n  h.fl.textContent = text; h.fl.classList.toggle('neg', !!neg);\n  h.fl.classList.remove('show'); void h.fl.offsetWidth; h.fl.classList.add('show');\n}\nfunction spawn() {\n  const free = holes.filter(h => h.st === 'down');\n  if (!free.length) return;\n  const h = free[Math.floor(Math.random() * free.length)];\n  const r = Math.random();\n  h.type = elapsed > 6 && r < .14 ? 'bomb' : r > .93 ? 'gold' : 'normal';\n  h.st = 'up'; h.t = 0;\n  h.stay = Math.max(.55, 1.2 - elapsed * .013) * (h.type === 'gold' ? .75 : h.type === 'bomb' ? 1.3 : 1);\n  render(h);\n}\nfunction whack(h) {\n  if (state !== 'play') return;\n  swings++;\n  if (h.st !== ' aused') { state = 'play'; ov.hidden = true; ovBtn.blur(); return; }\n  if (state === 'over' && performance.now() - overAt < 700) return;\n  start();\n});\naddEventListener('keydown', e => {\n  const i = KEYS.indexOf(e.code);\n  if (i >= 0 && !e.repeat) { e.preventDefault(); whack(holes[i]); return; }\n  const n = e.code.startsWith('Numpad') ? +e.code.slice(6) : NaN;\n  if (n >= 1 && n <= 9 && !e.repeat) { const map = [7, 8, 9, 4, 5, 6, 1, 2, 3]; whack(holes[map.indexOf(n)]); return; }\n  if ((e.code === 'Space' || e.code === 'Enter') && !ov.hidden && !(e.target.closest && e.target.closest('button'))) { e.preventDefault(); ovBtn.click(); }\n  if (e.code === 'KeyP' || e.code === 'Escape') pause();\n});\ndocument.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });\n\nlet lastT = performance.now();\nfunction frame(now) {\n  const dt = Math.min(Math.max((now - lastT) / 1000, 0), .1); lastT = now;\n  if (state === 'play') {\n    elapsed += dt; timeLeft -= dt; spawnT -= dt;\n    if (spawnT <= 0) {\n      spawn(); if (elapsed > 15 && Math.random() < .35) spawn();\n      spawnT = Math.max(.36, .95 - elapsed * .013);\n    }\n    for (const h of holes) {\n      if (h.st === 'up') { h.t += dt; if (h.t > h.stay) { if (h.type !== 'bomb') { combo = 0; hud(); } h.st = 'down'; render(h); } }\n      else if (h.st === 'hit') { h.t += dt; if (h.t > .32) { h.st = 'down'; render(h); } }\n    }\n    if (timeLeft <= 0) { timeLeft = 0; end(); }\n  }\n  timeEl.style.transform = `scaleX(${Math.max(0, timeLeft / ROUND)})`;\n  timer.classList.toggle('low', timeLeft < 10 && state === 'play');\n  timeLabel.textContent = Math.ceil(timeLeft);\n  requestAnimationFrame(frame);\n}\n// opening lawn: a few residents peeking out\n[1, 3, 8].forEach((i, k) => { holes[i].st = 'up'; holes[i].type = k === 1 ? 'gold' : 'normal'; render(holes[i]); });\nhud();\nrequestAnimationFrame(frame);\n})();\n<\/script>\n", "piano": "<!doctype html>\n<html lang=\"zh-Hant\">\n<head>\n<meta charset btn\" id=\"ov-btn\">點最下面的「開始」<\/button><span class=\"keys\">電腦可用 D F J K 對應四條鍵<\/span><\/div>\n      <div class=\"pieces\" id=\"pieces\" role=\"group\" aria-label=\"曲目\"><\/div>\n      <button class=\"ghost small\" id=\"song-del\" type=\"button\" hidden><\/button>\n    <\/div>\n    <form class=\"editor\" id=\"editor\" hidden>\n      <label for=\"song-name\">曲名<\/label>\n      <input id=\"song-name\" maxlength=\"12\" placeholder=\"例如：我的第一首\" autocomplete=\"off\">\n      <label for=\"song-score\">簡譜<\/label>\n      <textarea id=\"song-score\" rows=\"4\" placeholder=\"1 1 5 5 | 6 6 5 - | 4 4 3 3 | 2 2 1 -\" spellcheck=\"false\" autocomplete=\"off\"><\/textarea>\n      <p class=\"hint\">用 1 到 7 寫音符，1 是中央 Do。高八度在後面加 <code>'<\/code>，例如 <code>1'<\/code>；低八度加 <code>,<\/code>，例如 <code>5,<\/code>。升半音寫 <code>#4<\/code>，降半音寫 <code>b7<\/code>。空格、<code>|<\/code>、<code>-<\/code> 和 <code>0<\/code> 都會略過，只看音的順序。<\/p>\n      <p class=\"msg\" id=\"song-msg\" aria-live=\"polite\">還沒有音符<\/p>\n      <div class=\"row\"><button type=\"submit\" class=\"btn\">存起來<\/button><button type=\"button\" class=\"ghost\" id=\"song-try\">試聽<\/button><button type=\"button\" class=\"ghost\" id=\"song-cancel\">取消<\/button><\/div>\n    <\/form>\n  <\/section>\n<\/main>\n\n<script>\n(() => {\nconst store = {\n  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },\n  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }\n};\nconst $ = id => document.getElementById(id);\nconst stage = $('stage'), cv = $('cv'), ctx = cv.getContext('2d');\nconst bestEl = $('best'), pieceEl = $('piece'), muteBtn = $('mute');\nconst ov = $('overlay'), ovTitle = $('ov-title'), ovText = $('ov-text'), ovBtn = $('ov-btn'), piecesEl = $('pieces');\n\n/* ---------- songs, written in numbered notation (簡譜) ----------\n   1–7 = Do Re Mi Fa Sol La Si, with 1 = middle C (MIDI 60)\n   ' after a note = one octave up (1' = high Do), , after a note = one octave down (5, = low Sol)\n   # before = sharp, b before = flat; spaces, | , - and 0 are ignored — only the order of notes matters\n   To add a song, append { name, score } here. key moves the whole song, e.g. key: 'G' makes 1 = G. */\n// group decides where a song sits in the picker; new songs go at the end so saved picks keep pointing at the same song\nconst SONGS = [\n  { name: '小星星', group: '童謠', score: '1 1 5 5 | 6 6 5 - | 4 4 3 3 | 2 2 1 - | 5 5 4 4 | 3 3 2 - | 5 5 4 4 | 3 3 2 - | 1 1 5 5 | 6 6 5 - | 4 4 3 3 | 2 2 1 -' },\n  { name: '歡樂頌', group: '名曲', score: '3 3 4 5 | 5 4 3 2 | 1 1 2 3 | 3 2 2 - | 3 3 4 5 | 5 4 3 2 | 1 1 2 3 | 2 1 1 - | 2 2 3 1 | 2 3 4 3 1 | 2 3 4 3 2 | 1 2 5, - | 3 3 4 5 | 5 4 3 2 | 1 1 2 3 | 2 1 1 -' },\n  { name: '給愛麗絲', group: '名曲', score: \"3' #2' 3' #2' 3' 7 2' 1' | 6 - 1 3 6 | 7 - 3 #5 7 | 1' - 3 3' #2' | 3' #2' 3' 7 2' 1' | 6 - 1 3 6 | 7 - 3 1' 7 | 6 -\" },\n  { name: '小蜜蜂', group: '童謠', score: '5 3 3 - | 4 2 2 - | 1 2 3 4 | 5 5 5 - | 5 3 3 - | 4 2 2 - | 1 3 5 5 | 3 - - - | 2 2 2 2 | 2 3 4 - | 3 3 3 3 | 3 4 5 - | 5 3 3 - | 4 2 2 - | 1 3 5 5 | 1 - - -' },\n  { name: '兩隻老虎', group: '童謠', score: '1 2 3 1 | 1 2 3 1 | 3 4 5 - | 3 4 5 - | 5 6 5 4 3 1 | 5 6 5 4 3 1 | 1 5, 1 - | 1 5, 1 -' },\n  { name: '生日快樂', group: '節日', score: \"5 5 6 5 | 1' 7 - | 5 5 6 5 | 2' 1' - | 5 5 5' 3' | 1' 7 6 - | 4' 4' 3' 1' | 2' 1' -\" },\n  { name: '瑪莉有隻小綿羊', group: '童謠', score: '3 2 1 2 | 3 3 3 - | 2 2 2 - | 3 5 5 - | 3 2 1 2 | 3 3 3 3 | 2 2 3 2 | 1 - - -' },\n  { name: '倫敦鐵橋', group: '童謠', score: '5 6 5 4 | 3 4 5 - | 2 3 4 - | 3 4 5 - | 5 6 5 4 | 3 4 5 - | 2 - 5 - | 3 1 - -' },\n  { name: '聖誕鈴聲', group: '節日', score: '3 3 3 - | 3 3 3 - | 3 5 1 2 | 3 - - - | 4 4 4 4 | 4 3 3 3 3 | 3 2 2 3 | 2 - 5 - | 3 3 3 - | 3 3 3 - | 3 5 1 2 | 3 - - - | 4 4 4 4 | 4 3 3 3 3 | 5 5 4 2 | 1 - - -' },\n  { name: '念故鄉', group: '名曲', score: '3 5 5 - | 3 2 1 - | 2 3 5 3 | 2 - - - | 3 5 5 - | 3 2 1 - | 2 3 2 1 | 1 - - -' },\n  { name: '新年好', group: '節日', score: '1 1 1 5, | 3 3 3 1 | 1 3 5 5 | 4 3 2 - | 2 3 4 4 | 3 2 3 1 | 1 3 2 5, | 7, 2 1 -' },\n  { name: '平安夜', group: '節日', score: \"5 6 5 3 - | 5 6 5 3 - | 2' 2' 7 - | 1' 1' 5 - | 6 6 1' 7 6 | 5 6 5 3 - | 6 6 1' 7 6 | 5 6 5 3 - | 2' 2' 4' 2' 7 | 1' 3' - | 1' 5 3 5 4 2 | 1 - -\" },\n  { name: '王老先生有塊地', group: '童謠', score: '1 1 1 5, | 6, 6, 5, - | 3 3 2 2 | 1 - - 5, | 1 1 1 5, | 6, 6, 5, - | 3 3 2 2 | 1 - - -' },\n  { name: '聖者進行曲', group: '童謠', score: '1 3 4 5 - | 1 3 4 5 - | 1 3 4 5 3 1 3 2 - | 3 3 2 1 1 3 5 5 4 - | 3 4 5 3 1 2 1 -' },\n  { name: '噢！蘇珊娜', group: '童謠', score: '1 2 | 3 5 5 6 5 3 1 2 | 3 3 2 1 2 - | 1 2 3 5 5 6 5 3 1 2 | 3 3 2 2 1 - | 4 4 6 6 6 5 5 3 1 2 - | 1 2 3 5 5 6 5 3 1 2 | 3 3 2 2 1 -' },\n  { name: '送別', group: '名曲', score: \"5 3 5 1' - | 6 1' 5 - | 5 1 2 3 2 1 | 2 - - - | 5 3 5 1' 7 | 6 1' 5 - | 5 2 3 4 7, | 1 - - - | 6 1' 1' - | 7 6 7 1' - | 6 7 1' 6 6 5 3 1 | 2 - - - | 5 3 5 1' 7 | 6 1' 5 - | 5 2 3 4 7, | 1 - - -\" },\n  { name: '布拉姆斯搖籃曲', group: '名曲', score: \"3 3 5 - | 3 3 5 - | 3 5 1' 7 6 6 5 | 2 3 4 2 2 3 4 - | 2 4 7 6 5 7 1' - | 1 1 1' 6 4 5 | 3 1 4 5 6 5 | 1 1 1' 6 4 5 | 3 1 4 3 2 1 -\" },\n  { name: '綠袖子', group: '名曲', score: \"6 1' 2' 3' 4' 3' 2' 7 5 6 7 1' 6 6 #5 6 7 #5 3 | 6 1' 2' 3' 4' 3' 2' 7 5 6 7 1' 7 6 #5 #4 #5 6 6 | 5' 5' #4' 3' 2' 7 5 6 7 1' 6 6 #5 6 7 #5 3 | 5' 5' #4' 3' 2' 7 5 6 7 1' 7 6 #5 #4 #5 6 6\" },\n  { name: '卡農', group: '名曲', score: \"3' 2' 1' 7 | 6 5 6 7 | 1' 7 6 5 | 4 3 4 2\" },\n  { name: '土耳其進行曲', group: '名曲', score: \"7 6 #5 6 1' - | 2' 1' 7 1' 3' - | 4' 3' #2' 3' 7' 6' #5' 6' 7' 6' #5' 6' 1'' -\" }\n];\nconst GROUPS = ['童謠', '節日', '名曲'];\nconst KEY_OFFSET = { C: 0, 'C#': 1, Db: 1, D: 2, Eb: 3, E: 4, F: 5, 'F#': 6, Gb: 6, G: 7, Ab: 8, A: 9, Bb: 10, B: 11 };\nconst STEP = [0, 0, 2, 4, 5, 7, 9, 11];\nfunction parseScore(text, key = 'C') {\n  const base = 60 + (KEY_OFFSET[key] || 0), out = [];\n  // the curly quotes are what a phone keyboard types for '\n  const re = /([#♯b♭]?)([0-7])([',’‘′]*)/g;\n  let m;\n  while ((m = re.exec(String(text)))) {\n    const d = +m[2];\n    if (!d) continue;\n    let n = base + STEP[d];\n    if (m[1] === '#' || m[1] === '♯') n++; else if (m[1]) n--;\n    for (const c of m[3]) n += c === ',' ? -12 : 12;\n    out.push(Math.max(36, Math.min(96, n)));\n  }\n  return out;\n}\nSONGS.forEach(s => { s.notes = parseScore(s.score, s.key); });\n\n// songs a player typed in themselves live only in this browser\nlet custom = store.get('piano.custom', []);\nif (!Array.isArray(custom)) custom = [];\ncustom = custom.filter(s => s && typeof s.name === 'string' && typeof s.score === 'string').slice(0, 30);\ncustom.forEach(s => { s.notes = parseScore(s.score); });\nconst songOf = sel => typeof sel === 'string' ? custom[+sel.slice(1)] : SONGS[sel];\nlet melody = store.get('piano.piece', 0);\nif (!songOf(melody) || !songOf(melody).notes.length) melody = 0;\nlet noteIdx = 0;\n\nlet actx = null, muted = !!store.get('piano.muted', false);\nfunction audio() {\n  actx = actx || new (window.AudioContext || window.webkitAudioContext)();\n  if (actx.state === 'suspended') actx.resume();\n  return actx;\n}\n// a soft struck-string voice: fundamental plus a quiet octave, fast attack, long decay\nfunction note(midi, vel = 1) {\n  if (muted) return;\n  try {\n    const a = audio(), t = a.currentTime, f = 440 * Math.pow(2, (midi - 69) / 12);\n    const g = a.createGain(); g.connect(a.destination);\n    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.16 * vel, t + .008); g.gain.exponentialRampToValueAtTime(.0001, t + 1.4);\n    [[f, 'triangle', 1], [f * 2, 'sine', .35], [f * 3, 'sine', .08]].forEach(([fr, type, amp]) => {\n      const o = a.createOscillator(), og = a.createGain();\n      o.type = type; o.frequency.value = fr; og.gain.value = amp;\n      o.connect(og); og.connect(g); o.start(t); o.stop(t + 1.5);\n    });\n  } catch (e) {}\n}\nfunction clash() { if (muted) return; [48, 49, 54, 55].forEach(m => note(m, .9)); }\nfunction setMute(m) { muted = m; muteBtn.setAttribute('aria-pressed', String(!m)); muteBtn.classList.toggle('off', m); store.set('piano.muted', m); }\nsetMute(muted);\nmuteBtn.addEventListener('click', () => { setMute(!muted); muteBtn.blur(); if (!muted) note(72); });\n\nconst W = 400, LANES = 4, LW = W / LANES;\nlet H = 600, S = 1, DPR = 1, rowH = 150;\nfunction fit() {\n  const r = stage.getBoundingClientRect();\n  if (!r.width || !r.height) return;\n  DPR = Math.min(window.devicePixelRatio || 1, 2);\n  cv.width = Math.round(r.width * DPR); cv.height = Math.round(r.height * DPR);\n  const oldRow = rowH;\n  S = r.width / W; H = r.height / S; rowH = H / 4;\n  if (oldRow && rows.length) { const k = rowH / oldRow; rows.forEach(rw => { rw.y *= k; }); }\n}\nlet rows = [], state = 'ready', speed = 0, hits = 0, failT = 0, fail = null, overAt = 0, flash = [];\nlet best = store.get('piano.best', 0);\nbestEl.textContent = best;\nfit();\nif ('ResizeObserver' in window) new ResizeObserver(fit).observe(stage); else addEventListener('resize', fit);\n\nfunction pickLane(prev) { let l; do { l = Math.floor(Math.random() * LANES); } while (l === prev && Math.random() < .6); return l; }\nfunction reset() {\n  rows = []; speed = 0; hits = 0; noteIdx = 0; fail = null; flash = [];\n  let lane = -1;\n  for (let i = 0; i < 6; i++) { lane = pickLane(lane); rows.push({ y: H - rowH * (i + 1), lane, hit: false, start: i === 0 }); }\n}\n/* ---------- song picker ---------- */\nconst menu = $('menu'), editor = $('editor'), delBtn = $('song-del');\nconst nameIn = $('song-name'), scoreIn = $('song-score'), msgEl = $('song-msg');\nconst selKey = sel => String(sel);\nfunction renderPieces() {\n  piecesEl.innerHTML = '';\n  const add = (label, sel, cls) => {\n    const b = document.createElement('button');\n    b.type = 'button'; b.textContent = label; b.dataset.sel = selKey(sel);\n    if (cls) b.className = cls;\n    if (sel !== null) b.setAttribute('aria-pressed', String(selKey(sel) === selKey(melody)));\n    piecesEl.appendChild(b);\n  };\n  const label = t => { const s = document.createElement('span'); s.className = 'grp'; s.textContent = t; piecesEl.appendChild(s); };\n  for (const g of GROUPS) {\n    label(g);\n    SONGS.forEach((s, i) => { if (s.group === g) add(s.name, i); });\n  }\n  label('自訂');\n  custom.forEach((s, i) => add(s.name, 'c' + i, 'mine'));\n  add('＋ 自己加一首', null, 'add');\n}\nfunction setPiece(sel) {\n  melody = sel; store.set('piano.piece', sel);\n  pieceEl.textContent = '曲目：' + songOf(sel).name;\n  piecesEl.querySelectorAll('button[data-sel]').forEach(b => { if (b.hasAttribute('aria-pressed')) b.setAttribute('aria-pressed', String(b.dataset.sel === selKey(sel))); });\n  disarmDelete();\n  delBtn.hidden = typeof sel !== 'string';\n  if (!delBtn.hidden) delBtn.textContent = `刪除《${songOf(sel).name}》`;\n}\npiecesEl.addEventListener('click', e => {\n  const b = e.target.closest('button'); if (!b) return;\n  if (b.classList.contains('add')) { openEditor(); return; }\n  const sel = b.dataset.sel.startsWith('c') ? b.dataset.sel : +b.dataset.sel;\n  setPiece(sel); note(songOf(sel).notes[0]);\n});\n\n// deleting a song takes two taps, since the viewer cannot show a confirm dialog\nlet armT = 0;\nfunction disarmDelete() { clearTimeout(armT); delBtn.classList.remove('armed'); delete delBtn.dataset.armed; if (typeof melody === 'string' && songOf(melody)) delBtn.textContent = `刪除《${songOf(melody).name}》`; }\ndelBtn.addEventListener('click', () => {\n  if (typeof melody !== 'string') return;\n  if (!delBtn.dataset.armed) {\n    delBtn.dataset.armed = '1'; delBtn.classList.add('armed'); delBtn.textContent = '再按一次就刪除';\n    armT = setTimeout(disarmDelete, 3000);\n    return;\n  }\n  custom.splice(+melody.slice(1), 1);\n  store.set('piano.custom', custom.map(({ name, score }) => ({ name, score })));\n  melody = 0; renderPieces(); setPiece(0);\n});\n\n/* ---------- add-a-song form ---------- */\nlet prevTitle = '', tryTimers = [];\nfunction stopTry() { tryTimers.forEach(clearTimeout); tryTimers = []; }\nfunction showCount() {\n  const n = parseScore(scoreIn.value).length;\n  msgEl.classList.remove('err');\n  msgEl.textContent = n ? `讀到 ${n} 個音` : '還沒有音符';\n}\nfunction openEditor() {\n  prevTitle = ovTitle.textContent; ovTitle.textContent = '自己加一首';\n  menu.hidden = true; editor.hidden = false;\n  nameIn.value = ''; scoreIn.value = ''; showCount();\n  try { nameIn.focus({ preventScroll: true }); } catch (e) {}\n}\nfunction closeEditor() {\n  if (editor.hidden) return;\n  stopTry(); editor.hidden = true; menu.hidden = false;\n  ovTitle.textContent = prevTitle || '月光鋼琴';\n}\nscoreIn.addEventListener('input', showCount);\n$('song-try').addEventListener('click', () => {\n  stopTry();\n  const notes = parseScore(scoreIn.value).slice(0, 16);\n  if (!notes.length) { msgEl.classList.add('err'); msgEl.textContent = '還沒有音符可以試聽，先寫幾個 1 到 7 的數字。'; return; }\n  notes.forEach((n, i) => tryTimers.push(setTimeout(() => note(n), i * 280)));\n});\n$('song-cancel').addEventListener('click', closeEditor);\neditor.addEventListener('submit', e => {\n  e.preventDefault();\n  const notes = parseScore(scoreIn.value);\n  if (notes.length < 4) {\n    msgEl.classList.add('err');\n    msgEl.textContent = `至少要 4 個音才能彈，現在讀到 ${notes.length} 個。`;\n    return;\n  }\n  if (custom.length >= 30) {\n    msgEl.classList.add('err');\n    msgEl.textContent = '最多存 30 首，先刪掉幾首自訂的再加。';\n    return;\n  }\n  const name = nameIn.value.trim().slice(0, 12) || `我的曲子 ${custom.length + 1}`;\n  custom.push({ name, score: scoreIn.value, notes });\n  store.set('piano.custom', custom.map(({ name, score }) => ({ name, score })));\n  closeEditor();\n  if (state === 'ready') ovTitle.textContent = '月光鋼琴';\n  renderPieces(); setPiece('c' + (custom.length - 1));\n  note(notes[0]);\n});\nrenderPieces(); setPiece(melody);\n\nconst target = () => rows.find(r => !r.hit);\nfunction playNext() {\n  const m = songOf(melody).notes;\n  note(m[noteIdx % m.length]);\n  noteIdx++;\n}\nfunction hit(r) {\n  r.hit = true; r.hitT = 0; hits++;\n  playNext();\n  if (state === 'ready') { closeEditor(); state = 'play'; ov.hidden = true; speed = 1.7; }\n}\nfunction lose(lane, r, missed) {\n  state = 'fail'; failT = 1; fail = { lane, r, missed };\n  if (missed) { const shift = r.y - (H - rowH); rows.forEach(x => { x.y -= shift; }); }\n  clash();\n}\nfunction gameOver() {\n  state = 'over'; overAt = performance.now();\n  const rec = hits > best;\n  try { parent.postMessage({ type: 'arcade:score', game: 'piano', score: hits }, '*'); } catch (e) {}   // 交給大廳上傳排行榜\n  if (rec) { best = hits; store.set('piano.best', best); bestEl.textContent = best; }\n  ovTitle.textContent = fail && fail.missed ? '漏了一個鍵' : '踩到白鍵了';\n  ovText.innerHTML = (rec ? '<span class=\"rec\">新紀錄！<\/span>' : '') + `《${songOf(melody).name}》彈了 ${hits} 個音，最高 ${best} 個。換首曲子或直接再彈一次。`;\n  ovBtn.textContent = '再彈一次';\n  ov.hidden = false;\n}\nfunction restart() { reset(); state = 'ready'; ovTitle.textContent = '月光鋼琴'; ovBtn.textContent = '點最下面的「開始」'; ov.hidden = true; }\n\nfunction press(lane, y) {\n  if (state === 'over' || state === 'fail') return;\n  const t = target(); if (!t) return;\n  // taps outside the next row to play are ignored, so a quick double-tap on a played key never ends the piece\n  if (y !== null && !(y >= t.y && y < t.y + rowH)) return;\n  if (lane === t.lane) hit(t);\n  else if (state === 'play') lose(lane, t, false);\n}\nstage.addEventListener('pointerdown', e => {\n  if (e.target.closest('.overlay')) return;\n  e.preventDefault();\n  if (state === 'over') { if (performance.now() - overAt > 600) restart(); return; }\n  const r = stage.getBoundingClientRect();\n  const x = (e.clientX - r.left) / S, y = (e.clientY - r.top) / S;\n  press(Math.max(0, Math.min(LANES - 1, Math.floor(x / LW))), y);\n});\novBtn.addEventListener('click', () => { if (state === 'over') restart(); else ov.hidden = true; ovBtn.blur(); });\nconst KEYMAP = { KeyD: 0, KeyF: 1, KeyJ: 2, KeyK: 3 };\naddEventListener('keydown', e => {\n  if (!editor.hidden || (e.ta
