 by[p.t] || { n: 0, pts: 0 }; by[p.t].n++; by[p.t].pts += pointsOf(p); }\n  pricesEl.innerHTML = TYPE_KEYS.map(k => `<div>${TYPES[k].name} ×${by[k] ? by[k].n : 0}<b>${by[k] ? by[k].pts : 0}<\/b><\/div>`).join('');\n}\nrenderPrices(null);\n\n/* ---------- perspective: a camera 175 units up, 150 units behind the front row line ---------- */\nconst W = 400, F = 320, D0 = 150, K = 175;\nlet H = 640, S = 1, DPR = 1, yH = 0;\nconst sc = d => F / (d + D0);\nfunction proj(x, d, z = 0) { const s = sc(d); return { x: W / 2 + x * s, y: yH + K * s - z * s, s }; }\nfunction fit() {\n  const r = stage.getBoundingClientRect();\n  if (!r.width || !r.height) return;\n  DPR = Math.min(window.devicePixelRatio || 1, 2);\n  cv.width = Math.round(r.width * DPR); cv.height = Math.round(r.height * DPR);\n  S = r.width / W; H = r.height / S;\n  yH = (H - 64) - K * sc(START.d);   // the spot you throw from sits just above the bottom edge\n}\nfunction ringShape(x, d, z) {\n  const c = proj(x, d, z), a = proj(x, d - RR, z), b = proj(x, d + RR, z);\n  let rx = RR * c.s, ry = (a.y - b.y) / 2, s = c.s;\n  // right in front of the camera the true perspective is too big to read, so cap the size and the tilt\n  if (rx > 34) { const k = 34 / rx; rx *= k; ry *= k; s *= k; }\n  return { cx: c.x, cy: (a.y + b.y) / 2, rx, ry: Math.max(1.5, Math.min(ry, rx * .6)), s };\n}\n\n/* ---------- state ---------- */\nlet prizes = [], rings = [], flying = null, aim = null, won = [];\nlet state = 'ready', score = 0, left = 10, nextT = 0, overAt = 0;\nlet best = store.get('ringtoss.best', 0);\nbestEl.textContent = best;\n\nfunction pickType(row) {\n  const w = ROW_ODDS[row]; let r = Math.random() * w.reduce((a, b) => a + b, 0);\n  for (let i = 0; i < w.length; i++) if ((r -= w[i]) < 0) return TYPE_KEYS[i];\n  return 'can';\n}\nfunction layout() {\n  prizes = [];\n  ROWS.forEach((d, row) => {\n    const xs = row % 2 ? [-82, -27, 27, 82] : [-110, -55, 0, 55, 110];\n    for (const x of xs) {\n      const t = pickType(row);\n      prizes.push({ t, row, x, d, r: TYPES[t].r, h: TYPES[t].h, done: false,\n        c: (t === 'box' ? BOX_COLORS : CAN_COLORS)[Math.floor(Math.random() * (t === 'box' ? BOX_COLORS : CAN_COLORS).length)], wob: Math.random() * 6 });\n    }\n  });\n}\nfunction hud() { ringsEl.textContent = left; scoreEl.textContent = score; }\nfunction reset() { layout(); rings = []; flying = null; aim = null; won = []; score = 0; left = 10; hud(); }\nfunction start() {\n  if (state === 'paused') { resume(); return; }\n  if (state !== 'ready' && state !== 'over') return;\n  reset(); state = 'aim'; ov.hidden = true; ovBtn.blur();\n}\nfunction pause() {\n  if (state !== 'aim' && state !== 'flying' && state !== 'next') return;\n  state = 'paused-' + state; aim = null;\n  ovTitle.textContent = '休息一下'; ovText.textContent = `還有 ${left} 個竹圈，目前 ${score} 分。`;\n  pricesEl.hidden = true; ovBtn.textContent = '繼續丟'; ovKeys.textContent = 'P 或空白鍵也能繼續';\n  ov.hidden = false;\n}\nfunction resume() {\n  if (!state.startsWith('paused-')) return;\n  state = state.slice(7); ov.hidden = true; pricesEl.hidden = false; ovBtn.blur();\n}\nfunction gameOver() {\n  state = 'over'; overAt = performance.now();\n  const rec = score > best;\n  try { parent.postMessage({ type: 'arcade:score', game: 'ringtoss', score: score }, '*'); } catch (e) {}   // 交給大廳上傳排行榜\n  if (rec) { best = score; store.set('ringtoss.best', best); bestEl.textContent = best; }\n  ovTitle.textContent = won.length ? `套到 ${won.length} 樣獎品` : '十個圈都沒套中';\n  ovText.innerHTML = (rec ? '<span class=\"rec\">新紀錄！<\/span>' : '') + `這局 ${score} 分，最高紀錄 ${best} 分。` + (won.length ? '' : '試著讓竹圈從高一點的地方落下。');\n  renderPrices(won); pricesEl.hidden = false;\n  ovBtn.textContent = '再買十個圈'; ovKeys.textContent = '點畫面也能重來';\n  ov.hidden = false;\n}\n\n/* ---------- throwing: pull back, the pull length sets the range, the sideways pull sets the angle ---------- */\nconst MAX_PULL = 170;\nfunction aimFrom(a) {\n  const dx = a.cx - a.x0, dy = a.cy - a.y0;\n  if (dy < 8) return null;\n  const power = Math.min(1, Math.hypot(dx, dy) / MAX_PULL);\n  const angle = Math.max(-.55, Math.min(.55, Math.atan2(-dx, dy)));\n  return { power, angle, range: 40 + power * 420 };\n}\n// horizontal launch speed that lands the ring `range` away, thrown up at 1.5× its forward speed\nfunction launchSpeed(range) {\n  const k = 1.5, z0 = START.z;\n  let lo = 20, hi = 1500;\n  for (let i = 0; i < 40; i++) {\n    const v = (lo + hi) / 2, vz = k * v, T = (vz + Math.sqrt(vz * vz + 2 * G * z0)) / G;\n    if (v * T < range) lo = v; else hi = v;\n  }\n  return lo;\n}\nfunction makeRing(angle, range) {\n  const v = launchSpeed(range);\n  return { x: START.x, d: START.d, z: START.z, vx: v * Math.sin(angle), vd: v * Math.cos(angle), vz: 1.5 * v,\n    spin: 0, grounded: false, around: null, bounced: false, rest: false };\n}\nfunction throwRing(a) {\n  const t = aimFrom(a);\n  if (!t || t.power < .06) return;\n  // a little human wobble in every throw\n  const angle = t.angle + (Math.random() - .5) * .03, range = t.range * (1 + (Math.random() - .5) * .03);\n  flying = makeRing(angle, range);\n  left--; hud(); state = 'flying'; sfx.whoosh();\n}\nfunction bounce(r, p, dx, dd, dist, hop) {\n  const nx = dx / (dist || 1), nd = dd / (dist || 1), out = RR + p.r + .5;\n  r.x = p.x + nx * out; r.d = p.d + nd * out;\n  const vn = r.vx * nx + r.vd * nd;\n  if (vn < 0) { r.vx -= 1.6 * vn * nx; r.vd -= 1.6 * vn * nd; }\n  r.vx *= .45; r.vd *= .45;\n  if (hop) { r.z = Math.max(r.z, p.h); r.vz = 90; }\n  r.bounced = true; sfx.clink();\n}\nfunction stepRing(r, h) {\n  const pz = r.z;\n  r.x += r.vx * h; r.d += r.vd * h;\n  if (!r.grounded) { r.vz -= G * h; r.z += r.vz * h; }\n  r.spin += h * 9;\n  for (const p of prizes) {\n    const dx = r.x - p.x, dd = r.d - p.d, dist = Math.hypot(dx, dd), inner = RR - p.r;\n    if (r.around === p) {\n      // already over the top: the ring can only rattle down around it\n      if (dist > inner - .5) { r.x = p.x + dx / dist * (inner - .5); r.d = p.d + dd / dist * (inner - .5); }\n      continue;\n    }\n    if (dist >= RR + p.r || r.around) continue;\n    const top = p.h + (p.done ? 3 : 0);\n    if (pz > top && r.z <= top) {\n      if (dist <= inner && !p.done) { r.around = p; continue; }\n      // caught on the rim: sometimes it tips over and drops around anyway\n      if (dist < RR && !p.done && Math.random() < .3) {\n        r.x = p.x + dx / dist * (inner - 1); r.d = p.d + dd / dist * (inner - 1); r.around = p; sfx.clink(); continue;\n      }\n      bounce(r, p, dx, dd, dist, true);\n    } else if (r.z < top && dist > inner) {\n      bounce(r, p, dx, dd, dist, false);\n    }\n  }\n  if (r.d > WALL_D) { r.d = WALL_D; r.vd = -Math.abs(r.vd) * .3; sfx.thud(); }\n  if (Math.abs(r.x) > SIDE) { r.x = Math.sign(r.x) * SIDE; r.vx = -r.vx * .3; }\n  if (!r.grounded && r.z <= 0) { r.z = 0; r.vz = 0; r.grounded = true; r.vx *= .2; r.vd *= .2; sfx.thud(); }\n  if (r.grounded) {\n    const f = Math.max(0, 1 - 14 * h); r.vx *= f; r.vd *= f;\n    if (Math.hypot(r.vx, r.vd) < 4) { r.vx = r.vd = 0; r.rest = true; }\n  }\n}\nfunction settle(r) {\n  rings.push(r); flying = null;\n  const p = r.around;\n  if (p && !p.done) {\n    p.done = true; p.ring = r; won.push(p);\n    const pts = pointsOf(p);\n    score += pts; hud(); sfx.win();\n    showPop(`套中${TYPES[p.t].name}！+${pts}`);\n  } else showPop(r.bounced ? '差一點！' : '沒套中');\n  state = 'next'; nextT = left > 0 ? .7 : 1.3;\n}\n\n/* ---------- input ---------- */\nfunction toWorld(e) { const r = stage.getBoundingClientRect(); return { x: (e.clientX - r.left) / S, y: (e.clientY - r.top) / S }; }\nstage.addEventListener('pointerdown', e => {\n  if (e.target.closest('.overlay')) return;\n  e.preventDefault();\n  if (state === 'over') { if (performance.now() - overAt > 900) start(); return; }\n  if (state !== 'aim' || aim) return;\n  const p = toWorld(e);\n  aim = { id: e.pointerId, x0: p.x, y0: p.y, cx: p.x, cy: p.y };\n  try { stage.setPointerCapture(e.pointerId); } catch (_) {}\n});\nstage.addEventListener('pointermove', e => {\n  if (!aim || e.pointerId !== aim.id) return;\n  const p = toWorld(e); aim.cx = p.x; aim.cy = p.y;\n});\nstage.addEventListener('pointerup', e => {\n  if (!aim || e.pointerId !== aim.id) return;\n  const a = aim; aim = null;\n  if (state === 'aim') throwRing(a);\n});\nstage.addEventListener('pointercancel', () => { aim = null; });\novBtn.addEventListener('click', () => { if (state === 'over' && performance.now() - overAt < 600) return; start(); });\naddEventListener('keydown', e => {\n  if (e.code === 'KeyP' || e.code === 'Escape') { state.startsWith('paused-') ? resume() : pause(); return; }\n  if ((e.code === 'Space' || e.code === 'Enter') && !(e.target.closest && e.target.closest('button'))) {\n    e.preventDefault();\n    if (state.startsWith('paused-')) resume(); else if (state === 'ready' || (state === 'over' && performance.now() - overAt > 600)) start();\n  }\n});\ndocument.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });\naddEventListener('blur', pause);\n\n/* ---------- update ---------- */\nfunction update(dt) {\n  if (state.startsWith('paused-')) return;\n  if (state === 'flying' && flying) {\n    for (let i = 0; i < 4; i++) stepRing(flying, dt / 4);\n    if (flying.rest) settle(flying);\n  } else if (state === 'next') {\n    nextT -= dt;\n    if (nextT <= 0) { if (left > 0) state = 'aim'; else gameOver(); }\n  }\n}\n\n/* ---------- draw ---------- */\nfunction ell(cx, cy, rx, ry, a0 = 0, a1 = Math.PI * 2) { ctx.beginPath(); ctx.ellipse(cx, cy, Math.max(.1, rx), Math.max(.1, ry), 0, a0, a1); }\nfunction drawRing(r, part, z = r.z, glow = false) {\n  const e = ringShape(r.x, r.d, z);\n  const wob = r.grounded ? 1 : .8 + .2 * Math.abs(Math.sin(r.spin));\n  const ry = e.ry * wob, lw = Math.max(2, Math.min(7, 5 * e.s));\n  const [a0, a1] = part === 'back' ? [Math.PI, Math.PI * 2] : part === 'front' ? [0, Math.PI] : [0, Math.PI * 2];\n  if (glow) { ctx.strokeStyle = 'rg  / W; H = r.height / S;\n}\nfit();\nif ('ResizeObserver' in window) new ResizeObserver(fit).observe(stage); else addEventListener('resize', fit);\n\nconst rand = (a, b) => a + Math.random() * (b - a);\nconst cat = { x: 92, y: 0, vy: 0, w: 32, h: 22, ground: false, jumps: 0, holdT: 0, coyote: 0, run: 0 };\nconst stars = Array.from({ length: 70 }, () => ({ x: Math.random() * W, y: Math.random() * .55, s: Math.random() * 1.3 + .3, p: Math.random() * 6 }));\nfunction makeLayer(n, minH, maxH, wMin, wMax) {\n  const out = []; let x = 0;\n  while (x < 900) { const w = rand(wMin, wMax), h = rand(minH, maxH); const wins = []; for (let wy = 8; wy < h - 8; wy += 12) for (let wx = 5; wx < w - 6; wx += 9) if (Math.random() < .22) wins.push([wx, wy]); out.push({ x, w, h, wins, spire: Math.random() < .08 }); x += w + rand(0, 6); }\n  return { list: out, span: x };\n}\nconst far = makeLayer(0, 60, 170, 24, 50), mid = makeLayer(0, 50, 120, 40, 80);\n\nlet roofs = [], obs = [], fish = [], parts = [];\nlet state = 'ready', speed = 250, dist = 0, fishN = 0, scroll = 0, deadT = 0, overAt = 0, holding = false, why = '';\nlet best = store.get('roofcat.best', 0);\nbestEl.textContent = best;\nconst scoreNow = () => Math.floor(dist / 10) + fishN * 10;\n\nfunction addRoof() {\n  const last = roofs[roofs.length - 1];\n  const gap = rand(50, 46 + speed * .2);\n  const w = rand(170, 420);\n  const y = Math.max(H * .5, Math.min(H * .82, last.y + rand(-70, 70)));\n  const r = { x: last.x + last.w + gap, w, y, kind: Math.random() < .3 ? 'tin' : 'concrete', shed: Math.random() < .25 };\n  roofs.push(r);\n  if (w > 210) {\n    const n = w > 330 && dist > 600 ? 2 : 1;\n    let px = r.x + rand(115, 155);\n    for (let i = 0; i < n && px < r.x + w - 70; i++) {\n      const pick = Math.random();\n      const type = pick < .4 ? 'tank' : pick < .75 ? 'ac' : 'rebar';\n      const dims = { tank: [38, 46], ac: [30, 22], rebar: [24, 24] }[type];\n      obs.push({ type, x: px, y: r.y, w: dims[0], h: dims[1] });\n      px += rand(150, 200);\n    }\n  }\n  if (Math.random() < .7) {\n    const cx = r.x - gap / 2, top = Math.min(last.y, r.y) - 80;\n    for (let i = -1; i <= 1; i++) fish.push({ x: cx + i * 26, y: top + Math.abs(i) * 14, got: false });\n  }\n}\nfunction reset() {\n  roofs = [{ x: -40, w: 620, y: H * .7, kind: 'concrete' }]; obs = []; fish = []; parts = [];\n  speed = 250; dist = 0; fishN = 0; scroll = 0;\n  while (roofs[roofs.length - 1].x < W + 500) addRoof();\n  cat.y = roofs[0].y - cat.h; cat.vy = 0; cat.ground = true; cat.jumps = 0; cat.coyote = 0;\n  hud();\n}\nfunction hud() {\n  distEl.innerHTML = Math.floor(dist / 10) + '<small>m<\/small>';\n  fishEl.textContent = fishN;\n}\nfunction jump() {\n  if (state === 'ready') start();\n  if (state !== 'play') return;\n  if (cat.ground || cat.coyote > 0) { cat.vy = JUMP; cat.jumps = 1; cat.holdT = 0; cat.ground = false; cat.coyote = 0; tone(420, .1, 'triangle', .04, 1.6); }\n  else if (cat.jumps < 2) { cat.vy = JUMP * .86; cat.jumps = 2; cat.holdT = .2; tone(560, .1, 'triangle', .04, 1.6); for (let i = 0; i < 6; i++) parts.push({ x: cat.x + 10, y: cat.y + cat.h, vx: rand(-80, 80), vy: rand(20, 90), life: .35, col: '#c9cff5' }); }\n}\nfunction start() {\n  if (state === 'play' || state === 'dead') return;\n  reset(); state = 'play'; ov.hidden = true; ovBtn.blur();\n}\nfunction die(reason) {\n  if (state !== 'play') return;\n  state = 'dead'; deadT = .8; why = reason;\n  tone(300, .45, 'sawtooth', .05, .35);\n}\nfunction gameOver() {\n  state = 'over'; overAt = performance.now();\n  const sc = scoreNow(), rec = sc > best;\n  try { parent.postMessage({ type: 'arcade:score', game: 'rooftop', score: sc }, '*'); } catch (e) {}   // 交給大廳上傳排行榜\n  if (rec) { best = sc; store.set('roofcat.best', best); bestEl.textContent = best; }\n  ovTitle.textContent = why;\n  ovText.innerHTML = (rec ? '<span class=\"rec\">新紀錄！<\/span>' : '') + `跑了 ${Math.floor(dist / 10)} 公尺，叼到 ${fishN} 條小魚乾，總分 ${sc}。最高 ${best} 分。`;\n  ovBtn.textContent = '再出門一次';\n  ov.hidden = false;\n}\n\nconst press = () => { holding = true; if (state === 'over') { if (performance.now() - overAt > 600) { start(); } return; } jump(); };\nconst release = () => { holding = false; };\nstage.addEventListener('pointerdown', e => { if (e.target.closest('button')) return; e.preventDefault(); press(); });\naddEventListener('pointerup', release);\naddEventListener('pointercancel', release);\novBtn.addEventListener('click', () => { if (state !== 'play') start(); });\naddEventListener('keydown', e => {\n  if (e.code !== 'Space' && e.code !== 'ArrowUp' && e.code !== 'KeyW') return;\n  if (e.target.closest && e.target.closest('button')) return;\n  e.preventDefault(); if (!e.repeat) press();\n});\naddEventListener('keyup', e => { if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') release(); });\n\nfunction update(dt) {\n  for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; }\n  parts = parts.filter(p => p.life > 0);\n  if (state === 'ready') { scroll += 30 * dt; cat.run += dt * 6; return; }\n  if (state === 'dead') {\n    cat.vy += GRAV * dt; cat.y += cat.vy * dt; deadT -= dt;\n    if (deadT <= 0) gameOver();\n    return;\n  }\n  if (state !== 'play') return;\n  speed = Math.min(540, 250 + dist * .012);\n  const dx = speed * dt;\n  dist += dx; scroll += dx;\n  for (const r of roofs) r.x -= dx;\n  for (const o of obs) o.x -= dx;\n  for (const f of fish) f.x -= dx;\n  roofs = roofs.filter(r => r.x + r.w > -60);\n  obs = obs.filter(o => o.x + o.w > -60);\n  fish = fish.filter(f => f.x > -40 && !f.got);\n  while (roofs[roofs.length - 1].x < W + 300) addRoof();\n\n  const g = holding && cat.vy < 0 && cat.holdT < .22 ? HOLD_G : GRAV;\n  if (holding && cat.vy < 0) cat.holdT += dt;\n  const prevBottom = cat.y + cat.h;\n  cat.vy = Math.min(cat.vy + g * dt, 950);\n  cat.y += cat.vy * dt;\n  const wasGround = cat.ground;\n  cat.ground = false;\n  for (const r of roofs) {\n    if (cat.x + cat.w <= r.x + 3 || cat.x >= r.x + r.w - 2) continue;\n    if (cat.vy >= 0 && prevBottom <= r.y + 3 && cat.y + cat.h >= r.y) {\n      cat.y = r.y - cat.h; cat.vy = 0; cat.ground = true; cat.jumps = 0;\n      if (!wasGround) { tone(180, .05, 'square', .02); for (let i = 0; i < 4; i++) parts.push({ x: cat.x + rand(0, cat.w), y: r.y, vx: rand(-60, 60), vy: rand(-60, -10), life: .3, col: '#8e95b5' }); }\n    } else if (cat.y + cat.h > r.y + 10) { die('撞上樓牆了'); return; }\n  }\n  if (cat.ground) cat.coyote = .09; else cat.coyote = Math.max(0, cat.coyote - dt);\n  cat.run += dt * speed / 26;\n  if (cat.y > H + 30) { die('掉進防火巷了'); return; }\n  for (const o of obs) {\n    if (cat.x + cat.w - 5 > o.x + 3 && cat.x + 5 < o.x + o.w - 3 && cat.y + cat.h - 3 > o.y - o.h) {\n      die(o.type === 'tank' ? '撞到水塔了' : o.type === 'ac' ? '撞到冷氣室外機了' : '被鋼筋絆倒了'); return;\n    }\n  }\n  for (const f of fish) {\n    if (!f.got && Math.abs(f.x - (cat.x + cat.w / 2)) < 22 && Math.abs(f.y - (cat.y + cat.h / 2)) < 24) {\n      f.got = true; fishN++; tone(990 + (fishN % 3) * 120, .06, 'square', .03);\n    }\n  }\n  hud();\n}\n\n/* ---------- draw ---------- */\nfunction drawLayer(L, par, base, col, winAlpha) {\n  const off = (scroll * par) % L.span;\n  for (let k = 0; k < 2; k++) for (const b of L.list) {\n    const x = b.x - off + k * L.span;\n    if (x > W || x + b.w < 0) continue;\n    ctx.fillStyle = col; ctx.fillRect(x, base - b.h, b.w, b.h + H);\n    if (b.spire) { ctx.beginPath(); ctx.moveTo(x + b.w / 2 - 4, base - b.h); ctx.lineTo(x + b.w / 2, base - b.h - 30); ctx.lineTo(x + b.w / 2 + 4, base - b.h); ctx.fill(); }\n    ctx.fillStyle = `rgba(255,207,107,${winAlpha})`;\n    for (const [wx, wy] of b.wins) ctx.fillRect(x + wx, base - b.h + wy, 4, 5);\n  }\n}\nfunction drawRoof(r) {\n  const x = r.x, y = r.y;\n  ctx.fillStyle = r.kind === 'tin' ? '#424a62' : '#4c5266'; ctx.fillRect(x, y, r.w, H - y + 10);\n  ctx.fillStyle = 'rgba(255,207,107,.75)';\n  for (let wy = y + 26; wy < H; wy += 34) for (let wx = x + 14; wx < x + r.w - 20; wx += 30) if (((wx * 7 + wy * 3) | 0) % 5 === 0) ctx.fillRect(wx, wy, 12, 14);\n  ctx.fillStyle = 'rgba(0,0,0,.25)';\n  for (let wy = y + 26; wy < H; wy += 34) for (let wx = x + 14; wx < x + r.w - 20; wx += 30) if (((wx * 7 + wy * 3) | 0) % 5 !== 0) ctx.fillRect(wx, wy, 12, 14);\n  ctx.fillStyle = '#6a7190'; ctx.fillRect(x - 2, y, r.w + 4, 5);\n  ctx.fillStyle = '#5a6080'; ctx.fillRect(x, y + 5, r.w, 3);\n  if (r.kind === 'tin' && r.shed) {\n    // a corrugated rooftop add-on, the classic iron-sheet shed\n    const sx = x + r.w - 90;\n    if (sx > x + 20) {\n      ctx.fillStyle = '#6b7a91'; ctx.fillRect(sx, y - 34, 70, 34);\n      ctx.fillStyle = 'rgba(0,0,0,.18)'; for (let i = 0; i < 70; i += 6) ctx.fillRect(sx + i, y - 34, 2, 34);\n      ctx.fillStyle = '#8796ac'; ctx.beginPath(); ctx.moveTo(sx - 6, y - 34); ctx.lineTo(sx + 76, y - 40); ctx.lineTo(sx + 76, y - 34); ctx.closePath(); ctx.fill();\n    }\n  }\n}\nfunction drawObstacle(o) {\n  const x = o.x, base = o.y;\n  if (o.type === 'tank') {\n    ctx.strokeStyle = '#8b93a8'; ctx.lineWidth = 2;\n    ctx.beginPath(); ctx.moveTo(x + 5, base); ctx.lineTo(x + 8, base - 14); ctx.moveTo(x + o.w - 5, base); ctx.lineTo(x + o.w - 8, base - 14); ctx.moveTo(x + 6, base - 7); ctx.lineTo(x + o.w - 6, base - 7); ctx.stroke();\n    const g = ctx.createLinearGradient(x, 0, x + o.w, 0);\n    g.addColorStop(0, '#7e8799'); g.addColorStop(.35, '#e6ebf2'); g.addColorStop(.6, '#aab3c2'); g.addColorStop(1, '#6d7586');\n    ctx.fillStyle = g; ctx.fillRect(x, base - o.h, o.w, o.h - 14);\n    ctx.beginPath(); ctx.ellipse(x + o.w / 2, base - o.h, o.w / 2, 5, 0, 0, Math.PI * 2); ctx.fill();\n    ctx.fillStyle = 'rgba(0,0,0,.15)'; ctx.fillRect(x, base - o.h + 10, o.w, 2); ctx.fillRect(x, base - 24, o.w, 2);\n  } else if (o.type === 'ac') {\n    ctx.fillStyle = '#c9ccd4'; ctx.fillRect(x, base - o.h, o.w, o.h);\n    ctx.fillStyle = '#9da2ad'; ctx.beginPath(); ctx.arc(x + o.w * .4, base - o.h / 2, 8, 0, Math.PI * 2); ctx.fill(   { id: 'ringtoss',    title: '夜市套圈圈', cat: '動作', desc: '往下拉再放開丟竹圈，整個套住獎品才算。', best: score('ringtoss.best', '分') },
  { id: 'bricks',      title: '套色打磚塊', cat: '動作', desc: '孔版印刷風打磚塊，四種道具輪流掉。', best: score('riso.best', '分') },
  { id: 'stardust',    title: '星塵防線',   cat: '動作', desc: '拖曳移動、自動開火，撐到母艦出現。', best: score('stardust.best', '分') },
  { id: 'plane',       title: '筆記本紙飛機', cat: '動作', desc: '點一下往上飄，從鉛筆之間的縫鑽過去。', best: score('plane.best', '枝') },
  { id: 'rooftop',     title: '屋頂貓',     cat: '動作', desc: '黑貓在公寓頂樓間跑酷，空中可以再跳一次。', best: score('roofcat.best', '分') }
];
const CATS = [
  { k: '益智', sub: '慢慢想' },
  { k: '反應', sub: '看準時機' },
  { k: '動作', sub: '手要快' }
];
const byId = Object.fromEntries(GAMES.map(g => [g.id, g]));

/* ---------- lobby ---------- */
const chipsEl = $('chips'), shelvesEl = $('shelves'), lobby = $('lobby');
let cat = store.get('lobby.cat', 'all');
if (cat !== 'all' && !CATS.some(c => c.k === cat)) cat = 'all';

function renderChips() {
  const items = [{ k: 'all', label: '全部', n: GAMES.length }, ...CATS.map(c => ({ k: c.k, label: c.k, n: GAMES.filter(g => g.cat === c.k).length }))];
  chipsEl.innerHTML = '';
  for (const it of items) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'chip'; b.dataset.cat = it.k;
    b.setAttribute('aria-pressed', String(cat === it.k));
    b.innerHTML = `${it.label}<b>${it.n}</b>`;
    b.addEventListener('click', () => { cat = it.k; store.set('lobby.cat', cat); applyFilter(); });
    chipsEl.appendChild(b);
  }
}
function renderShelves() {
  shelvesEl.innerHTML = '';
  for (const c of CATS) {
    const list = GAMES.filter(g => g.cat === c.k);
    const sec = document.createElement('section');
    sec.className = 'shelf'; sec.dataset.cat = c.k;
    sec.innerHTML = `<h2>${c.k}<span>${list.length} 款・${c.sub}</span></h2><div class="grid"></div>`;
    const grid = sec.querySelector('.grid');
    for (const g of list) {
      const a = document.createElement('a');
      a.className = 'card'; a.href = '#' + g.id; a.dataset.id = g.id;
      a.innerHTML = `<span class="thumb"><img src="${THUMBS[g.id]}" alt="${g.title}的遊戲畫面" width="300" height="400" loading="lazy" decoding="async"></span>
        <span class="name">${g.title}</span><span class="desc">${g.desc}</span>
        <span class="top"><span>第一名</span><b class="none">載入中…</b></span>
        <span class="best"><span>我的最高</span><b></b></span><span class="last" hidden>上次玩</span>`;
      a.addEventListener('click', e => { e.preventDefault(); go(g.id); });
      grid.appendChild(a);
    }
    shelvesEl.appendChild(sec);
  }
}
function applyFilter() {
  chipsEl.querySelectorAll('.chip').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.cat === cat)));
  shelvesEl.querySelectorAll('.shelf').forEach(s => { s.hidden = cat !== 'all' && s.dataset.cat !== cat; });
}
function refreshCards() {
  const last = store.get('lobby.last', null);
  shelvesEl.querySelectorAll('.card').forEach(a => {
    const g = byId[a.dataset.id], v = g.best(), b = a.querySelector('.best b');
    b.textContent = v || '還沒玩過';
    b.classList.toggle('none', !v);
    a.querySelector('.last').hidden = a.dataset.id !== last;
  });
}

/* ---------- player: each game runs in its own iframe ---------- */
const player = $('player'), screenEl = $('screen'), statusEl = $('status'), pTitle = $('p-title');
let frame = null, current = null, token = 0, loadTimer = 0;

function unmount() {
  token++; clearTimeout(loadTimer);
  if (frame) { frame.remove(); frame = null; }   // removing the iframe stops its loops, listeners and audio
  current = null;
}
function mount(g) {
  unmount();
  const my = token;
  current = g.id;
  pTitle.textContent = g.title;
  player.hidden = false; document.body.classList.add('playing'); lobby.inert = true;
  statusEl.textContent = '載入中…'; statusEl.hidden = false;
  store.set('lobby.last', g.id);

  const f = document.createElement('iframe');
  f.title = g.title;
  f.setAttribute('allow', 'autoplay; fullscreen');
  f.addEventListener('load', () => {
    if (my !== token) return;
    clearTimeout(loadTimer); statusEl.hidden = true;
    try { f.contentWindow.focus(); } catch (e) {}
  });
  f.srcdoc = GAME_SRC[g.id];     // every game ships inside this one file
  loadTimer = setTimeout(() => {
    if (my !== token) return;
    statusEl.textContent = '這款遊戲載入不了。按「重玩」再試一次，或回大廳換一款。';
  }, 10000);
  screenEl.appendChild(f); frame = f;
}
function close() {
  const was = current;
  unmount();
  player.hidden = true; document.body.classList.remove('playing'); lobby.inert = false;
  refreshCards();
  if (was) { const card = shelvesEl.querySelector(`.card[data-id="${was}"]`); if (card) try { card.focus({ preventScroll: true }); } catch (e) {} }
}

/* ---------- routing on #id so a game can be linked directly ---------- */
function route() {
  const id = decodeURIComponent(location.hash.slice(1));
  const g = byId[id];
  if (g) { if (current !== g.id) mount(g); }
  else if (!player.hidden) close();
}
function go(id) {
  const want = id ? '#' + id : '';
  if (location.hash !== want) { try { location.hash = id; } catch (e) {} }
  route();
}
function pickRandom() {
  const last = store.get('lobby.last', null);
  const pool = GAMES.filter(g => g.id !== current && g.id !== last && (cat === 'all' || g.cat === cat || current));
  const list = pool.length ? pool : GAMES;
  return list[Math.floor(Math.random() * list.length)].id;
}

$('back').addEventListener('click', () => go(''));
$('reload').addEventListener('click', () => { if (current) mount(byId[current]); });
$('shuffle').addEventListener('click', () => go(pickRandom()));
$('random').addEventListener('click', () => go(pickRandom()));
addEventListener('hashchange', route);
addEventListener('storage', e => { if (e.key && e.key.endsWith('.best')) refreshCards(); });

$('game-count').textContent = GAMES.length;
renderChips(); renderShelves(); applyFilter(); refreshCards(); route();
})();
</script>

const $ = id => document.getElementById(id);
const local = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};
const UNIT = { tower: '層', piano: '音', plane: '枝', 'mines-easy': '秒', 'mines-mid': '秒', 'mines-hard': '秒' };
const MINES = [['mines-easy', '初級'], ['mines-mid', '中級'], ['mines-hard', '高級']];
const isAsc = g => g.startsWith('mines-');
const better = (g, a, b) => (isAsc(g) ? a < b : a > b);
const boardOf = id => (id === 'mines' ? 'mines-easy' : id);     // 踩地雷的卡片顯示初級第一名
const fmt = (g, v) => `${Number(v).toLocaleString()} ${UNIT[g] || '分'}`;

/* ---------- 提示訊息 ---------- */
let toastT = 0;
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 2800);
}

/* ---------- 第一次上榜時取名字 ---------- */
const ADJ = ['勇敢的', '快手', '愛吃的', '夜市', '神準', '想睡的', '下課的', '認真的'];
const NOUN = ['金魚', '護理師', '竹圈', '紙飛機', '黑貓', '鋼琴手', '地鼠', '珍珠'];
const randomName = () => ADJ[Math.random() * ADJ.length | 0] + NOUN[Math.random() * NOUN.length | 0];
function askName() {
  return new Promise(resolve => {
    const back = $('name-dialog'), input = $('name-input'), err = $('name-err'), form = $('name-form');
    input.value = randomName(); err.textContent = ''; back.hidden = false;
    setTimeout(() => { input.focus(); input.select(); }, 30);
    const done = v => { back.hidden = true; form.onsubmit = null; $('name-skip').onclick = null; $('name-dice').onclick = null; resolve(v); };
    $('name-dice').onclick = () => { input.value = randomName(); input.focus(); };
    $('name-skip').onclick = () => done(null);
    form.onsubmit = e => {
      e.preventDefault();
      const r = cleanName(input.value);
      if (r.error) { err.textContent = r.error; return; }
      done(r.name);
    };
  });
}
let asking = null;
async function getName() {
  const saved = local.get('arcade.name');
  if (saved) return saved;
  if (!asking) asking = askName().then(v => { asking = null; if (v) local.set('arcade.name', v); return v; });
  return asking;
}

/* ---------- 卡片上的第一名（快取 3 分鐘，省 Firestore 讀取次數） ---------- */
const TTL = 3 * 60e3;
const readTops = () => { try { return JSON.parse(sessionStorage.getItem('arcade.tops')) || {}; } catch (e) { return {}; } };
const saveTops = t => { try { sessionStorage.setItem('arcade.tops', JSON.stringify(t)); } catch (e) {} };
function paintTop(id, entry, failed) {
  const row = document.querySelector(`.card[data-id="${id}"] .top`);
  if (!row) return;
  const b = row.querySelector('b'), g = boardOf(id);
  if (id === 'mines') row.firstElementChild.textContent = '初級第一';
  if (failed) { b.className = 'none'; b.textContent = '暫時連不上'; return; }
  if (!entry) { b.className = 'none'; b.textContent = '還沒人上榜'; return; }
  b.className = ''; b.textContent = entry.name;
  const em = document.createElement('em'); em.textContent = fmt(g, entry.score); b.append(em);
  b.title = `${entry.name} ${fmt(g, entry.score)}`;
}
async function loadTops() {
  const cache = readTops(), now = Date.now();
  const ids = [...document.querySelectorAll('.card[data-id]')].map(c => c.dataset.id);
  await Promise.all(ids.map(async id => {
    const g = boardOf(id), c = cache[g];
    if (c && now - c.at < TTL) { paintTop(id, c.top); return; }
    try { const [top] = await getBoard(g, 1); cache[g] = { top: top || null, at: now }; paintTop(id, top); }
    catch (e) { paintTop(id, null, true); }
  }));
  saveTops(cache);
}

/* ---------- 遊戲結束：收到分數就上傳 ---------- */
addEventListener('message', async e => {
  const frame = document.querySelector('#screen iframe');
  if (!frame || e.source !== frame.contentWindow) return;          // 只收目前這款遊戲傳的
  const d = e.data;
  if (!d || d.type !== 'arcade:score' || typeof d.game !== 'string' || !Number.isInteger(d.score)) return;
  if (!isAsc(d.game) && d.score <= 0) return;
  const name = await getName();
  if (!name) { toast('這次先不上傳，下次玩完會再問你'); return; }
  try {
    const r = await submitScore(d.game, name, d.score);
    if (!r.improved) { toast(`沒超過你的最佳 ${fmt(d.game, r.best)}`); return; }
    toast(`已上傳排行榜：${name} ${fmt(d.game, d.score)}`);
    const cache = readTops(), c = cache[d.game];
    if (c && (!c.top || better(d.game, d.score, c.top.score))) { c.top = { name, score: d.score }; saveTops(cache); }
    if (!$('rank-panel').hidden && rankGame === d.game) showBoard(d.game);
  } catch (err) {
    console.warn('排行榜上傳失敗', err);
    toast('排行榜暫時連不上，這次沒上傳成功');
  }
});

/* ---------- 遊戲右上角的前 20 名 ---------- */
let rankGame = null;
function currentGameId() {
  const id = decodeURIComponent(location.hash.slice(1));
  return id && document.querySelector(`.card[data-id="${CSS.escape(id)}"]`) ? id : null;
}
async function showBoard(g) {
  rankGame = g;
  const list = $('rank-list'), note = $('rank-note'), meEl = $('rank-me'), me = local.get('arcade.name');
  list.innerHTML = ''; note.hidden = false; note.textContent = '載入中…'; meEl.textContent = '';
  try {
    const rows = await getBoard(g, 20);
    if (rankGame !== g) return;
    note.hidden = rows.length > 0;
    if (!rows.length) note.textContent = '還沒有人上榜，玩一局搶第一名！';
    rows.forEach((r, i) => {
      const li = document.createElement('li');
      if (r.name === me) li.className = 'me';
      for (const [cls, text] of [['no', i + 1], ['nm', r.name], ['sc', fmt(g, r.score)]]) {
        const s = document.createElement('span'); s.className = cls; s.textContent = text; li.append(s);
      }
      list.append(li);
    });
    const mine = rows.findIndex(r => r.name === me);
    meEl.textContent = !me ? '玩完一局就能取名字上榜'
      : mine >= 0 ? `你是第 ${mine + 1} 名（${me}）` : `你的名字是「${me}」，還沒進前 20 名`;
    if (isMock) meEl.textContent += '・目前是本機測試資料';
  } catch (e) {
    if (rankGame !== g) return;
    note.hidden = false; note.textContent = '排行榜暫時連不上，稍後再試。';
  }
}
function openRank() {
  const id = currentGameId();
  if (!id) return;
  $('rank-title').textContent = `${document.querySelector(`.card[data-id="${id}"] .name`).textContent}・前 20 名`;
  const tabs = $('rank-tabs');
  if (id === 'mines') {
    let lv = 'easy'; try { lv = JSON.parse(local.get('mines.lv')) || 'easy'; } catch (e) {}
    const start = MINES.some(([g]) => g === 'mines-' + lv) ? 'mines-' + lv : 'mines-easy';
    tabs.innerHTML = '';
    for (const [g, label] of MINES) {
      const b = document.createElement('button');
      b.type = 'button'; b.textContent = label; b.setAttribute('aria-pressed', String(g === start));
      b.onclick = () => { tabs.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x === b))); showBoard(g); };
      tabs.append(b);
    }
    tabs.hidden = false; showBoard(start);
  } else { tabs.hidden = true; showBoard(id); }
  $('rank-panel').hidden = false; $('rank-btn').setAttribute('aria-expanded', 'true');
}
function closeRank() { $('rank-panel').hidden = true; $('rank-btn').setAttribute('aria-expanded', 'false'); rankGame = null; }
$('rank-btn').addEventListener('click', () => ($('rank-panel').hidden ? openRank() : closeRank()));
$('rank-close').addEventListener('click', closeRank);
addEventListener('keydown', e => { if (e.key === 'Escape' && !$('rank-panel').hidden) closeRank(); });
addEventListener('hashchange', () => { closeRank(); if (!currentGameId()) loadTops(); });

loadTops();
</script>

</html>
