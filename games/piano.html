<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0;font:14px/1.5 system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>月光鋼琴</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Noto+Serif+TC:wght@500;700;900&display=swap">
<style>
/* Layout: a night-blue concert hall framing one ivory keyboard lane; the score floats over the falling ebony tiles like a programme number */
:root{
  --hall:#0d1324;
  --hall-hi:#18213d;
  --ivory:#f6f1e6;
  --ebony:#141414;
  --brass:#d8b469;
  --wrong:#d64040;
  --text:#ece7da;
  --muted:#9aa2bd;
  --num:"Cormorant Garamond","Noto Serif TC",Georgia,serif;
  --serif:"Noto Serif TC","Songti TC",serif;
  color-scheme:dark;
}
html{height:100%;box-sizing:border-box;background:var(--hall)}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{
  height:100%;margin:0;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;gap:10px;
  padding-block:10px 14px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  background:radial-gradient(90% 60% at 50% 0%,var(--hall-hi),var(--hall) 70%);
  color:var(--text);font-family:var(--serif);
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;
}
.hud{width:100%;max-width:460px;display:flex;align-items:center;gap:12px}
.brand{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.2}
.brand b{font-weight:900;font-size:1.05rem;letter-spacing:.16em}
.brand span{font-size:.72rem;color:var(--brass);letter-spacing:.1em}
.best{display:flex;flex-direction:column;align-items:flex-end;line-height:1.1}
.best span{font-size:.64rem;color:var(--muted);letter-spacing:.14em}
.best b{font-family:var(--num);font-weight:700;font-size:1.3rem;font-variant-numeric:lining-nums tabular-nums}
.icon-btn{width:34px;height:34px;border-radius:8px;border:1px solid #2c3658;background:transparent;color:var(--text);cursor:pointer;font-size:.9rem;display:grid;place-items:center;padding:0}
.icon-btn.off{color:var(--muted);text-decoration:line-through}
.stage{position:relative;flex:1;min-height:0;width:100%;max-width:460px;border-radius:6px;overflow:hidden;touch-action:none;background:var(--ivory);box-shadow:0 0 0 6px #1d1a16,0 0 0 7px var(--brass),0 24px 60px rgba(0,0,0,.6)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.overlay{position:absolute;left:14px;right:14px;top:16px;z-index:5;padding:18px;border-radius:8px;background:rgba(13,19,36,.94);border:1px solid var(--brass);display:flex;flex-direction:column;gap:10px;color:var(--text);max-height:calc(75% - 28px);overflow-y:auto;overscroll-behavior:contain}
.menu,.editor{display:flex;flex-direction:column;gap:10px}
.overlay h1{margin:0;font-weight:900;font-size:1.35rem;letter-spacing:.12em}
.overlay p{margin:0;font-size:.9rem;line-height:1.75;color:#cfd3e2;max-width:40ch}
.pieces{display:flex;gap:6px;flex-wrap:wrap}
.pieces{row-gap:7px}
.pieces button{appearance:none;border:1px solid #3a4468;border-radius:999px;background:transparent;color:var(--text);font:700 .8rem var(--serif);padding:5px 11px;cursor:pointer}
.pieces .grp{flex-basis:100%;font-size:.7rem;color:var(--muted);letter-spacing:.2em;margin-top:2px}
.pieces .grp:first-child{margin-top:0}
.pieces button[aria-pressed="true"]{background:var(--brass);border-color:var(--brass);color:#22190a}
.pieces .add{border-style:dashed;border-color:var(--brass);color:var(--brass)}
.editor label{font-size:.78rem;color:var(--muted);letter-spacing:.1em}
.editor input,.editor textarea{width:100%;border:1px solid #3a4468;border-radius:6px;background:#0a0f1d;color:var(--text);font:500 1rem var(--serif);padding:8px 10px;-webkit-user-select:text;user-select:text}
.editor textarea{font-family:ui-monospace,Menlo,Consolas,monospace;line-height:1.6;min-height:88px;resize:vertical}
.editor input:focus,.editor textarea:focus{outline:2px solid var(--brass);outline-offset:1px}
.overlay .hint{font-size:.78rem;line-height:1.75;color:var(--muted)}
.overlay .hint code{font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--text);background:rgba(255,255,255,.08);padding:0 4px;border-radius:3px}
.overlay .msg{font-size:.84rem;color:var(--brass)}
.overlay .msg.err{color:#ff8a80}
.ghost{appearance:none;border:1px solid #3a4468;border-radius:6px;background:transparent;color:var(--text);font:700 .9rem var(--serif);padding:9px 14px;cursor:pointer}
.ghost.small{padding:5px 10px;font-size:.78rem;color:var(--muted)}
.ghost.armed{border-color:var(--wrong);color:#ff8a80}
.row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.btn{appearance:none;border:0;border-radius:6px;background:var(--ivory);color:var(--ebony);font:900 1rem var(--serif);padding:10px 22px;cursor:pointer;letter-spacing:.14em}
.keys{font-size:.78rem;color:var(--muted)}
.rec{color:var(--brass);font-weight:900}
button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
</style>

<header class="hud">
  <div class="brand"><b>月光鋼琴</b><span id="piece">曲目：小星星</span></div>
  <div class="best"><span>最高</span><b id="best">0</b></div>
  <button class="icon-btn" id="mute" aria-label="音效" aria-pressed="true">♪</button>
</header>
<main class="stage" id="stage">
  <canvas id="cv"></canvas>
  <section class="overlay" id="overlay">
    <h1 id="ov-title">月光鋼琴</h1>
    <div class="menu" id="menu">
      <p id="ov-text">只踩黑鍵，由下往上依序點，每點一下就彈出下一個音。點到白鍵或漏掉黑鍵就結束，越彈越快。</p>
      <div class="row"><button class="btn" id="ov-btn">點最下面的「開始」</button><span class="keys">電腦可用 D F J K 對應四條鍵</span></div>
      <div class="pieces" id="pieces" role="group" aria-label="曲目"></div>
      <button class="ghost small" id="song-del" type="button" hidden></button>
    </div>
    <form class="editor" id="editor" hidden>
      <label for="song-name">曲名</label>
      <input id="song-name" maxlength="12" placeholder="例如：我的第一首" autocomplete="off">
      <label for="song-score">簡譜</label>
      <textarea id="song-score" rows="4" placeholder="1 1 5 5 | 6 6 5 - | 4 4 3 3 | 2 2 1 -" spellcheck="false" autocomplete="off"></textarea>
      <p class="hint">用 1 到 7 寫音符，1 是中央 Do。高八度在後面加 <code>'</code>，例如 <code>1'</code>；低八度加 <code>,</code>，例如 <code>5,</code>。升半音寫 <code>#4</code>，降半音寫 <code>b7</code>。空格、<code>|</code>、<code>-</code> 和 <code>0</code> 都會略過，只看音的順序。</p>
      <p class="msg" id="song-msg" aria-live="polite">還沒有音符</p>
      <div class="row"><button type="submit" class="btn">存起來</button><button type="button" class="ghost" id="song-try">試聽</button><button type="button" class="ghost" id="song-cancel">取消</button></div>
    </form>
  </section>
</main>

<script>
(() => {
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const $ = id => document.getElementById(id);
const stage = $('stage'), cv = $('cv'), ctx = cv.getContext('2d');
const bestEl = $('best'), pieceEl = $('piece'), muteBtn = $('mute');
const ov = $('overlay'), ovTitle = $('ov-title'), ovText = $('ov-text'), ovBtn = $('ov-btn'), piecesEl = $('pieces');

/* ---------- songs, written in numbered notation (簡譜) ----------
   1–7 = Do Re Mi Fa Sol La Si, with 1 = middle C (MIDI 60)
   ' after a note = one octave up (1' = high Do), , after a note = one octave down (5, = low Sol)
   # before = sharp, b before = flat; spaces, | , - and 0 are ignored — only the order of notes matters
   To add a song, append { name, score } here. key moves the whole song, e.g. key: 'G' makes 1 = G. */
// group decides where a song sits in the picker; new songs go at the end so saved picks keep pointing at the same song
const SONGS = [
  { name: '小星星', group: '童謠', score: '1 1 5 5 | 6 6 5 - | 4 4 3 3 | 2 2 1 - | 5 5 4 4 | 3 3 2 - | 5 5 4 4 | 3 3 2 - | 1 1 5 5 | 6 6 5 - | 4 4 3 3 | 2 2 1 -' },
  { name: '歡樂頌', group: '名曲', score: '3 3 4 5 | 5 4 3 2 | 1 1 2 3 | 3 2 2 - | 3 3 4 5 | 5 4 3 2 | 1 1 2 3 | 2 1 1 - | 2 2 3 1 | 2 3 4 3 1 | 2 3 4 3 2 | 1 2 5, - | 3 3 4 5 | 5 4 3 2 | 1 1 2 3 | 2 1 1 -' },
  { name: '給愛麗絲', group: '名曲', score: "3' #2' 3' #2' 3' 7 2' 1' | 6 - 1 3 6 | 7 - 3 #5 7 | 1' - 3 3' #2' | 3' #2' 3' 7 2' 1' | 6 - 1 3 6 | 7 - 3 1' 7 | 6 -" },
  { name: '小蜜蜂', group: '童謠', score: '5 3 3 - | 4 2 2 - | 1 2 3 4 | 5 5 5 - | 5 3 3 - | 4 2 2 - | 1 3 5 5 | 3 - - - | 2 2 2 2 | 2 3 4 - | 3 3 3 3 | 3 4 5 - | 5 3 3 - | 4 2 2 - | 1 3 5 5 | 1 - - -' },
  { name: '兩隻老虎', group: '童謠', score: '1 2 3 1 | 1 2 3 1 | 3 4 5 - | 3 4 5 - | 5 6 5 4 3 1 | 5 6 5 4 3 1 | 1 5, 1 - | 1 5, 1 -' },
  { name: '生日快樂', group: '節日', score: "5 5 6 5 | 1' 7 - | 5 5 6 5 | 2' 1' - | 5 5 5' 3' | 1' 7 6 - | 4' 4' 3' 1' | 2' 1' -" },
  { name: '瑪莉有隻小綿羊', group: '童謠', score: '3 2 1 2 | 3 3 3 - | 2 2 2 - | 3 5 5 - | 3 2 1 2 | 3 3 3 3 | 2 2 3 2 | 1 - - -' },
  { name: '倫敦鐵橋', group: '童謠', score: '5 6 5 4 | 3 4 5 - | 2 3 4 - | 3 4 5 - | 5 6 5 4 | 3 4 5 - | 2 - 5 - | 3 1 - -' },
  { name: '聖誕鈴聲', group: '節日', score: '3 3 3 - | 3 3 3 - | 3 5 1 2 | 3 - - - | 4 4 4 4 | 4 3 3 3 3 | 3 2 2 3 | 2 - 5 - | 3 3 3 - | 3 3 3 - | 3 5 1 2 | 3 - - - | 4 4 4 4 | 4 3 3 3 3 | 5 5 4 2 | 1 - - -' },
  { name: '念故鄉', group: '名曲', score: '3 5 5 - | 3 2 1 - | 2 3 5 3 | 2 - - - | 3 5 5 - | 3 2 1 - | 2 3 2 1 | 1 - - -' },
  { name: '新年好', group: '節日', score: '1 1 1 5, | 3 3 3 1 | 1 3 5 5 | 4 3 2 - | 2 3 4 4 | 3 2 3 1 | 1 3 2 5, | 7, 2 1 -' },
  { name: '平安夜', group: '節日', score: "5 6 5 3 - | 5 6 5 3 - | 2' 2' 7 - | 1' 1' 5 - | 6 6 1' 7 6 | 5 6 5 3 - | 6 6 1' 7 6 | 5 6 5 3 - | 2' 2' 4' 2' 7 | 1' 3' - | 1' 5 3 5 4 2 | 1 - -" },
  { name: '王老先生有塊地', group: '童謠', score: '1 1 1 5, | 6, 6, 5, - | 3 3 2 2 | 1 - - 5, | 1 1 1 5, | 6, 6, 5, - | 3 3 2 2 | 1 - - -' },
  { name: '聖者進行曲', group: '童謠', score: '1 3 4 5 - | 1 3 4 5 - | 1 3 4 5 3 1 3 2 - | 3 3 2 1 1 3 5 5 4 - | 3 4 5 3 1 2 1 -' },
  { name: '噢！蘇珊娜', group: '童謠', score: '1 2 | 3 5 5 6 5 3 1 2 | 3 3 2 1 2 - | 1 2 3 5 5 6 5 3 1 2 | 3 3 2 2 1 - | 4 4 6 6 6 5 5 3 1 2 - | 1 2 3 5 5 6 5 3 1 2 | 3 3 2 2 1 -' },
  { name: '送別', group: '名曲', score: "5 3 5 1' - | 6 1' 5 - | 5 1 2 3 2 1 | 2 - - - | 5 3 5 1' 7 | 6 1' 5 - | 5 2 3 4 7, | 1 - - - | 6 1' 1' - | 7 6 7 1' - | 6 7 1' 6 6 5 3 1 | 2 - - - | 5 3 5 1' 7 | 6 1' 5 - | 5 2 3 4 7, | 1 - - -" },
  { name: '布拉姆斯搖籃曲', group: '名曲', score: "3 3 5 - | 3 3 5 - | 3 5 1' 7 6 6 5 | 2 3 4 2 2 3 4 - | 2 4 7 6 5 7 1' - | 1 1 1' 6 4 5 | 3 1 4 5 6 5 | 1 1 1' 6 4 5 | 3 1 4 3 2 1 -" },
  { name: '綠袖子', group: '名曲', score: "6 1' 2' 3' 4' 3' 2' 7 5 6 7 1' 6 6 #5 6 7 #5 3 | 6 1' 2' 3' 4' 3' 2' 7 5 6 7 1' 7 6 #5 #4 #5 6 6 | 5' 5' #4' 3' 2' 7 5 6 7 1' 6 6 #5 6 7 #5 3 | 5' 5' #4' 3' 2' 7 5 6 7 1' 7 6 #5 #4 #5 6 6" },
  { name: '卡農', group: '名曲', score: "3' 2' 1' 7 | 6 5 6 7 | 1' 7 6 5 | 4 3 4 2" },
  { name: '土耳其進行曲', group: '名曲', score: "7 6 #5 6 1' - | 2' 1' 7 1' 3' - | 4' 3' #2' 3' 7' 6' #5' 6' 7' 6' #5' 6' 1'' -" }
];
const GROUPS = ['童謠', '節日', '名曲'];
const KEY_OFFSET = { C: 0, 'C#': 1, Db: 1, D: 2, Eb: 3, E: 4, F: 5, 'F#': 6, Gb: 6, G: 7, Ab: 8, A: 9, Bb: 10, B: 11 };
const STEP = [0, 0, 2, 4, 5, 7, 9, 11];
function parseScore(text, key = 'C') {
  const base = 60 + (KEY_OFFSET[key] || 0), out = [];
  // the curly quotes are what a phone keyboard types for '
  const re = /([#♯b♭]?)([0-7])([',’‘′]*)/g;
  let m;
  while ((m = re.exec(String(text)))) {
    const d = +m[2];
    if (!d) continue;
    let n = base + STEP[d];
    if (m[1] === '#' || m[1] === '♯') n++; else if (m[1]) n--;
    for (const c of m[3]) n += c === ',' ? -12 : 12;
    out.push(Math.max(36, Math.min(96, n)));
  }
  return out;
}
SONGS.forEach(s => { s.notes = parseScore(s.score, s.key); });

// songs a player typed in themselves live only in this browser
let custom = store.get('piano.custom', []);
if (!Array.isArray(custom)) custom = [];
custom = custom.filter(s => s && typeof s.name === 'string' && typeof s.score === 'string').slice(0, 30);
custom.forEach(s => { s.notes = parseScore(s.score); });
const songOf = sel => typeof sel === 'string' ? custom[+sel.slice(1)] : SONGS[sel];
let melody = store.get('piano.piece', 0);
if (!songOf(melody) || !songOf(melody).notes.length) melody = 0;
let noteIdx = 0;

let actx = null, muted = !!store.get('piano.muted', false);
function audio() {
  actx = actx || new (window.AudioContext || window.webkitAudioContext)();
  if (actx.state === 'suspended') actx.resume();
  return actx;
}
// a soft struck-string voice: fundamental plus a quiet octave, fast attack, long decay
function note(midi, vel = 1) {
  if (muted) return;
  try {
    const a = audio(), t = a.currentTime, f = 440 * Math.pow(2, (midi - 69) / 12);
    const g = a.createGain(); g.connect(a.destination);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.16 * vel, t + .008); g.gain.exponentialRampToValueAtTime(.0001, t + 1.4);
    [[f, 'triangle', 1], [f * 2, 'sine', .35], [f * 3, 'sine', .08]].forEach(([fr, type, amp]) => {
      const o = a.createOscillator(), og = a.createGain();
      o.type = type; o.frequency.value = fr; og.gain.value = amp;
      o.connect(og); og.connect(g); o.start(t); o.stop(t + 1.5);
    });
  } catch (e) {}
}
function clash() { if (muted) return; [48, 49, 54, 55].forEach(m => note(m, .9)); }
function setMute(m) { muted = m; muteBtn.setAttribute('aria-pressed', String(!m)); muteBtn.classList.toggle('off', m); store.set('piano.muted', m); }
setMute(muted);
muteBtn.addEventListener('click', () => { setMute(!muted); muteBtn.blur(); if (!muted) note(72); });

const W = 400, LANES = 4, LW = W / LANES;
let H = 600, S = 1, DPR = 1, rowH = 150;
function fit() {
  const r = stage.getBoundingClientRect();
  if (!r.width || !r.height) return;
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(r.width * DPR); cv.height = Math.round(r.height * DPR);
  const oldRow = rowH;
  S = r.width / W; H = r.height / S; rowH = H / 4;
  if (oldRow && rows.length) { const k = rowH / oldRow; rows.forEach(rw => { rw.y *= k; }); }
}
let rows = [], state = 'ready', speed = 0, hits = 0, failT = 0, fail = null, overAt = 0, flash = [];
let best = store.get('piano.best', 0);
bestEl.textContent = best;
fit();
if ('ResizeObserver' in window) new ResizeObserver(fit).observe(stage); else addEventListener('resize', fit);

function pickLane(prev) { let l; do { l = Math.floor(Math.random() * LANES); } while (l === prev && Math.random() < .6); return l; }
function reset() {
  rows = []; speed = 0; hits = 0; noteIdx = 0; fail = null; flash = [];
  let lane = -1;
  for (let i = 0; i < 6; i++) { lane = pickLane(lane); rows.push({ y: H - rowH * (i + 1), lane, hit: false, start: i === 0 }); }
}
/* ---------- song picker ---------- */
const menu = $('menu'), editor = $('editor'), delBtn = $('song-del');
const nameIn = $('song-name'), scoreIn = $('song-score'), msgEl = $('song-msg');
const selKey = sel => String(sel);
function renderPieces() {
  piecesEl.innerHTML = '';
  const add = (label, sel, cls) => {
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = label; b.dataset.sel = selKey(sel);
    if (cls) b.className = cls;
    if (sel !== null) b.setAttribute('aria-pressed', String(selKey(sel) === selKey(melody)));
    piecesEl.appendChild(b);
  };
  const label = t => { const s = document.createElement('span'); s.className = 'grp'; s.textContent = t; piecesEl.appendChild(s); };
  for (const g of GROUPS) {
    label(g);
    SONGS.forEach((s, i) => { if (s.group === g) add(s.name, i); });
  }
  label('自訂');
  custom.forEach((s, i) => add(s.name, 'c' + i, 'mine'));
  add('＋ 自己加一首', null, 'add');
}
function setPiece(sel) {
  melody = sel; store.set('piano.piece', sel);
  pieceEl.textContent = '曲目：' + songOf(sel).name;
  piecesEl.querySelectorAll('button[data-sel]').forEach(b => { if (b.hasAttribute('aria-pressed')) b.setAttribute('aria-pressed', String(b.dataset.sel === selKey(sel))); });
  disarmDelete();
  delBtn.hidden = typeof sel !== 'string';
  if (!delBtn.hidden) delBtn.textContent = `刪除《${songOf(sel).name}》`;
}
piecesEl.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.classList.contains('add')) { openEditor(); return; }
  const sel = b.dataset.sel.startsWith('c') ? b.dataset.sel : +b.dataset.sel;
  setPiece(sel); note(songOf(sel).notes[0]);
});

// deleting a song takes two taps, since the viewer cannot show a confirm dialog
let armT = 0;
function disarmDelete() { clearTimeout(armT); delBtn.classList.remove('armed'); delete delBtn.dataset.armed; if (typeof melody === 'string' && songOf(melody)) delBtn.textContent = `刪除《${songOf(melody).name}》`; }
delBtn.addEventListener('click', () => {
  if (typeof melody !== 'string') return;
  if (!delBtn.dataset.armed) {
    delBtn.dataset.armed = '1'; delBtn.classList.add('armed'); delBtn.textContent = '再按一次就刪除';
    armT = setTimeout(disarmDelete, 3000);
    return;
  }
  custom.splice(+melody.slice(1), 1);
  store.set('piano.custom', custom.map(({ name, score }) => ({ name, score })));
  melody = 0; renderPieces(); setPiece(0);
});

/* ---------- add-a-song form ---------- */
let prevTitle = '', tryTimers = [];
function stopTry() { tryTimers.forEach(clearTimeout); tryTimers = []; }
function showCount() {
  const n = parseScore(scoreIn.value).length;
  msgEl.classList.remove('err');
  msgEl.textContent = n ? `讀到 ${n} 個音` : '還沒有音符';
}
function openEditor() {
  prevTitle = ovTitle.textContent; ovTitle.textContent = '自己加一首';
  menu.hidden = true; editor.hidden = false;
  nameIn.value = ''; scoreIn.value = ''; showCount();
  try { nameIn.focus({ preventScroll: true }); } catch (e) {}
}
function closeEditor() {
  if (editor.hidden) return;
  stopTry(); editor.hidden = true; menu.hidden = false;
  ovTitle.textContent = prevTitle || '月光鋼琴';
}
scoreIn.addEventListener('input', showCount);
$('song-try').addEventListener('click', () => {
  stopTry();
  const notes = parseScore(scoreIn.value).slice(0, 16);
  if (!notes.length) { msgEl.classList.add('err'); msgEl.textContent = '還沒有音符可以試聽，先寫幾個 1 到 7 的數字。'; return; }
  notes.forEach((n, i) => tryTimers.push(setTimeout(() => note(n), i * 280)));
});
$('song-cancel').addEventListener('click', closeEditor);
editor.addEventListener('submit', e => {
  e.preventDefault();
  const notes = parseScore(scoreIn.value);
  if (notes.length < 4) {
    msgEl.classList.add('err');
    msgEl.textContent = `至少要 4 個音才能彈，現在讀到 ${notes.length} 個。`;
    return;
  }
  if (custom.length >= 30) {
    msgEl.classList.add('err');
    msgEl.textContent = '最多存 30 首，先刪掉幾首自訂的再加。';
    return;
  }
  const name = nameIn.value.trim().slice(0, 12) || `我的曲子 ${custom.length + 1}`;
  custom.push({ name, score: scoreIn.value, notes });
  store.set('piano.custom', custom.map(({ name, score }) => ({ name, score })));
  closeEditor();
  if (state === 'ready') ovTitle.textContent = '月光鋼琴';
  renderPieces(); setPiece('c' + (custom.length - 1));
  note(notes[0]);
});
renderPieces(); setPiece(melody);

const target = () => rows.find(r => !r.hit);
function playNext() {
  const m = songOf(melody).notes;
  note(m[noteIdx % m.length]);
  noteIdx++;
}
function hit(r) {
  r.hit = true; r.hitT = 0; hits++;
  playNext();
  if (state === 'ready') { closeEditor(); state = 'play'; ov.hidden = true; speed = 1.7; }
}
function lose(lane, r, missed) {
  state = 'fail'; failT = 1; fail = { lane, r, missed };
  if (missed) { const shift = r.y - (H - rowH); rows.forEach(x => { x.y -= shift; }); }
  clash();
}
function gameOver() {
  state = 'over'; overAt = performance.now();
  const rec = hits > best;
  try { parent.postMessage({ type: 'arcade:score', game: 'piano', score: hits }, '*'); } catch (e) {}   // 交給大廳上傳排行榜
  if (rec) { best = hits; store.set('piano.best', best); bestEl.textContent = best; }
  ovTitle.textContent = fail && fail.missed ? '漏了一個鍵' : '踩到白鍵了';
  ovText.innerHTML = (rec ? '<span class="rec">新紀錄！</span>' : '') + `《${songOf(melody).name}》彈了 ${hits} 個音，最高 ${best} 個。換首曲子或直接再彈一次。`;
  ovBtn.textContent = '再彈一次';
  ov.hidden = false;
}
function restart() { reset(); state = 'ready'; ovTitle.textContent = '月光鋼琴'; ovBtn.textContent = '點最下面的「開始」'; ov.hidden = true; }

function press(lane, y) {
  if (state === 'over' || state === 'fail') return;
  const t = target(); if (!t) return;
  // taps outside the next row to play are ignored, so a quick double-tap on a played key never ends the piece
  if (y !== null && !(y >= t.y && y < t.y + rowH)) return;
  if (lane === t.lane) hit(t);
  else if (state === 'play') lose(lane, t, false);
}
stage.addEventListener('pointerdown', e => {
  if (e.target.closest('.overlay')) return;
  e.preventDefault();
  if (state === 'over') { if (performance.now() - overAt > 600) restart(); return; }
  const r = stage.getBoundingClientRect();
  const x = (e.clientX - r.left) / S, y = (e.clientY - r.top) / S;
  press(Math.max(0, Math.min(LANES - 1, Math.floor(x / LW))), y);
});
ovBtn.addEventListener('click', () => { if (state === 'over') restart(); else ov.hidden = true; ovBtn.blur(); });
const KEYMAP = { KeyD: 0, KeyF: 1, KeyJ: 2, KeyK: 3 };
addEventListener('keydown', e => {
  if (!editor.hidden || (e.target.closest && e.target.closest('input, textarea'))) return;
  if (e.code in KEYMAP && !e.repeat) {
    e.preventDefault();
    if (state === 'over') { if (performance.now() - overAt > 600) restart(); return; }
    if (state === 'ready') ov.hidden = true;
    press(KEYMAP[e.code], null);
  }
  if ((e.code === 'Space' || e.code === 'Enter') && state === 'over' && performance.now() - overAt > 600) { e.preventDefault(); restart(); }
});

function update(dt) {
  if (state === 'play') {
    speed = Math.min(6.2, 1.7 + hits * .03);
    const dy = speed * rowH * dt;
    rows.forEach(r => { r.y += dy; });
    const t = target();
    if (t && t.y >= H) { lose(t.lane, t, true); }
    rows = rows.filter(r => !(r.hit && r.y > H));
    let top = rows[rows.length - 1];
    while (top.y > -rowH * 1.5) { const n = { y: top.y - rowH, lane: pickLane(top.lane), hit: false }; rows.push(n); top = n; }
  } else if (state === 'fail') {
    failT -= dt; if (failT <= 0) gameOver();
  }
  rows.forEach(r => { if (r.hit) r.hitT = Math.min(1, (r.hitT || 0) + dt * 5); });
  flash.forEach(f => { f.t -= dt; }); flash = flash.filter(f => f.t > 0);
}
function draw(t) {
  ctx.setTransform(DPR * S, 0, 0, DPR * S, 0, 0);
  ctx.fillStyle = '#f6f1e6'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(0,0,0,.08)';
  for (let i = 1; i < LANES; i++) ctx.fillRect(i * LW - .5, 0, 1, H);
  for (const r of rows) {
    if (r.y > H || r.y + rowH < 0) continue;
    ctx.fillStyle = 'rgba(0,0,0,.05)'; ctx.fillRect(0, r.y + rowH - .5, W, 1);
    const x = r.lane * LW + 1, y = r.y + 1, w = LW - 2, h = rowH - 2;
    if (r.hit) {
      ctx.fillStyle = `rgba(20,20,20,${.16 * (1 - r.hitT * .5)})`; ctx.fillRect(x, y, w, h);
    } else {
      const g = ctx.createLinearGradient(0, y, 0, y + h);
      g.addColorStop(0, '#2a2a2a'); g.addColorStop(.12, '#141414'); g.addColorStop(1, '#0b0b0b');
      ctx.fillStyle = g; ctx.fillRect(x, y, w, h);
      ctx.fillStyle = 'rgba(255,255,255,.07)'; ctx.fillRect(x + 6, y + 6, 3, h - 12);
      if (r.start) {
        ctx.fillStyle = '#d8b469'; ctx.font = '900 20px "Noto Serif TC", serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('開始', x + w / 2, y + h / 2);
      }
    }
  }
  if (fail && (state === 'fail' || state === 'over')) {
    const on = state === 'over' || Math.floor(failT * 8) % 2 === 0;
    if (on) {
      const fy = fail.r ? fail.r.y : null;
      ctx.fillStyle = 'rgba(214,64,64,.85)';
      if (fy !== null) ctx.fillRect(fail.lane * LW + 1, fy + 1, LW - 2, rowH - 2);
    }
  }
  for (const f of flash) { ctx.fillStyle = `rgba(214,64,64,${.85 * Math.min(1, f.t * 2)})`; ctx.fillRect(f.lane * LW + 1, f.y + 1, LW - 2, rowH - 2); }
  if (state !== 'ready') {
    ctx.font = '700 64px "Cormorant Garamond", Georgia, serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(246,241,230,.85)'; ctx.strokeText(hits, W / 2, 18);
    ctx.fillStyle = '#c23a3a'; ctx.fillText(hits, W / 2, 18);
  }
}

let lastT = performance.now();
function frame(now) {
  const dt = Math.min(Math.max((now - lastT) / 1000, 0), 1 / 30); lastT = now;
  update(dt); draw(now / 1000);
  requestAnimationFrame(frame);
}
reset();
requestAnimationFrame(frame);
})();
</script>
