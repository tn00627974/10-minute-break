<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0;font:14px/1.5 system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>屋頂貓</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Noto+Sans+TC:wght@500;700;900&display=swap">
<style>
/* Layout: a wide night panorama in a portrait frame — moonlit sky, layered apartment blocks, and the running rooftops of old walk-ups with their steel water tanks */
:root{
  --night:#0b1030;
  --night-2:#151b45;
  --moon:#fff3cf;
  --window:#ffcf6b;
  --concrete:#4c5266;
  --text:#eef0ff;
  --muted:#9aa1cc;
  --accent:#ffcf6b;
  --display:"Dela Gothic One","Noto Sans TC",system-ui,sans-serif;
  --body:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  color-scheme:dark;
}
html{height:100%;box-sizing:border-box;background:var(--night)}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{
  height:100%;margin:0;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;gap:10px;
  padding-block:10px 14px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  background:var(--night);color:var(--text);font-family:var(--body);
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;
}
.hud{width:100%;max-width:520px;display:flex;align-items:center;gap:12px}
.brand{flex:1;min-width:0;font-weight:900;font-size:1.05rem;letter-spacing:.12em;white-space:nowrap}
.stat{display:flex;flex-direction:column;align-items:flex-end;line-height:1.15}
.stat span{font-size:.64rem;color:var(--muted);letter-spacing:.12em}
.stat b{font-family:var(--display);font-weight:400;font-size:1.05rem;font-variant-numeric:tabular-nums}
.stat b small{font-family:var(--body);font-size:.7rem;color:var(--muted);margin-left:2px}
.icon-btn{width:34px;height:34px;border-radius:8px;border:1px solid #2b3366;background:transparent;color:var(--text);cursor:pointer;font-size:.9rem;display:grid;place-items:center;padding:0}
.icon-btn.off{color:var(--muted);text-decoration:line-through}
.stage{position:relative;flex:1;min-height:0;width:100%;max-width:520px;border-radius:12px;overflow:hidden;touch-action:none;cursor:pointer;background:var(--night-2);box-shadow:0 0 0 1px #262d60}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.overlay{position:absolute;left:16px;right:16px;top:16px;z-index:5;padding:18px;border-radius:12px;background:rgba(9,12,36,.88);border:1px solid #2e3772;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;flex-direction:column;gap:10px}
.overlay h1{margin:0;font-weight:900;font-size:1.4rem;letter-spacing:.08em}
.overlay p{margin:0;font-size:.9rem;line-height:1.75;color:#d1d5f0;max-width:40ch}
.row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.btn{appearance:none;border:0;border-radius:8px;background:var(--accent);color:#2b1d00;font:900 1rem var(--body);padding:10px 22px;cursor:pointer;letter-spacing:.08em}
.keys{font-size:.78rem;color:var(--muted)}
.rec{color:var(--accent);font-weight:900}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>

<header class="hud">
  <div class="brand">屋頂貓</div>
  <div class="stat"><span>距離</span><b id="dist">0<small>m</small></b></div>
  <div class="stat"><span>小魚乾</span><b id="fish">0</b></div>
  <div class="stat"><span>最高</span><b id="best">0</b></div>
  <button class="icon-btn" id="mute" aria-label="音效" aria-pressed="true">♪</button>
</header>
<main class="stage" id="stage">
  <canvas id="cv"></canvas>
  <section class="overlay" id="overlay">
    <h1 id="ov-title">屋頂貓</h1>
    <p id="ov-text">半夜的黑貓在公寓頂樓之間奔跑。點一下跳，按久一點跳更高，空中還能再跳一次。跳過樓與樓的縫、水塔、冷氣和露出來的鋼筋，順路叼走小魚乾。</p>
    <div class="row"><button class="btn" id="ov-btn">出門</button><span class="keys" id="ov-keys">點畫面・空白鍵</span></div>
  </section>
</main>

<script>
(() => {
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const $ = id => document.getElementById(id);
const stage = $('stage'), cv = $('cv'), ctx = cv.getContext('2d');
const distEl = $('dist'), fishEl = $('fish'), bestEl = $('best'), muteBtn = $('mute');
const ov = $('overlay'), ovTitle = $('ov-title'), ovText = $('ov-text'), ovBtn = $('ov-btn');

let actx = null, muted = !!store.get('roofcat.muted', false);
function tone(f, d = .08, type = 'triangle', v = .045, slide = 0) {
  if (muted) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f * slide), t + d);
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + d + .02);
  } catch (e) {}
}
function setMute(m) { muted = m; muteBtn.setAttribute('aria-pressed', String(!m)); muteBtn.classList.toggle('off', m); store.set('roofcat.muted', m); }
setMute(muted);
muteBtn.addEventListener('click', () => { setMute(!muted); muteBtn.blur(); if (!muted) tone(660); });

const W = 400, GRAV = 1900, HOLD_G = 850, JUMP = -600;
let H = 640, S = 1, DPR = 1;
function fit() {
  const r = stage.getBoundingClientRect();
  if (!r.width || !r.height) return;
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(r.width * DPR); cv.height = Math.round(r.height * DPR);
  S = r.width / W; H = r.height / S;
}
fit();
if ('ResizeObserver' in window) new ResizeObserver(fit).observe(stage); else addEventListener('resize', fit);

const rand = (a, b) => a + Math.random() * (b - a);
const cat = { x: 92, y: 0, vy: 0, w: 32, h: 22, ground: false, jumps: 0, holdT: 0, coyote: 0, run: 0 };
const stars = Array.from({ length: 70 }, () => ({ x: Math.random() * W, y: Math.random() * .55, s: Math.random() * 1.3 + .3, p: Math.random() * 6 }));
function makeLayer(n, minH, maxH, wMin, wMax) {
  const out = []; let x = 0;
  while (x < 900) { const w = rand(wMin, wMax), h = rand(minH, maxH); const wins = []; for (let wy = 8; wy < h - 8; wy += 12) for (let wx = 5; wx < w - 6; wx += 9) if (Math.random() < .22) wins.push([wx, wy]); out.push({ x, w, h, wins, spire: Math.random() < .08 }); x += w + rand(0, 6); }
  return { list: out, span: x };
}
const far = makeLayer(0, 60, 170, 24, 50), mid = makeLayer(0, 50, 120, 40, 80);

let roofs = [], obs = [], fish = [], parts = [];
let state = 'ready', speed = 250, dist = 0, fishN = 0, scroll = 0, deadT = 0, overAt = 0, holding = false, why = '';
let best = store.get('roofcat.best', 0);
bestEl.textContent = best;
const scoreNow = () => Math.floor(dist / 10) + fishN * 10;

function addRoof() {
  const last = roofs[roofs.length - 1];
  const gap = rand(50, 46 + speed * .2);
  const w = rand(170, 420);
  const y = Math.max(H * .5, Math.min(H * .82, last.y + rand(-70, 70)));
  const r = { x: last.x + last.w + gap, w, y, kind: Math.random() < .3 ? 'tin' : 'concrete', shed: Math.random() < .25 };
  roofs.push(r);
  if (w > 210) {
    const n = w > 330 && dist > 600 ? 2 : 1;
    let px = r.x + rand(115, 155);
    for (let i = 0; i < n && px < r.x + w - 70; i++) {
      const pick = Math.random();
      const type = pick < .4 ? 'tank' : pick < .75 ? 'ac' : 'rebar';
      const dims = { tank: [38, 46], ac: [30, 22], rebar: [24, 24] }[type];
      obs.push({ type, x: px, y: r.y, w: dims[0], h: dims[1] });
      px += rand(150, 200);
    }
  }
  if (Math.random() < .7) {
    const cx = r.x - gap / 2, top = Math.min(last.y, r.y) - 80;
    for (let i = -1; i <= 1; i++) fish.push({ x: cx + i * 26, y: top + Math.abs(i) * 14, got: false });
  }
}
function reset() {
  roofs = [{ x: -40, w: 620, y: H * .7, kind: 'concrete' }]; obs = []; fish = []; parts = [];
  speed = 250; dist = 0; fishN = 0; scroll = 0;
  while (roofs[roofs.length - 1].x < W + 500) addRoof();
  cat.y = roofs[0].y - cat.h; cat.vy = 0; cat.ground = true; cat.jumps = 0; cat.coyote = 0;
  hud();
}
function hud() {
  distEl.innerHTML = Math.floor(dist / 10) + '<small>m</small>';
  fishEl.textContent = fishN;
}
function jump() {
  if (state === 'ready') start();
  if (state !== 'play') return;
  if (cat.ground || cat.coyote > 0) { cat.vy = JUMP; cat.jumps = 1; cat.holdT = 0; cat.ground = false; cat.coyote = 0; tone(420, .1, 'triangle', .04, 1.6); }
  else if (cat.jumps < 2) { cat.vy = JUMP * .86; cat.jumps = 2; cat.holdT = .2; tone(560, .1, 'triangle', .04, 1.6); for (let i = 0; i < 6; i++) parts.push({ x: cat.x + 10, y: cat.y + cat.h, vx: rand(-80, 80), vy: rand(20, 90), life: .35, col: '#c9cff5' }); }
}
function start() {
  if (state === 'play' || state === 'dead') return;
  reset(); state = 'play'; ov.hidden = true; ovBtn.blur();
}
function die(reason) {
  if (state !== 'play') return;
  state = 'dead'; deadT = .8; why = reason;
  tone(300, .45, 'sawtooth', .05, .35);
}
function gameOver() {
  state = 'over'; overAt = performance.now();
  const sc = scoreNow(), rec = sc > best;
  try { parent.postMessage({ type: 'arcade:score', game: 'rooftop', score: sc }, '*'); } catch (e) {}   // 交給大廳上傳排行榜
  if (rec) { best = sc; store.set('roofcat.best', best); bestEl.textContent = best; }
  ovTitle.textContent = why;
  ovText.innerHTML = (rec ? '<span class="rec">新紀錄！</span>' : '') + `跑了 ${Math.floor(dist / 10)} 公尺，叼到 ${fishN} 條小魚乾，總分 ${sc}。最高 ${best} 分。`;
  ovBtn.textContent = '再出門一次';
  ov.hidden = false;
}

const press = () => { holding = true; if (state === 'over') { if (performance.now() - overAt > 600) { start(); } return; } jump(); };
const release = () => { holding = false; };
stage.addEventListener('pointerdown', e => { if (e.target.closest('button')) return; e.preventDefault(); press(); });
addEventListener('pointerup', release);
addEventListener('pointercancel', release);
ovBtn.addEventListener('click', () => { if (state !== 'play') start(); });
addEventListener('keydown', e => {
  if (e.code !== 'Space' && e.code !== 'ArrowUp' && e.code !== 'KeyW') return;
  if (e.target.closest && e.target.closest('button')) return;
  e.preventDefault(); if (!e.repeat) press();
});
addEventListener('keyup', e => { if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') release(); });

function update(dt) {
  for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; }
  parts = parts.filter(p => p.life > 0);
  if (state === 'ready') { scroll += 30 * dt; cat.run += dt * 6; return; }
  if (state === 'dead') {
    cat.vy += GRAV * dt; cat.y += cat.vy * dt; deadT -= dt;
    if (deadT <= 0) gameOver();
    return;
  }
  if (state !== 'play') return;
  speed = Math.min(540, 250 + dist * .012);
  const dx = speed * dt;
  dist += dx; scroll += dx;
  for (const r of roofs) r.x -= dx;
  for (const o of obs) o.x -= dx;
  for (const f of fish) f.x -= dx;
  roofs = roofs.filter(r => r.x + r.w > -60);
  obs = obs.filter(o => o.x + o.w > -60);
  fish = fish.filter(f => f.x > -40 && !f.got);
  while (roofs[roofs.length - 1].x < W + 300) addRoof();

  const g = holding && cat.vy < 0 && cat.holdT < .22 ? HOLD_G : GRAV;
  if (holding && cat.vy < 0) cat.holdT += dt;
  const prevBottom = cat.y + cat.h;
  cat.vy = Math.min(cat.vy + g * dt, 950);
  cat.y += cat.vy * dt;
  const wasGround = cat.ground;
  cat.ground = false;
  for (const r of roofs) {
    if (cat.x + cat.w <= r.x + 3 || cat.x >= r.x + r.w - 2) continue;
    if (cat.vy >= 0 && prevBottom <= r.y + 3 && cat.y + cat.h >= r.y) {
      cat.y = r.y - cat.h; cat.vy = 0; cat.ground = true; cat.jumps = 0;
      if (!wasGround) { tone(180, .05, 'square', .02); for (let i = 0; i < 4; i++) parts.push({ x: cat.x + rand(0, cat.w), y: r.y, vx: rand(-60, 60), vy: rand(-60, -10), life: .3, col: '#8e95b5' }); }
    } else if (cat.y + cat.h > r.y + 10) { die('撞上樓牆了'); return; }
  }
  if (cat.ground) cat.coyote = .09; else cat.coyote = Math.max(0, cat.coyote - dt);
  cat.run += dt * speed / 26;
  if (cat.y > H + 30) { die('掉進防火巷了'); return; }
  for (const o of obs) {
    if (cat.x + cat.w - 5 > o.x + 3 && cat.x + 5 < o.x + o.w - 3 && cat.y + cat.h - 3 > o.y - o.h) {
      die(o.type === 'tank' ? '撞到水塔了' : o.type === 'ac' ? '撞到冷氣室外機了' : '被鋼筋絆倒了'); return;
    }
  }
  for (const f of fish) {
    if (!f.got && Math.abs(f.x - (cat.x + cat.w / 2)) < 22 && Math.abs(f.y - (cat.y + cat.h / 2)) < 24) {
      f.got = true; fishN++; tone(990 + (fishN % 3) * 120, .06, 'square', .03);
    }
  }
  hud();
}

/* ---------- draw ---------- */
function drawLayer(L, par, base, col, winAlpha) {
  const off = (scroll * par) % L.span;
  for (let k = 0; k < 2; k++) for (const b of L.list) {
    const x = b.x - off + k * L.span;
    if (x > W || x + b.w < 0) continue;
    ctx.fillStyle = col; ctx.fillRect(x, base - b.h, b.w, b.h + H);
    if (b.spire) { ctx.beginPath(); ctx.moveTo(x + b.w / 2 - 4, base - b.h); ctx.lineTo(x + b.w / 2, base - b.h - 30); ctx.lineTo(x + b.w / 2 + 4, base - b.h); ctx.fill(); }
    ctx.fillStyle = `rgba(255,207,107,${winAlpha})`;
    for (const [wx, wy] of b.wins) ctx.fillRect(x + wx, base - b.h + wy, 4, 5);
  }
}
function drawRoof(r) {
  const x = r.x, y = r.y;
  ctx.fillStyle = r.kind === 'tin' ? '#424a62' : '#4c5266'; ctx.fillRect(x, y, r.w, H - y + 10);
  ctx.fillStyle = 'rgba(255,207,107,.75)';
  for (let wy = y + 26; wy < H; wy += 34) for (let wx = x + 14; wx < x + r.w - 20; wx += 30) if (((wx * 7 + wy * 3) | 0) % 5 === 0) ctx.fillRect(wx, wy, 12, 14);
  ctx.fillStyle = 'rgba(0,0,0,.25)';
  for (let wy = y + 26; wy < H; wy += 34) for (let wx = x + 14; wx < x + r.w - 20; wx += 30) if (((wx * 7 + wy * 3) | 0) % 5 !== 0) ctx.fillRect(wx, wy, 12, 14);
  ctx.fillStyle = '#6a7190'; ctx.fillRect(x - 2, y, r.w + 4, 5);
  ctx.fillStyle = '#5a6080'; ctx.fillRect(x, y + 5, r.w, 3);
  if (r.kind === 'tin' && r.shed) {
    // a corrugated rooftop add-on, the classic iron-sheet shed
    const sx = x + r.w - 90;
    if (sx > x + 20) {
      ctx.fillStyle = '#6b7a91'; ctx.fillRect(sx, y - 34, 70, 34);
      ctx.fillStyle = 'rgba(0,0,0,.18)'; for (let i = 0; i < 70; i += 6) ctx.fillRect(sx + i, y - 34, 2, 34);
      ctx.fillStyle = '#8796ac'; ctx.beginPath(); ctx.moveTo(sx - 6, y - 34); ctx.lineTo(sx + 76, y - 40); ctx.lineTo(sx + 76, y - 34); ctx.closePath(); ctx.fill();
    }
  }
}
function drawObstacle(o) {
  const x = o.x, base = o.y;
  if (o.type === 'tank') {
    ctx.strokeStyle = '#8b93a8'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x + 5, base); ctx.lineTo(x + 8, base - 14); ctx.moveTo(x + o.w - 5, base); ctx.lineTo(x + o.w - 8, base - 14); ctx.moveTo(x + 6, base - 7); ctx.lineTo(x + o.w - 6, base - 7); ctx.stroke();
    const g = ctx.createLinearGradient(x, 0, x + o.w, 0);
    g.addColorStop(0, '#7e8799'); g.addColorStop(.35, '#e6ebf2'); g.addColorStop(.6, '#aab3c2'); g.addColorStop(1, '#6d7586');
    ctx.fillStyle = g; ctx.fillRect(x, base - o.h, o.w, o.h - 14);
    ctx.beginPath(); ctx.ellipse(x + o.w / 2, base - o.h, o.w / 2, 5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,.15)'; ctx.fillRect(x, base - o.h + 10, o.w, 2); ctx.fillRect(x, base - 24, o.w, 2);
  } else if (o.type === 'ac') {
    ctx.fillStyle = '#c9ccd4'; ctx.fillRect(x, base - o.h, o.w, o.h);
    ctx.fillStyle = '#9da2ad'; ctx.beginPath(); ctx.arc(x + o.w * .4, base - o.h / 2, 8, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#7d828d'; ctx.lineWidth = 1.5; ctx.beginPath();
    for (let i = 0; i < 3; i++) { const a = scroll * .2 + i * 2.1; ctx.moveTo(x + o.w * .4, base - o.h / 2); ctx.lineTo(x + o.w * .4 + Math.cos(a) * 7, base - o.h / 2 + Math.sin(a) * 7); }
    ctx.stroke();
  } else {
    ctx.strokeStyle = '#b8743e'; ctx.lineWidth = 2.4; ctx.lineCap = 'round'; ctx.beginPath();
    for (let i = 0; i < 4; i++) { const bx = x + 3 + i * 6; ctx.moveTo(bx, base); ctx.lineTo(bx, base - o.h + (i % 2) * 4); ctx.lineTo(bx + (i % 2 ? 4 : -4), base - o.h - 3 + (i % 2) * 4); }
    ctx.stroke();
    ctx.fillStyle = '#5a6080'; ctx.fillRect(x - 2, base - 6, o.w + 4, 6);
  }
}
function drawFish(f, t) {
  const y = f.y + Math.sin(t * 4 + f.x * .05) * 3;
  ctx.save(); ctx.translate(f.x, y);
  ctx.fillStyle = '#e7c48a'; ctx.beginPath(); ctx.ellipse(0, 0, 9, 4.5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-7, 0); ctx.lineTo(-14, -5); ctx.lineTo(-14, 5); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#3a2a14'; ctx.beginPath(); ctx.arc(5, -1, 1.2, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}
function drawCat() {
  const x = cat.x, y = cat.y, air = !cat.ground && state === 'play';
  ctx.save(); ctx.translate(x, y);
  if (state === 'dead') { ctx.translate(cat.w / 2, cat.h / 2); ctx.rotate(-.6); ctx.translate(-cat.w / 2, -cat.h / 2); }
  ctx.fillStyle = '#07070c'; ctx.strokeStyle = '#07070c'; ctx.lineCap = 'round';
  const ph = cat.run, lg = air ? 0 : Math.sin(ph) * 5;
  ctx.lineWidth = 3.4; ctx.beginPath();
  if (air) { ctx.moveTo(8, 14); ctx.lineTo(1, 20); ctx.moveTo(24, 14); ctx.lineTo(32, 19); }
  else { ctx.moveTo(8, 14); ctx.lineTo(8 + lg, 22); ctx.moveTo(11, 14); ctx.lineTo(11 - lg, 22); ctx.moveTo(23, 14); ctx.lineTo(23 - lg, 22); ctx.moveTo(26, 14); ctx.lineTo(26 + lg, 22); }
  ctx.stroke();
  ctx.beginPath(); ctx.ellipse(16, 11, 14, 7, 0, 0, Math.PI * 2); ctx.fill();
  ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(3, 9); ctx.quadraticCurveTo(-8, 4 + Math.sin(ph * .5) * 3, -6, -8); ctx.stroke();
  ctx.beginPath(); ctx.arc(31, 5, 7, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.moveTo(26, 0); ctx.lineTo(27, -8); ctx.lineTo(31, -2); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(32, -2); ctx.lineTo(36, -8); ctx.lineTo(37, 1); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#ffd84a'; ctx.beginPath(); ctx.ellipse(33.5, 4, 1.8, 2.4, 0, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}
function draw(t) {
  ctx.setTransform(DPR * S, 0, 0, DPR * S, 0, 0);
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#0b1030'); g.addColorStop(.6, '#1c2256'); g.addColorStop(1, '#3a2d5c');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#fff';
  for (const s of stars) { ctx.globalAlpha = .4 + .4 * Math.sin(t * 1.5 + s.p); ctx.fillRect(s.x, s.y * H, s.s, s.s); }
  ctx.globalAlpha = 1;
  const mx = W * .76, my = H * .15;
  const halo = ctx.createRadialGradient(mx, my, 10, mx, my, 90);
  halo.addColorStop(0, 'rgba(255,243,207,.35)'); halo.addColorStop(1, 'rgba(255,243,207,0)');
  ctx.fillStyle = halo; ctx.fillRect(mx - 90, my - 90, 180, 180);
  ctx.fillStyle = '#fff3cf'; ctx.beginPath(); ctx.arc(mx, my, 26, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,.06)'; ctx.beginPath(); ctx.arc(mx - 8, my - 6, 6, 0, Math.PI * 2); ctx.arc(mx + 9, my + 7, 4, 0, Math.PI * 2); ctx.fill();
  drawLayer(far, .12, H * .62, '#1a1f48', .35);
  drawLayer(mid, .35, H * .72, '#242a5c', .55);
  for (const r of roofs) if (r.x < W && r.x + r.w > 0) drawRoof(r);
  for (const o of obs) if (o.x < W && o.x + o.w > 0) drawObstacle(o);
  for (const f of fish) if (!f.got) drawFish(f, t);
  for (const p of parts) { ctx.globalAlpha = Math.max(0, p.life * 3); ctx.fillStyle = p.col; ctx.fillRect(p.x, p.y, 2.5, 2.5); }
  ctx.globalAlpha = 1;
  drawCat();
}

let lastT = performance.now();
function frame(now) {
  const dt = Math.min(Math.max((now - lastT) / 1000, 0), 1 / 30); lastT = now;
  update(dt); draw(now / 1000);
  requestAnimationFrame(frame);
}
reset();
requestAnimationFrame(frame);
})();
</script>
