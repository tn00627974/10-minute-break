<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0;font:14px/1.5 system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>夜市套圈圈</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@500;700;900&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Fredoka:wght@500;600&display=swap">
<style>
/* Layout: the stall seen from behind the rope — a turf floor runs back in perspective to a plywood wall hung with lanterns; the prizes stand in staggered rows; a white marker board carries the rules */
:root{
  --night:#140f1c;
  --wall:#6b4527;
  --turf:#2f8f4e;
  --bamboo:#e2bf73;
  --lantern:#e23b2e;
  --board:#f4efe2;
  --marker:#1f2a44;
  --text:#fff3e0;
  --muted:#c4b3c6;
  --display:"Chiron GoRound TC","Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  --hand:"LXGW WenKai TC","Kaiti TC","DFKai-SB","STKaiti",serif;
  --num:"Fredoka","Chiron GoRound TC",system-ui,sans-serif;
  color-scheme:dark;
}
html{height:100%;box-sizing:border-box;background:var(--night)}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{
  height:100%;margin:0;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;gap:10px;
  padding-block:10px 14px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  background:radial-gradient(120% 50% at 50% 0%,#36202c,var(--night) 70%);
  color:var(--text);font-family:var(--display);
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;
}
.hud{width:100%;max-width:520px;display:flex;align-items:center;gap:12px}
.brand{flex:1;min-width:0;font-weight:900;font-size:1.1rem;letter-spacing:.1em;white-space:nowrap;color:var(--bamboo);text-shadow:0 0 12px rgba(226,191,115,.4)}
.stat{display:flex;flex-direction:column;align-items:flex-end;line-height:1.1}
.stat span{font-size:.64rem;color:var(--muted);letter-spacing:.12em}
.stat b{font-family:var(--num);font-weight:600;font-size:1.25rem;font-variant-numeric:tabular-nums}
.icon-btn{width:34px;height:34px;border-radius:8px;border:1px solid #4a3a52;background:transparent;color:var(--text);cursor:pointer;font-size:.9rem;display:grid;place-items:center;padding:0}
.icon-btn.off{color:var(--muted);text-decoration:line-through}
.stage{position:relative;flex:1;min-height:0;width:100%;max-width:520px;border-radius:14px;overflow:hidden;touch-action:none;background:var(--night);box-shadow:0 0 0 1px #3a2c40,0 20px 50px rgba(0,0,0,.5)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.pop{position:absolute;left:0;right:0;top:38%;text-align:center;font:900 1.4rem var(--display);color:var(--text);text-shadow:0 2px 0 rgba(0,0,0,.4),0 0 14px rgba(0,0,0,.5);opacity:0;pointer-events:none;letter-spacing:.06em}
.pop.show{animation:pop 1.1s ease-out}
@keyframes pop{0%{opacity:0;transform:translateY(8px) scale(.95)}15%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0;transform:translateY(-12px)}}
/* the stall's white marker board */
.overlay{position:absolute;left:16px;right:16px;top:50%;transform:translateY(-50%) rotate(.8deg);z-index:5;padding:18px 18px 16px;background:var(--board);color:var(--marker);font-family:var(--hand);border:6px solid #b98a52;border-radius:4px;box-shadow:0 12px 30px rgba(0,0,0,.45);display:flex;flex-direction:column;gap:10px;max-height:calc(100% - 32px);overflow-y:auto}
.overlay h1{margin:0;font-family:var(--display);font-weight:900;font-size:1.55rem;letter-spacing:.08em;color:var(--lantern)}
.overlay p{margin:0;font-size:1rem;line-height:1.7;max-width:38ch}
.prices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 16px;padding:8px 0;border-top:2px solid rgba(31,42,68,.18);border-bottom:2px solid rgba(31,42,68,.18);font-size:.98rem}
.prices div{display:flex;align-items:baseline;gap:8px;min-width:0}
.prices b{margin-left:auto;font-family:var(--num);font-weight:600;font-variant-numeric:tabular-nums;color:var(--lantern)}
.prices .note{grid-column:1/-1;font-size:.88rem;color:#55607a}
.row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.btn{appearance:none;border:0;border-radius:8px;background:var(--lantern);color:#fff;font:900 1rem var(--display);padding:10px 20px;cursor:pointer;letter-spacing:.08em;box-shadow:0 3px 0 #9c2018}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #9c2018}
.keys{font-size:.88rem;color:#55607a}
.rec{color:var(--lantern);font-weight:700}
button:focus-visible{outline:2px solid var(--bamboo);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.pop.show{animation:fade 1.1s}@keyframes fade{0%,100%{opacity:0}15%,75%{opacity:1}}}
</style>

<header class="hud">
  <div class="brand">夜市套圈圈</div>
  <div class="stat"><span>竹圈</span><b id="rings">10</b></div>
  <div class="stat"><span>分數</span><b id="score">0</b></div>
  <div class="stat"><span>最高</span><b id="best">0</b></div>
  <button class="icon-btn" id="mute" aria-label="音效" aria-pressed="true">♪</button>
</header>
<main class="stage" id="stage">
  <canvas id="cv"></canvas>
  <div class="pop" id="pop" aria-live="polite"></div>
  <section class="overlay" id="overlay">
    <h1 id="ov-title">套圈圈 一局十個圈</h1>
    <p id="ov-text">在畫面上按住往下拉，拉得越長丟得越遠，左右偏就往反方向丟，放開就出手。竹圈要整個套住獎品的底座才算，碰到邊會彈開。</p>
    <div class="prices" id="prices"></div>
    <div class="row"><button class="btn" id="ov-btn">拿竹圈</button><span class="keys" id="ov-keys">電腦用滑鼠按住往下拉</span></div>
  </section>
</main>

<script>
(() => {
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const $ = id => document.getElementById(id);
const stage = $('stage'), cv = $('cv'), ctx = cv.getContext('2d');
const ringsEl = $('rings'), scoreEl = $('score'), bestEl = $('best'), pop = $('pop'), muteBtn = $('mute');
const ov = $('overlay'), ovTitle = $('ov-title'), ovText = $('ov-text'), ovBtn = $('ov-btn'), ovKeys = $('ov-keys'), pricesEl = $('prices');

/* ---------- sound ---------- */
let actx = null, noiseBuf = null, muted = !!store.get('ringtoss.muted', false);
function audio() {
  actx = actx || new (window.AudioContext || window.webkitAudioContext)();
  if (actx.state === 'suspended') actx.resume();
  if (!noiseBuf) {
    noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  return actx;
}
function noise(dur, f1, f2, type = 'bandpass', vol = .2) {
  if (muted) return;
  try {
    const a = audio(), t = a.currentTime, s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
    s.buffer = noiseBuf; f.type = type; f.Q.value = 1;
    f.frequency.setValueAtTime(f1, t); f.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(a.destination); s.start(t); s.stop(t + dur + .02);
  } catch (e) {}
}
function tone(f1, f2, dur = .1, type = 'triangle', vol = .06) {
  if (muted) return;
  try {
    const a = audio(), t = a.currentTime, o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur + .02);
  } catch (e) {}
}
const sfx = {
  whoosh: () => noise(.35, 600, 2400, 'bandpass', .16),
  clink: () => { tone(2300, 1900, .06, 'triangle', .07); setTimeout(() => tone(1700, 1500, .08, 'triangle', .05), 40); },
  thud: () => noise(.12, 300, 120, 'lowpass', .25),
  win: () => [784, 988, 1175, 1568].forEach((f, i) => setTimeout(() => tone(f, f, .14, 'square', .045), i * 90))
};
function setMute(m) { muted = m; muteBtn.setAttribute('aria-pressed', String(!m)); muteBtn.classList.toggle('off', m); store.set('ringtoss.muted', m); }
setMute(muted);
muteBtn.addEventListener('click', () => { setMute(!muted); muteBtn.blur(); if (!muted) sfx.clink(); });
function showPop(t) { pop.textContent = t; pop.classList.remove('show'); void pop.offsetWidth; pop.classList.add('show'); }

/* ---------- prizes: base radius r decides how much room the ring has, h is how tall it stands ---------- */
const RR = 22;   // ring radius; a prize is won when the ring's centre is within RR - r of the prize's centre
const TYPES = {
  can:    { name: '罐裝汽水', pts: 10, r: 8,  h: 26 },
  ramune: { name: '彈珠汽水', pts: 20, r: 7,  h: 40 },
  duck:   { name: '小鴨',     pts: 30, r: 11, h: 22 },
  cat:    { name: '招財貓',   pts: 50, r: 13, h: 32 },
  box:    { name: '禮物盒',   pts: 80, r: 15, h: 15 }
};
const TYPE_KEYS = Object.keys(TYPES);
const ROWS = [40, 105, 170, 235, 300];              // depth of each row
const ROW_MULT = [1, 1.2, 1.5, 2, 2.5];
const ROW_ODDS = [[5, 3, 2, 0, 0], [3, 3, 3, 1, 0], [2, 2, 3, 2, 1], [1, 2, 2, 3, 2], [0, 1, 2, 3, 3]];
const CAN_COLORS = [['#d93a32', '#ff7a6b'], ['#2d7fd1', '#7fb8f0'], ['#2f9a55', '#7fd49a'], ['#f2a12b', '#ffd27a']];
const BOX_COLORS = [['#e85d9a', '#ff9ec6'], ['#6a5acd', '#a99cf0'], ['#2fa3a0', '#7fd8d4']];
const WALL_D = 365, SIDE = 175, START = { x: 0, d: -20, z: 12 }, G = 1100;
const pointsOf = p => Math.round(TYPES[p.t].pts * ROW_MULT[p.row] / 5) * 5;

function renderPrices(won) {
  if (!won) {
    pricesEl.innerHTML = TYPE_KEYS.map(k => `<div>${TYPES[k].name}<b>${TYPES[k].pts} 分</b></div>`).join('') +
      '<div class="note">越後排分數越高，最後一排 ×2.5。底座越大越難套。</div>';
    return;
  }
  const by = {};
  for (const p of won) { by[p.t] = by[p.t] || { n: 0, pts: 0 }; by[p.t].n++; by[p.t].pts += pointsOf(p); }
  pricesEl.innerHTML = TYPE_KEYS.map(k => `<div>${TYPES[k].name} ×${by[k] ? by[k].n : 0}<b>${by[k] ? by[k].pts : 0}</b></div>`).join('');
}
renderPrices(null);

/* ---------- perspective: a camera 175 units up, 150 units behind the front row line ---------- */
const W = 400, F = 320, D0 = 150, K = 175;
let H = 640, S = 1, DPR = 1, yH = 0;
const sc = d => F / (d + D0);
function proj(x, d, z = 0) { const s = sc(d); return { x: W / 2 + x * s, y: yH + K * s - z * s, s }; }
function fit() {
  const r = stage.getBoundingClientRect();
  if (!r.width || !r.height) return;
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(r.width * DPR); cv.height = Math.round(r.height * DPR);
  S = r.width / W; H = r.height / S;
  yH = (H - 64) - K * sc(START.d);   // the spot you throw from sits just above the bottom edge
}
function ringShape(x, d, z) {
  const c = proj(x, d, z), a = proj(x, d - RR, z), b = proj(x, d + RR, z);
  let rx = RR * c.s, ry = (a.y - b.y) / 2, s = c.s;
  // right in front of the camera the true perspective is too big to read, so cap the size and the tilt
  if (rx > 34) { const k = 34 / rx; rx *= k; ry *= k; s *= k; }
  return { cx: c.x, cy: (a.y + b.y) / 2, rx, ry: Math.max(1.5, Math.min(ry, rx * .6)), s };
}

/* ---------- state ---------- */
let prizes = [], rings = [], flying = null, aim = null, won = [];
let state = 'ready', score = 0, left = 10, nextT = 0, overAt = 0;
let best = store.get('ringtoss.best', 0);
bestEl.textContent = best;

function pickType(row) {
  const w = ROW_ODDS[row]; let r = Math.random() * w.reduce((a, b) => a + b, 0);
  for (let i = 0; i < w.length; i++) if ((r -= w[i]) < 0) return TYPE_KEYS[i];
  return 'can';
}
function layout() {
  prizes = [];
  ROWS.forEach((d, row) => {
    const xs = row % 2 ? [-82, -27, 27, 82] : [-110, -55, 0, 55, 110];
    for (const x of xs) {
      const t = pickType(row);
      prizes.push({ t, row, x, d, r: TYPES[t].r, h: TYPES[t].h, done: false,
        c: (t === 'box' ? BOX_COLORS : CAN_COLORS)[Math.floor(Math.random() * (t === 'box' ? BOX_COLORS : CAN_COLORS).length)], wob: Math.random() * 6 });
    }
  });
}
function hud() { ringsEl.textContent = left; scoreEl.textContent = score; }
function reset() { layout(); rings = []; flying = null; aim = null; won = []; score = 0; left = 10; hud(); }
function start() {
  if (state === 'paused') { resume(); return; }
  if (state !== 'ready' && state !== 'over') return;
  reset(); state = 'aim'; ov.hidden = true; ovBtn.blur();
}
function pause() {
  if (state !== 'aim' && state !== 'flying' && state !== 'next') return;
  state = 'paused-' + state; aim = null;
  ovTitle.textContent = '休息一下'; ovText.textContent = `還有 ${left} 個竹圈，目前 ${score} 分。`;
  pricesEl.hidden = true; ovBtn.textContent = '繼續丟'; ovKeys.textContent = 'P 或空白鍵也能繼續';
  ov.hidden = false;
}
function resume() {
  if (!state.startsWith('paused-')) return;
  state = state.slice(7); ov.hidden = true; pricesEl.hidden = false; ovBtn.blur();
}
function gameOver() {
  state = 'over'; overAt = performance.now();
  const rec = score > best;
  if (rec) { best = score; store.set('ringtoss.best', best); bestEl.textContent = best; }
  ovTitle.textContent = won.length ? `套到 ${won.length} 樣獎品` : '十個圈都沒套中';
  ovText.innerHTML = (rec ? '<span class="rec">新紀錄！</span>' : '') + `這局 ${score} 分，最高紀錄 ${best} 分。` + (won.length ? '' : '試著讓竹圈從高一點的地方落下。');
  renderPrices(won); pricesEl.hidden = false;
  ovBtn.textContent = '再買十個圈'; ovKeys.textContent = '點畫面也能重來';
  ov.hidden = false;
}

/* ---------- throwing: pull back, the pull length sets the range, the sideways pull sets the angle ---------- */
const MAX_PULL = 170;
function aimFrom(a) {
  const dx = a.cx - a.x0, dy = a.cy - a.y0;
  if (dy < 8) return null;
  const power = Math.min(1, Math.hypot(dx, dy) / MAX_PULL);
  const angle = Math.max(-.55, Math.min(.55, Math.atan2(-dx, dy)));
  return { power, angle, range: 40 + power * 420 };
}
// horizontal launch speed that lands the ring `range` away, thrown up at 1.5× its forward speed
function launchSpeed(range) {
  const k = 1.5, z0 = START.z;
  let lo = 20, hi = 1500;
  for (let i = 0; i < 40; i++) {
    const v = (lo + hi) / 2, vz = k * v, T = (vz + Math.sqrt(vz * vz + 2 * G * z0)) / G;
    if (v * T < range) lo = v; else hi = v;
  }
  return lo;
}
function makeRing(angle, range) {
  const v = launchSpeed(range);
  return { x: START.x, d: START.d, z: START.z, vx: v * Math.sin(angle), vd: v * Math.cos(angle), vz: 1.5 * v,
    spin: 0, grounded: false, around: null, bounced: false, rest: false };
}
function throwRing(a) {
  const t = aimFrom(a);
  if (!t || t.power < .06) return;
  // a little human wobble in every throw
  const angle = t.angle + (Math.random() - .5) * .03, range = t.range * (1 + (Math.random() - .5) * .03);
  flying = makeRing(angle, range);
  left--; hud(); state = 'flying'; sfx.whoosh();
}
function bounce(r, p, dx, dd, dist, hop) {
  const nx = dx / (dist || 1), nd = dd / (dist || 1), out = RR + p.r + .5;
  r.x = p.x + nx * out; r.d = p.d + nd * out;
  const vn = r.vx * nx + r.vd * nd;
  if (vn < 0) { r.vx -= 1.6 * vn * nx; r.vd -= 1.6 * vn * nd; }
  r.vx *= .45; r.vd *= .45;
  if (hop) { r.z = Math.max(r.z, p.h); r.vz = 90; }
  r.bounced = true; sfx.clink();
}
function stepRing(r, h) {
  const pz = r.z;
  r.x += r.vx * h; r.d += r.vd * h;
  if (!r.grounded) { r.vz -= G * h; r.z += r.vz * h; }
  r.spin += h * 9;
  for (const p of prizes) {
    const dx = r.x - p.x, dd = r.d - p.d, dist = Math.hypot(dx, dd), inner = RR - p.r;
    if (r.around === p) {
      // already over the top: the ring can only rattle down around it
      if (dist > inner - .5) { r.x = p.x + dx / dist * (inner - .5); r.d = p.d + dd / dist * (inner - .5); }
      continue;
    }
    if (dist >= RR + p.r || r.around) continue;
    const top = p.h + (p.done ? 3 : 0);
    if (pz > top && r.z <= top) {
      if (dist <= inner && !p.done) { r.around = p; continue; }
      // caught on the rim: sometimes it tips over and drops around anyway
      if (dist < RR && !p.done && Math.random() < .3) {
        r.x = p.x + dx / dist * (inner - 1); r.d = p.d + dd / dist * (inner - 1); r.around = p; sfx.clink(); continue;
      }
      bounce(r, p, dx, dd, dist, true);
    } else if (r.z < top && dist > inner) {
      bounce(r, p, dx, dd, dist, false);
    }
  }
  if (r.d > WALL_D) { r.d = WALL_D; r.vd = -Math.abs(r.vd) * .3; sfx.thud(); }
  if (Math.abs(r.x) > SIDE) { r.x = Math.sign(r.x) * SIDE; r.vx = -r.vx * .3; }
  if (!r.grounded && r.z <= 0) { r.z = 0; r.vz = 0; r.grounded = true; r.vx *= .2; r.vd *= .2; sfx.thud(); }
  if (r.grounded) {
    const f = Math.max(0, 1 - 14 * h); r.vx *= f; r.vd *= f;
    if (Math.hypot(r.vx, r.vd) < 4) { r.vx = r.vd = 0; r.rest = true; }
  }
}
function settle(r) {
  rings.push(r); flying = null;
  const p = r.around;
  if (p && !p.done) {
    p.done = true; p.ring = r; won.push(p);
    const pts = pointsOf(p);
    score += pts; hud(); sfx.win();
    showPop(`套中${TYPES[p.t].name}！+${pts}`);
  } else showPop(r.bounced ? '差一點！' : '沒套中');
  state = 'next'; nextT = left > 0 ? .7 : 1.3;
}

/* ---------- input ---------- */
function toWorld(e) { const r = stage.getBoundingClientRect(); return { x: (e.clientX - r.left) / S, y: (e.clientY - r.top) / S }; }
stage.addEventListener('pointerdown', e => {
  if (e.target.closest('.overlay')) return;
  e.preventDefault();
  if (state === 'over') { if (performance.now() - overAt > 900) start(); return; }
  if (state !== 'aim' || aim) return;
  const p = toWorld(e);
  aim = { id: e.pointerId, x0: p.x, y0: p.y, cx: p.x, cy: p.y };
  try { stage.setPointerCapture(e.pointerId); } catch (_) {}
});
stage.addEventListener('pointermove', e => {
  if (!aim || e.pointerId !== aim.id) return;
  const p = toWorld(e); aim.cx = p.x; aim.cy = p.y;
});
stage.addEventListener('pointerup', e => {
  if (!aim || e.pointerId !== aim.id) return;
  const a = aim; aim = null;
  if (state === 'aim') throwRing(a);
});
stage.addEventListener('pointercancel', () => { aim = null; });
ovBtn.addEventListener('click', () => { if (state === 'over' && performance.now() - overAt < 600) return; start(); });
addEventListener('keydown', e => {
  if (e.code === 'KeyP' || e.code === 'Escape') { state.startsWith('paused-') ? resume() : pause(); return; }
  if ((e.code === 'Space' || e.code === 'Enter') && !(e.target.closest && e.target.closest('button'))) {
    e.preventDefault();
    if (state.startsWith('paused-')) resume(); else if (state === 'ready' || (state === 'over' && performance.now() - overAt > 600)) start();
  }
});
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
addEventListener('blur', pause);

/* ---------- update ---------- */
function update(dt) {
  if (state.startsWith('paused-')) return;
  if (state === 'flying' && flying) {
    for (let i = 0; i < 4; i++) stepRing(flying, dt / 4);
    if (flying.rest) settle(flying);
  } else if (state === 'next') {
    nextT -= dt;
