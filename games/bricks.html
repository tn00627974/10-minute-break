<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0;font:14px/1.5 system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>套色打磚塊</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik+Mono+One&family=Noto+Sans+TC:wght@500;700;900&display=swap">
<style>
/* Layout: one printed proof sheet on a dark desk; crop marks and a colour bar frame the playfield, the HUD sits on the desk above it */
:root{
  --desk:#2a2b31;
  --desk-line:#41424b;
  --paper:#f0efe9;
  --ink:#1e1d1f;
  --pink:#ff48b0;
  --blue:#0078bf;
  --yellow:#ffe800;
  --label:#a9a7b3;
  --display:"Rubik Mono One","Noto Sans TC",system-ui,sans-serif;
  --body:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  color-scheme:dark;
}
html{height:100%;box-sizing:border-box;background:var(--desk)}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{
  height:100%;margin:0;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;gap:10px;
  padding-block:10px 14px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  background:var(--desk);color:var(--paper);font-family:var(--body);
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;
}
.hud{width:100%;max-width:520px;display:flex;align-items:center;gap:14px}
.brand{flex:1;min-width:0;font-weight:900;font-size:1rem;letter-spacing:.08em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand em{font-style:normal;color:var(--pink);text-shadow:2px 2px 0 var(--blue)}
.stat{display:flex;flex-direction:column;align-items:flex-end;line-height:1.2}
.stat span{font-size:.64rem;color:var(--label);letter-spacing:.14em}
.stat b{font-family:var(--display);font-weight:400;font-size:.9rem;font-variant-numeric:tabular-nums}
.lives{display:flex;gap:4px;height:1.08rem;align-items:center}
.lives i{width:9px;height:9px;border-radius:50%;background:var(--pink);box-shadow:2px 2px 0 var(--blue)}
.btns{display:flex;gap:6px}
.icon-btn{width:34px;height:34px;border-radius:8px;border:1px solid var(--desk-line);background:transparent;color:var(--paper);cursor:pointer;font-size:.9rem;display:grid;place-items:center;padding:0}
.icon-btn.off{color:var(--label);text-decoration:line-through}
.stage{position:relative;flex:1;min-height:0;width:100%;max-width:520px;background:var(--paper);border-radius:3px;overflow:hidden;touch-action:none;cursor:crosshair;box-shadow:0 18px 50px rgba(0,0,0,.5)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.pop{position:absolute;left:0;right:0;top:44%;text-align:center;font:900 1.35rem var(--body);color:var(--ink);text-shadow:3px 3px 0 var(--pink);opacity:0;pointer-events:none;letter-spacing:.04em}
.pop.show{animation:pop 1.1s ease-out}
@keyframes pop{0%{opacity:0;transform:scale(.85)}12%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
.overlay{position:absolute;left:18px;right:18px;top:50%;transform:translateY(-50%);padding:18px 18px 16px;background:var(--paper);color:var(--ink);border:2px solid var(--ink);box-shadow:6px 6px 0 var(--pink);display:flex;flex-direction:column;gap:10px;cursor:pointer}
.overlay h1{margin:0;font-size:1.4rem;font-weight:900;letter-spacing:.04em;text-wrap:balance}
.overlay p{margin:0;font-size:.9rem;line-height:1.7;max-width:40ch}
.legend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 12px;font-size:.82rem}
.legend div{display:flex;align-items:center;gap:8px;min-width:0}
.chip{flex:none;display:inline-grid;place-items:center;width:30px;height:18px;border-radius:9px;font-weight:900;font-size:.72rem;color:var(--paper)}
.chip.b{background:var(--blue);box-shadow:2px 2px 0 var(--yellow)}
.chip.p{background:var(--pink);box-shadow:2px 2px 0 var(--blue)}
.chip.y{background:var(--yellow);color:var(--ink);box-shadow:2px 2px 0 var(--pink)}
.chip.k{background:var(--ink);box-shadow:2px 2px 0 var(--pink)}
.row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:2px}
.btn{appearance:none;border:2px solid var(--ink);background:var(--blue);color:var(--paper);font:900 1rem var(--body);padding:9px 18px;cursor:pointer;letter-spacing:.06em;box-shadow:3px 3px 0 var(--yellow)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--yellow)}
.keys{font-size:.76rem;color:#5d5b62}
.rec{color:var(--pink);font-weight:900}
button:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
@media (max-width:380px){.legend{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){
  .pop.show{animation:fade 1.1s}
  @keyframes fade{0%,100%{opacity:0}15%,75%{opacity:1}}
}
</style>

<header class="hud">
  <div class="brand">套<em>色</em>打磚塊</div>
  <div class="stat"><span>分數</span><b id="score">0</b></div>
  <div class="stat"><span>關卡</span><b id="level">1</b></div>
  <div class="stat"><span>機會</span><div class="lives" id="lives" aria-label="剩餘機會"></div></div>
  <div class="btns">
    <button class="icon-btn" id="pause" aria-label="暫停">Ⅱ</button>
    <button class="icon-btn" id="mute" aria-label="音效" aria-pressed="true">♪</button>
  </div>
</header>

<main class="stage" id="stage">
  <canvas id="cv"></canvas>
  <div class="pop" id="pop" aria-live="polite"></div>
  <section class="overlay" id="overlay">
    <h1 id="ov-title">套色打磚塊</h1>
    <p id="ov-text">拖曳或移動滑鼠控制底下的板子，放開手指、點一下或按空白鍵發球。黑色磚要打兩到三下才會掉色。</p>
    <div class="legend" id="legend">
      <div><span class="chip b">寬</span>板子變寬</div>
      <div><span class="chip p">多</span>球分裂成三顆</div>
      <div><span class="chip y">慢</span>球速變慢</div>
      <div><span class="chip k">命</span>多一次機會</div>
    </div>
    <div class="row"><button class="btn" id="ov-btn">開始印刷</button><span class="keys" id="ov-keys">← → 移動・P 暫停</span></div>
  </section>
</main>

<script>
(() => {
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const $ = id => document.getElementById(id);
const stage = $('stage'), cv = $('cv'), ctx = cv.getContext('2d');
const scoreEl = $('score'), levelEl = $('level'), livesEl = $('lives'), pop = $('pop');
const ov = $('overlay'), ovTitle = $('ov-title'), ovText = $('ov-text'), ovBtn = $('ov-btn'), ovKeys = $('ov-keys'), legend = $('legend');
const muteBtn = $('mute'), pauseBtn = $('pause');

const W = 400;
let H = 640, S = 1, DPR = 1;
const paddle = { x: W / 2, y: 586, w: 78, h: 12, target: W / 2, wideT: 0, squash: 0 };
function fit() {
  const r = stage.getBoundingClientRect();
  if (!r.width || !r.height) return;
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(r.width * DPR); cv.height = Math.round(r.height * DPR);
  S = r.width / W; H = r.height / S;
  paddle.y = H - 54;
}
fit();
if ('ResizeObserver' in window) new ResizeObserver(fit).observe(stage); else addEventListener('resize', fit);

/* ---------- sound ---------- */
let actx = null, muted = !!store.get('riso.muted', false);
function tone(f, d = .08, type = 'square', v = .04) {
  if (muted) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + d + .02);
  } catch (e) {}
}
function setMute(m) { muted = m; muteBtn.setAttribute('aria-pressed', String(!m)); muteBtn.classList.toggle('off', m); store.set('riso.muted', m); }
setMute(muted);
muteBtn.addEventListener('click', () => { setMute(!muted); muteBtn.blur(); if (!muted) tone(660, .06); });

/* ---------- inks & sheet ---------- */
const INK = { pink: '#ff48b0', blue: '#0078bf', yellow: '#ffe800', black: '#1e1d1f', paper: '#f0efe9' };
const ROWINK = [['pink', 'blue'], ['yellow', 'pink'], ['blue', 'yellow']]; // [main ink, misregistered ink]
const COLS = 8, MARGIN = 14, GAP = 6, BRH = 18, TOP = 58;
const BW = (W - MARGIN * 2 - GAP * (COLS - 1)) / COLS;
const HEART = ['.##..##.', '########', '########', '.######.', '..####..', '...##...'];
const PATTERNS = [
  () => true,
  (r, c) => (r + c) % 2 === 0,
  (r, c) => Math.abs(c - 3.5) <= (r + 1) * .75,
  (r, c) => r % 2 === 0 || (c !== 3 && c !== 4),
  (r, c) => !!HEART[r] && HEART[r][c] === '#',
  (r, c) => c % 3 !== 2
];
const DROPS = {
  wide:  { ch: '寬', main: 'blue',   off: 'yellow', text: 'paper', msg: '板子變寬' },
  multi: { ch: '多', main: 'pink',   off: 'blue',   text: 'paper', msg: '分裂！' },
  slow:  { ch: '慢', main: 'yellow', off: 'pink',   text: 'black', msg: '減速' },
  life:  { ch: '命', main: 'black',  off: 'pink',   text: 'paper', msg: '+1 次機會' }
};
const grain = (() => {
  const g = document.createElement('canvas'); g.width = g.height = 96;
  const c = g.getContext('2d'), img = c.createImageData(96, 96);
  for (let i = 0; i < img.data.length; i += 4) {
    img.data[i] = 40; img.data[i + 1] = 38; img.data[i + 2] = 45;
    img.data[i + 3] = Math.random() < .12 ? Math.random() * 38 : 0;
  }
  c.putImageData(img, 0, 0);
  return ctx.createPattern(g, 'repeat');
})();

/* ---------- state ---------- */
let balls = [], bricks = [], drops = [], parts = [];
let state = 'ready', prevState = 'play', level = 1, score = 0, lives = 3, slowT = 0, chain = 0, clearT = 0, overAt = 0, ignoreUp = false;
let best = store.get('riso.best', 0);
const held = new Set();

const baseSpeed = () => Math.min(300 + (level - 1) * 16, 500);
function newBall() { return { x: paddle.x, y: paddle.y - 7, vx: 0, vy: 0, r: 6, sp: baseSpeed(), stuck: true, off: (Math.random() - .5) * 24 }; }
function makeLevel(n) {
  const idx = (n - 1) % PATTERNS.length, p = PATTERNS[idx];
  const R = idx === 4 ? 6 : Math.min(4 + Math.floor((n - 1) / 2), 8);
  const hard = Math.min(Math.floor((n - 1) / 2), R - 1);
  bricks = [];
  for (let r = 0; r < R; r++) for (let c = 0; c < COLS; c++) {
    if (!p(r, c, R)) continue;
    let hp = r < hard ? 2 : 1;
    if (n >= 6 && r === 0) hp = 3;
    bricks.push({ x: MARGIN + c * (BW + GAP), y: TOP + r * (BRH + GAP), w: BW, h: BRH, hp, max: hp, row: r, flash: 0 });
  }
}
function hud() {
  scoreEl.textContent = score;
  levelEl.textContent = level;
  livesEl.innerHTML = '<i></i>'.repeat(Math.max(0, lives));
}
function showPop(text) { pop.textContent = text; pop.classList.remove('show'); void pop.offsetWidth; pop.classList.add('show'); }
function resetGame() {
  level = 1; score = 0; lives = 3; slowT = 0; chain = 0; drops = []; parts = [];
  paddle.wideT = 0; paddle.w = 78;
  makeLevel(level); balls = [newBall()]; hud();
}
function start() {
  if (state === 'play' || state === 'clear') return;
  resetGame(); state = 'play'; ov.hidden = true; ovBtn.blur();
  showPop('第 1 關');
}
function launch() {
  let any = false;
  for (const b of balls) if (b.stuck) {
    const a = (Math.random() - .5) * .7;
    b.vx = b.sp * Math.sin(a); b.vy = -b.sp * Math.cos(a); b.stuck = false; any = true;
  }
  if (any) tone(620, .06);
}
function pause() {
  if (state !== 'play' && state !== 'clear') return;
  prevState = state; state = 'paused';
  ovTitle.textContent = '暫停中';
  ovText.textContent = `第 ${level} 關，目前 ${score} 分。`;
  legend.hidden = false; ovBtn.textContent = '繼續'; ovKeys.textContent = 'P 或空白鍵繼續';
  ov.hidden = false;
}
function resume() { if (state !== 'paused') return; state = prevState; ov.hidden = true; ovBtn.blur(); }
function gameOver() {
  state = 'over'; overAt = performance.now();
  const rec = score > best && score > 0;
  try { parent.postMessage({ type: 'arcade:score', game: 'bricks', score: score }, '*'); } catch (e) {}   // 交給大廳上傳排行榜
  if (rec) { best = score; store.set('riso.best', best); }
  ovTitle.textContent = '沒接住';
  ovText.innerHTML = (rec ? '<span class="rec">新紀錄！</span>' : '') + `印到第 ${level} 關，得到 ${score} 分。最高紀錄 ${best} 分。`;
  legend.hidden = true; ovBtn.textContent = '再印一張'; ovKeys.textContent = '點擊畫面・空白鍵';
  setTimeout(() => { if (state === 'over') ov.hidden = false; }, 500);
}
function loseLife() {
  lives--; hud(); tone(180, .4, 'sawtooth', .05);
  if (lives <= 0) { gameOver(); return; }
  balls = [newBall()]; drops = []; paddle.wideT = 0; slowT = 0; chain = 0;
  showPop(`剩下 ${lives} 次機會`);
}
function levelClear() {
  state = 'clear'; clearT = 1.6;
  const bonus = 100 * level; score += bonus; balls = []; drops = []; hud();
  showPop(`第 ${level} 關完成 +${bonus}`);
  [523, 659, 784].forEach((f, i) => setTimeout(() => tone(f, .12, 'triangle', .06), i * 110));
}
function nextLevel() {
  level++; makeLevel(level); balls = [newBall()]; state = 'play'; slowT = 0; hud();
  showPop(`第 ${level} 關`);
}

/* ---------- physics ---------- */
function hitBrick(b) {
  for (const br of bricks) {
    if (br.hp > 0 && b.x + b.r > br.x && b.x - b.r < br.x + br.w && b.y + b.r > br.y && b.y - b.r < br.y + br.h) return br;
  }
  return null;
}
function burst(br) {
  const [m, o] = ROWINK[br.row % 3];
  for (let i = 0; i < 10; i++) parts.push({
    x: br.x + Math.random() * br.w, y: br.y + Math.random() * br.h,
    vx: (Math.random() - .5) * 220, vy: -Math.random() * 160 - 20,
    s: 3 + Math.random() * 4, rot: Math.random() * 6, vr: (Math.random() - .5) * 12, life: .8, ink: i % 2 ? m : o
  });
}
function damage(br, b) {
  br.hp--; br.flash = .15; chain++;
  b.sp = Math.min(b.sp + 2.5, baseSpeed() * 1.35);
  const m = Math.hypot(b.vx, b.vy) || 1; b.vx *= b.sp / m; b.vy *= b.sp / m;
  if (br.hp <= 0) {
    score += 10 * br.max + chain * 2; burst(br);
    tone(392 + (7 - br.row) * 45, .07, 'square', .035);
    if (Math.random() < .12 && drops.length < 3) {
      const r = Math.random();
      const type = r < .36 ? 'wide' : r < .72 ? 'multi' : r < .92 ? 'slow' : 'life';
      drops.push({ x: br.x + br.w / 2, y: br.y + br.h / 2, type });
    }
  } else { score += 5; tone(160, .05, 'square', .03); }
  hud();
}
function stepBall(b, dt) {
  const f = slowT > 0 ? .62 : 1;
  const n = Math.max(1, Math.ceil(b.sp * f * dt / 4)), h = dt * f / n;
  for (let i = 0; i < n; i++) {
    b.x += b.vx * h;
    if (b.x < b.r) { b.x = b.r; b.vx = Math.abs(b.vx); tone(300, .03, 'square', .02); }
    else if (b.x > W - b.r) { b.x = W - b.r; b.vx = -Math.abs(b.vx); tone(300, .03, 'square', .02); }
    let br = hitBrick(b);
    if (br) { b.x = b.vx > 0 ? br.x - b.r : br.x + br.w + b.r; b.vx = -b.vx; damage(br, b); }
    b.y += b.vy * h;
    if (b.y < b.r) { b.y = b.r; b.vy = Math.abs(b.vy); tone(300, .03, 'square', .02); }
    br = hitBrick(b);
    if (br) { b.y = b.vy > 0 ? br.y - b.r : br.y + br.h + b.r; b.vy = -b.vy; damage(br, b); }
    const hw = paddle.w / 2;
    if (b.vy > 0 && b.y + b.r >= paddle.y && b.y - b.r <= paddle.y + paddle.h && b.x >= paddle.x - hw - b.r && b.x <= paddle.x + hw + b.r) {
      const rel = Math.max(-1, Math.min(1, (b.x - paddle.x) / hw)), a = rel * 1.05;
      b.vx = b.sp * Math.sin(a); b.vy = -b.sp * Math.cos(a); b.y = paddle.y - b.r;
      paddle.squash = 1; chain = 0; tone(440, .05, 'triangle', .05);
    }
    if (b.y - b.r > H) { b.dead = true; return; }
  }
}
function applyDrop(type) {
  showPop(DROPS[type].msg); tone(880, .12, 'triangle', .06);
  if (type === 'wide') paddle.wideT = 12;
  else if (type === 'slow') slowT = 9;
  else if (type === 'life') { lives = Math.min(lives + 1, 6); hud(); }
  else if (type === 'multi') {
    if (balls.some(b => b.stuck)) launch();
    const src = balls.slice(0, 3);
    for (const s of src) for (const a of [-.42, .42]) {
      if (balls.length >= 9) break;
      const c = Math.cos(a), sn = Math.sin(a);
      const nb = { ...s, vx: s.vx * c - s.vy * sn, vy: s.vx * sn + s.vy * c, stuck: false, dead: false };
      if (Math.abs(nb.vy) < nb.sp * .35) {
        nb.vy = (nb.vy >= 0 ? -1 : -1) * nb.sp * .35;
        nb.vx = Math.sign(nb.vx || 1) * Math.sqrt(nb.sp * nb.sp - nb.vy * nb.vy);
      }
      balls.push(nb);
    }
  }
}

/* ---------- update ---------- */
function update(dt) {
  if (state === 'paused') return;
  let dir = 0;
  if (held.has('ArrowLeft') || held.has('KeyA')) dir -= 1;
  if (held.has('ArrowRight') || held.has('KeyD')) dir += 1;
  if (dir) { paddle.x += dir * 460 * dt; paddle.target = paddle.x; }
  else paddle.x += (paddle.target - paddle.x) * Math.min(1, dt * 22);
  paddle.w += ((paddle.wideT > 0 ? 122 : 78) - paddle.w) * Math.min(1, dt * 8);
  paddle.x = Math.max(paddle.w / 2, Math.min(W - paddle.w / 2, paddle.x));
  paddle.wideT = Math.max(0, paddle.wideT - dt);
  paddle.squash = Math.max(0, paddle.squash - dt * 6);
  slowT = Math.max(0, slowT - dt);

  if (state === 'play' || state === 'ready') {
    for (const b of balls) {
      if (b.stuck) { b.x = paddle.x + b.off; b.y = paddle.y - b.r - 1; }
      else if (state === 'play') stepBall(b, dt);
    }
  }
  if (state === 'play') {
    bricks = bricks.filter(br => br.hp > 0);
    balls = balls.filter(b => !b.dead);
    for (const d of drops) {
      d.y += 110 * dt;
      if (d.y + 8 >= paddle.y && d.y - 8 <= paddle.y + paddle.h && Math.abs(d.x - paddle.x) < paddle.w / 2 + 12) { d.got = true; applyDrop(d.type); }
    }
    drops = drops.filter(d => !d.got && d.y < H + 20);
    if (!bricks.length) levelClear();
    else if (!balls.length) loseLife();
  } else if (state === 'clear') {
    clearT -= dt; if (clearT <= 0) nextLevel();
  }
  for (const br of bricks) br.flash = Math.max(0, br.flash - dt);
  for (const p of parts) { p.vy += 600 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt; p.life -= dt; }
  parts = parts.filter(p => p.life > 0);
}

/* ---------- draw ---------- */
function rr(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function drawMarks() {
  ctx.strokeStyle = 'rgba(30,29,31,.5)'; ctx.lineWidth = .8;
  for (const [x, y] of [[12, 12], [W - 12, 12], [12, H - 12], [W - 12, H - 12]]) {
    ctx.beginPath(); ctx.arc(x, y, 4, 0, Math.PI * 2);
    ctx.moveTo(x - 8, y); ctx.lineTo(x + 8, y); ctx.moveTo(x, y - 8); ctx.lineTo(x, y + 8); ctx.stroke();
  }
  ['pink', 'yellow', 'blue', 'black'].forEach((k, i) => { ctx.fillStyle = INK[k]; ctx.fillRect(W / 2 - 26 + i * 13, H - 16, 11, 7); });
  ctx.fillStyle = 'rgba(30,29,31,.5)'; ctx.font = '7px "Rubik Mono One", monospace'; ctx.textBaseline = 'middle';
  ctx.textAlign = 'left'; ctx.fillText('SHEET ' + String(level).padStart(2, '0'), 26, H - 12);
  ctx.textAlign = 'right'; ctx.fillText('PK · Y · BL', W - 26, H - 12);
}
function drawBrick(br) {
  const [m, o] = br.hp >= 2 ? ['black', 'pink'] : ROWINK[br.row % 3];
  const j = br.flash > 0 ? (Math.random() - .5) * 3 : 0;
  ctx.fillStyle = INK[o]; rr(br.x + 2.5 + j, br.y + 2.5, br.w, br.h, 3); ctx.fill();
  ctx.fillStyle = INK[m]; rr(br.x, br.y, br.w, br.h, 3); ctx.fill();
}
function draw() {
  ctx.setTransform(DPR * S, 0, 0, DPR * S, 0, 0);
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = INK.paper; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = grain; ctx.fillRect(0, 0, W, H);
  drawMarks();

  ctx.globalCompositeOperation = 'multiply';
  for (const br of bricks) drawBrick(br);
  for (const p of parts) {
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.globalAlpha = Math.min(1, p.life * 2);
    ctx.fillStyle = INK[p.ink]; ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s); ctx.restore();
  }
  ctx.globalAlpha = 1;
  for (const d of drops) {
    const k = DROPS[d.type];
    ctx.fillStyle = INK[k.off]; rr(d.x - 15 + 2, d.y - 8 + 2, 30, 16, 8); ctx.fill();
    ctx.fillStyle = INK[k.main]; rr(d.x - 15, d.y - 8, 30, 16, 8); ctx.fill();
  }
  const pw = paddle.w, ph = paddle.h * (1 - paddle.squash * .3), px = paddle.x - pw / 2, py = paddle.y + (paddle.h - ph);
  ctx.fillStyle = INK.yellow; rr(px + 3, py + 3, pw, ph, 6); ctx.fill();
  ctx.fillStyle = INK.blue; rr(px, py, pw, ph, 6); ctx.fill();
  for (const b of balls) {
    ctx.fillStyle = slowT > 0 ? INK.yellow : INK.blue;
    ctx.beginPath(); ctx.arc(b.x + 2, b.y + 2, b.r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = INK.pink;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
  }

  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = INK.paper;
  for (const br of bricks) if (br.hp >= 2) {
    for (let i = 0; i < br.hp; i++) {
      ctx.beginPath(); ctx.arc(br.x + br.w / 2 + (i - (br.hp - 1) / 2) * 7, br.y + br.h / 2, 2, 0, Math.PI * 2); ctx.fill();
    }
  }
  ctx.font = '900 10px "Noto Sans TC", sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const d of drops) { const k = DROPS[d.type]; ctx.fillStyle = INK[k.text]; ctx.fillText(k.ch, d.x, d.y + .5); }
}

/* ---------- input ---------- */
const toX = e => (e.clientX - stage.getBoundingClientRect().left) / S;
stage.addEventListener('pointerdown', e => {
  if (e.target.closest('button')) return;
  if (e.button > 0) return;
  e.preventDefault();
  if (state === 'ready' || (state === 'over' && performance.now() - overAt > 600)) { start(); ignoreUp = true; return; }
  if (state === 'paused') { resume(); ignoreUp = true; return; }
  paddle.target = toX(e);
});
stage.addEventListener('pointermove', e => { if (state === 'play' || state === 'clear') paddle.target = toX(e); });
stage.addEventListener('pointerup', e => {
  if (e.target.closest('button')) return;
  if (ignoreUp) { ignoreUp = false; return; }
  if (state === 'play') launch();
});
ovBtn.addEventListener('click', () => { if (state === 'paused') resume(); else start(); });
pauseBtn.addEventListener('click', () => { pauseBtn.blur(); state === 'paused' ? resume() : pause(); });
addEventListener('keydown', e => {
  const k = e.code;
  if (k === 'ArrowLeft' || k === 'ArrowRight' || k === 'KeyA' || k === 'KeyD') { held.add(k); e.preventDefault(); return; }
  if (k === 'KeyP' || k === 'Escape') { state === 'paused' ? resume() : pause(); return; }
  if (k === 'Space' || k === 'Enter') {
    if (e.target.closest && e.target.closest('button')) return;
    e.preventDefault(); if (e.repeat) return;
    if (state === 'play') launch();
    else if (state === 'paused') resume();
    else if (state === 'ready' || (state === 'over' && performance.now() - overAt > 600)) start();
  }
});
addEventListener('keyup', e => held.delete(e.code));
addEventListener('blur', () => { held.clear(); pause(); });
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });

/* ---------- loop ---------- */
makeLevel(1); balls = [newBall()]; hud();
let lastT = performance.now();
function frame(now) {
  const dt = Math.min(Math.max((now - lastT) / 1000, 0), 1 / 30);
  lastT = now; update(dt); draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
