<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>夜市炸雞排</title>
<style>
:root{--night:#17121f;--lamp:#ffb648;--lantern:#e23b2e;--kraft:#dcbd8c;--marker:#2b1d14;--text:#fff3e0;--muted:#c4b3c6;
  --display:"Chiron GoRound TC","Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;color-scheme:dark}
html{height:100%;box-sizing:border-box;background:var(--night)}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{height:100%;margin:0;overflow:hidden;display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px 16px 14px;
  background:radial-gradient(120% 50% at 50% 0%,#3a2232,var(--night) 70%);color:var(--text);font-family:var(--display);
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
.hud{width:100%;max-width:520px;display:flex;align-items:center;gap:12px}
.brand{flex:1;min-width:0;font-weight:900;font-size:1.1rem;letter-spacing:.1em;white-space:nowrap;color:var(--lamp);text-shadow:0 0 12px rgba(255,182,72,.45)}
.stat{display:flex;flex-direction:column;align-items:flex-end;line-height:1.1}
.stat span{font-size:.64rem;color:var(--muted);letter-spacing:.12em}
.stat b{font-weight:700;font-size:1.25rem;font-variant-numeric:tabular-nums}
.icon-btn{width:34px;height:34px;border-radius:8px;border:1px solid #4a3a52;background:transparent;color:var(--text);cursor:pointer;font-size:.9rem;padding:0}
.icon-btn.off{color:var(--muted);text-decoration:line-through}
.stage{position:relative;flex:1;min-height:0;width:100%;max-width:520px;border-radius:14px;overflow:hidden;touch-action:none;background:#241c2c;box-shadow:0 0 0 1px #3a2c40,0 20px 50px rgba(0,0,0,.5)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.overlay{position:absolute;left:16px;right:16px;top:50%;transform:translateY(-50%) rotate(-1deg);z-index:5;padding:20px 18px 16px;background:var(--kraft);color:var(--marker);box-shadow:0 12px 30px rgba(0,0,0,.45);display:flex;flex-direction:column;gap:10px}
.overlay h1{margin:0;font-weight:900;font-size:1.55rem;letter-spacing:.08em;color:var(--lantern)}
.overlay p{margin:0;font-size:.98rem;line-height:1.7}
.row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.btn{appearance:none;border:0;border-radius:8px;background:var(--lantern);color:#fff;font:900 1rem var(--display);padding:10px 20px;cursor:pointer;letter-spacing:.08em;box-shadow:0 3px 0 #9c2018}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #9c2018}
.keys{font-size:.88rem;color:#6b5236}
.rec{color:var(--lantern);font-weight:700}
</style>
</head>
<body>
<header class="hud">
  <div class="brand">夜市炸雞排</div>
  <div class="stat"><span>客人</span><b id="lives">3</b></div>
  <div class="stat"><span>分數</span><b id="score">0</b></div>
  <div class="stat"><span>最高</span><b id="best">0</b></div>
</header>
<main class="stage" id="stage">
  <canvas id="cv"></canvas>
  <section class="overlay" id="overlay">
    <h1 id="ov-title">炸雞排 客人在排隊</h1>
    <p id="ov-text">點空的油鍋下雞排，炸到金黃再點一次出餐給排最前面的客人。金黃 30 分，炸過頭 15 分，焦掉只能丟掉。三口鍋要顧好，客人等太久會走掉。</p>
    <div class="row"><button class="btn" id="ov-btn">開攤</button><span class="keys" id="ov-keys">三次客人走掉就收攤</span></div>
  </section>
</main>
<script>
(() => {
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const $ = id => document.getElementById(id);
const stage = $('stage'), cv = $('cv'), ctx = cv.getContext('2d'), ov = $('overlay'), ovBtn = $('ov-btn');

let actx = null;
function tone(f1, f2 = f1, dur = .12, type = 'triangle', vol = .06) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + dur + .02);
  } catch (e) {}
}

/* ---------- 共用：寬 400 的畫布座標、結算與上傳 ---------- */
const W = 400, GAME = 'chicken';
let H = 640, S = 1, DPR = 1, state = 'ready', score = 0, overAt = 0, best = store.get(GAME + '.best', 0);
$('best').textContent = best;
function fit() {
  const r = stage.getBoundingClientRect(); if (!r.width) return;
  DPR = Math.min(devicePixelRatio || 1, 2);
  cv.width = Math.round(r.width * DPR); cv.height = Math.round(r.height * DPR);
  S = r.width / W; H = r.height / S;
}
function finish(title, text) {
  state = 'over'; overAt = performance.now();
  const rec = score > best;
  try { parent.postMessage({ type: 'arcade:score', game: GAME, score }, '*'); } catch (e) {}   // 交給大廳上傳排行榜
  if (rec) { best = score; store.set(GAME + '.best', best); $('best').textContent = best; }
  $('ov-title').textContent = title;
  $('ov-text').innerHTML = (rec ? '<span class="rec">新紀錄！</span>' : '') + text + `最高紀錄 ${best} 分。`;
  ovBtn.textContent = '再來一局'; $('ov-keys').textContent = ''; ov.hidden = false;
}
const pos = e => { const r = stage.getBoundingClientRect(); return { x: (e.clientX - r.left) / S, y: (e.clientY - r.top) / S }; };

/* ---------- 規則：雞排熟度看時間；客人各有耐心條 ---------- */
const RAW = 3, GOLD = 4.6, OVER = 6.2;                 // 秒：<RAW 還沒熟，RAW~GOLD 金黃，GOLD~OVER 過頭，之後焦掉
const FX = [80, 200, 320], FR = 46, LIVES = 3, QMAX = 4;
let fryers = [], queue = [], lives = LIVES, combo = 0, spawnT = 0, elapsed = 0, floats = [], fryY = 480;
const stageOf = t => t < RAW ? 'raw' : t < GOLD ? 'gold' : t < OVER ? 'over' : 'burnt';
const COLOR = { raw: '#f3dfb8', gold: '#e8a33a', over: '#a5651f', burnt: '#2b1d14' };
function hud() { $('lives').textContent = lives; $('score').textContent = score; }
function say(text, x, y) { floats.push({ text, x, y, t: 0 }); }
function start() { fryers = FX.map(() => ({ t: -1 })); queue = []; lives = LIVES; score = 0; combo = 0; spawnT = .5; elapsed = 0; floats = []; state = 'play'; hud(); }

function tapFryer(i) {
  const f = fryers[i], x = FX[i];
  if (f.t < 0) { f.t = 0; tone(200, 120, .2, 'sawtooth', .03); return; }            // 下鍋
  const s = stageOf(f.t);
  if (s === 'raw') { say('還沒熟', x, fryY - 60); return; }
  if (s === 'burnt') { f.t = -1; combo = 0; say('焦了，丟掉', x, fryY - 60); tone(160, 90, .2); return; }
  if (!queue.length) { say('沒有客人', x, fryY - 60); return; }
  queue.shift(); f.t = -1;                                                           // 出餐給最前面的客人
  combo = s === 'gold' ? combo + 1 : 0;
  const gain = s === 'gold' ? 30 + Math.min(combo - 1, 6) * 5 : 15;
  score += gain; hud(); say((s === 'gold' ? '金黃 +' : '過頭 +') + gain, x, fryY - 60); tone(600, 1000, .15, 'sine');
}
function update(dt) {
  for (const f of floats) f.t += dt;
  floats = floats.filter(f => f.t < 1);
  if (state !== 'play') return;
  elapsed += dt;
  for (const f of fryers) if (f.t >= 0) f.t += dt;
  spawnT -= dt;
  if (spawnT <= 0 && queue.length < QMAX) {
    const p = Math.max(6, 11 - elapsed * .04);                                       // 越後面客人越沒耐心
    queue.push({ p, max: p, hue: Math.random() * 360 | 0 }); spawnT = Math.max(1.4, 3.2 - elapsed * .02);
  }
  for (const c of queue) c.p -= dt;
  if (queue.length && queue[0].p <= 0) {
    queue.shift(); lives--; combo = 0; hud(); say('客人走了', 70, 110); tone(300, 150, .3);
    if (lives <= 0) finish('收攤囉', `這局 ${score} 分，`);
  }
}
function draw() {
  fryY = H - 150;
  ctx.fillStyle = '#2b1f3a'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#e23b2e'; ctx.fillRect(0, 60, W, 34);                                               // 招牌
  ctx.fillStyle = '#fff3e0'; ctx.font = '900 18px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('香 雞 排', W / 2, 77);
  queue.forEach((c, i) => {                                                                            // 排隊的客人，最左邊是下一位
    const x = 60 + i * 92, y = 170;
    ctx.fillStyle = `hsl(${c.hue} 55% 60%)`; ctx.beginPath(); ctx.arc(x, y + 44, 30, Math.PI, 0); ctx.fill();
    ctx.fillStyle = '#f2c9a0'; ctx.beginPath(); ctx.arc(x, y, 22, 0, 7); ctx.fill();
    ctx.fillStyle = '#2b1d14'; ctx.fillRect(x - 9, y - 4, 4, 5); ctx.fillRect(x + 5, y - 4, 4, 5);
    const r = Math.max(0, c.p / c.max);
    ctx.fillStyle = 'rgba(255,255,255,.2)'; ctx.fillRect(x - 28, y + 54, 56, 6);
    ctx.fillStyle = r > .5 ? '#3fb36b' : r > .25 ? '#ffb648' : '#e23b2e'; ctx.fillRect(x - 28, y + 54, 56 * r, 6);
    if (i === 0) { ctx.fillStyle = '#ffb648'; ctx.font = '700 12px sans-serif'; ctx.fillText('下一位', x, y - 34); }
  });
  ctx.fillStyle = '#5b3d27'; ctx.fillRect(0, fryY - 80, W, H);                                         // 攤位檯面
  fryers.forEach((f, i) => {
    const x = FX[i];
    ctx.fillStyle = '#17121f'; ctx.beginPath(); ctx.arc(x, fryY, FR + 6, 0, 7); ctx.fill();
    ctx.fillStyle = '#c98a1e'; ctx.beginPath(); ctx.arc(x, fryY, FR, 0, 7); ctx.fill();                // 油
    if (f.t < 0) { ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.font = '700 13px sans-serif'; ctx.fillText('點我下鍋', x, fryY); return; }
    const s = stageOf(f.t);
    ctx.fillStyle = COLOR[s]; ctx.beginPath(); ctx.ellipse(x, fryY, 34, 26, -.3, 0, 7); ctx.fill();    // 雞排
    ctx.strokeStyle = s === 'gold' ? '#fff3e0' : 'rgba(255,255,255,.35)'; ctx.lineWidth = s === 'gold' ? 5 : 3;   // 外圈進度，金黃時變亮
    ctx.beginPath(); ctx.arc(x, fryY, FR + 3, -Math.PI / 2, -Math.PI / 2 + Math.min(f.t / OVER, 1) * Math.PI * 2); ctx.stroke();
  });
  ctx.font = '900 17px sans-serif';
  for (const f of floats) { ctx.globalAlpha = 1 - f.t; ctx.fillStyle = '#fff3e0'; ctx.fillText(f.text, f.x, f.y - f.t * 26); }
  ctx.globalAlpha = 1;
}
stage.addEventListener('pointerdown', e => {
  if (e.target.closest('.overlay') || state !== 'play') return;
  e.preventDefault(); const p = pos(e), i = FX.findIndex(x => Math.hypot(p.x - x, p.y - fryY) < FR + 14);
  if (i >= 0) tapFryer(i);
});
addEventListener('keydown', e => { const i = ['Digit1', 'Digit2', 'Digit3'].indexOf(e.code); if (i >= 0 && state === 'play') tapFryer(i); });
fryers = FX.map(() => ({ t: -1 }));

let lastT = performance.now();
function frame(now) {
  const dt = Math.min(Math.max((now - lastT) / 1000, 0), 1 / 30); lastT = now;
  update(dt); ctx.setTransform(DPR * S, 0, 0, DPR * S, 0, 0); draw(now / 1000); requestAnimationFrame(frame);
}
fit();
if ('ResizeObserver' in window) new ResizeObserver(fit).observe(stage); else addEventListener('resize', fit);
ovBtn.addEventListener('click', () => { if (state === 'over' && performance.now() - overAt < 600) return; start(); ov.hidden = true; ovBtn.blur(); });
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
